# Lets Results pods delete their database Secret at startup so ESO mints a new login
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-results-credential-renewal
  namespace: tekton-pipelines
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tekton-results-postgres"]
    verbs: ["get", "list", "watch", "delete"]
---
# tekton-results-watcher is also the retention-policy agent's ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-results-credential-renewal
  namespace: tekton-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-results-credential-renewal
subjects:
  - kind: ServiceAccount
    name: tekton-results-api
    namespace: tekton-pipelines
  - kind: ServiceAccount
    name: tekton-results-watcher
    namespace: tekton-pipelines
