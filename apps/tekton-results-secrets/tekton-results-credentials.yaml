# Dynamic Tekton Results database credentials synced from OpenBao

# Generates fresh dynamic database credentials from OpenBao on every refresh
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: tekton-results-dynamic
  namespace: tekton-pipelines
spec:
  method: GET
  path: database/creds/tekton-results-app-role
  provider:
    server: https://openbao.openbao.svc.cluster.local:8200
    caProvider:
      type: Secret
      name: openbao-ca-bundle
      key: ca.crt
    auth:
      kubernetes:
        mountPath: kubernetes
        role: tekton-results-role
        serviceAccountRef:
          name: tekton-results-openbao-auth
          audiences:
            - openbao
---
# Refresh below tekton-results-app-role's 3h default_ttl; old leases just expire
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tekton-results-postgres
  namespace: tekton-pipelines
spec:
  refreshInterval: ${ESO_DYNAMIC_REFRESH_INTERVAL}
  target:
    name: tekton-results-postgres
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: tekton-results-dynamic
