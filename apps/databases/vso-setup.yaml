# Vault Secrets Operator (VSO) configuration for the databases namespace

# ServiceAccount for VSO authentication
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgis-vault-auth
  namespace: databases
---
# Connection to in-cluster Vault service
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault-connection
  namespace: databases
spec:
  address: https://vault.vault.svc.cluster.local:8200
  caCertSecretRef: vault-ca-bundle
---
# Kubernetes auth configuration for VSO
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth
  namespace: databases
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: postgis-role
    serviceAccount: postgis-vault-auth
    audiences:
      - vault
  vaultConnectionRef: vault-connection