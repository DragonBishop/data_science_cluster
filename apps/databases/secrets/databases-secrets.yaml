# ESO setup and static ExternalSecrets for the databases namespace

# ServiceAccount ESO presents to OpenBao's Kubernetes auth
apiVersion: v1
kind: ServiceAccount
metadata:
  name: databases-openbao-auth
  namespace: databases
---
# Connection and Kubernetes auth to in-cluster OpenBao (KV v2 at secret/)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: databases
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: databases-role
          serviceAccountRef:
            name: databases-openbao-auth
            audiences:
              - openbao
---
# Static PostgreSQL superuser credentials synced from OpenBao
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-superuser-credentials
  namespace: databases
spec:
  refreshInterval: ${ESO_REFRESH_INTERVAL}
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: postgres-superuser-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  dataFrom:
    - extract:
        key: postgres
---
# Barman Cloud's S3 credentials synced from OpenBao
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: barman-s3-credentials
  namespace: databases
spec:
  refreshInterval: ${ESO_REFRESH_INTERVAL}
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: barman-s3-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: barman-s3
