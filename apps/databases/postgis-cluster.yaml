# CloudNativePG PostGIS cluster configuration, Vault credentials,
# backup storage target, and localhost database bridge.

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: postgis-vault-secret
  namespace: databases
spec:
  type: kv-v2
  mount: secret
  path: postgis
  destination:
    name: postgis-app-credentials
    create: true
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
  refreshAfter: ${VSO_REFRESH_AFTER}
  vaultAuthRef: vault-auth
---
# Dynamic database credentials leased from Vault
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: postgis-app-dynamic-secret
  namespace: databases
spec:
  vaultAuthRef: vault-auth
  mount: database
  path: creds/postgis-app-role
  destination:
    name: postgis-app-dynamic-credentials
    create: true
    labels:
      cnpg.io/reload: "true"
---
# S3 object store for WAL archiving and base backups (SeaweedFS)
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgis-backups
  namespace: databases
spec:
  retentionPolicy: "${POSTGIS_BACKUP_RETENTION}"
  configuration:
    destinationPath: s3://${CNPG_BACKUP_BUCKET}/
    endpointURL: https://seaweedfs-s3.databases.svc:${SEAWEEDFS_S3_PORT}
    endpointCA:
      name: postgis-server-cert
      key: ca.crt
    s3Credentials:
      accessKeyId:
        name: seaweedfs-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: seaweedfs-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgis-cluster
  namespace: databases
spec:
  instances: ${POSTGIS_INSTANCES}
  smartShutdownTimeout: ${POSTGIS_SMART_SHUTDOWN_TIMEOUT}
  stopDelay: ${POSTGIS_STOP_DELAY}
  imageName: ghcr.io/cloudnative-pg/postgis:${POSTGRES_VERSION}-${POSTGIS_VERSION}-system-trixie

  resources:
    requests:
      cpu: "${POSTGIS_CPU_REQUEST}"
      memory: "${POSTGIS_MEM_REQUEST}"
    limits:
      memory: "${POSTGIS_MEM_LIMIT}"

  enableSuperuserAccess: true
  superuserSecret:
    name: postgis-app-credentials
  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      secret:
        name: postgis-app-credentials

      # Runs once at initdb to establish the shared read/write role
      postInitSQL:
        - CREATE ROLE app_readwrite NOLOGIN
        - GRANT pg_read_all_data, pg_write_all_data TO app_readwrite

  storage:
    size: ${POSTGIS_STORAGE_SIZE}
    storageClass: ${POSTGIS_STORAGE_CLASS}

  # TLS server certificate and CA issued via cert-manager and OpenBao PKI
  certificates:
    serverTLSSecret: postgis-server-cert
    serverCASecret: postgis-server-cert

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgis-backups
---
# Daily scheduled backup at midnight
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgis-cluster-daily-backup
  namespace: databases
spec:
  schedule: "${POSTGIS_BACKUP_SCHEDULE}"
  immediate: true
  cluster:
    name: postgis-cluster
  backupOwnerReference: cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
