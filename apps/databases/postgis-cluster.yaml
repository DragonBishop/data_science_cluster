# CloudNativePG PostGIS cluster configuration, Vault credentials,
# backup storage target, and localhost database bridge.

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: postgis-vault-secret
  namespace: databases
spec:
  type: kv-v2
  mount: secret
  path: postgis
  destination:
    name: postgis-app-credentials
    create: true
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
  refreshAfter: 1h
  vaultAuthRef: vault-auth
---
# Dynamic database credentials leased from Vault
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: postgis-app-dynamic-secret
  namespace: databases
spec:
  vaultAuthRef: vault-auth
  mount: database
  path: creds/postgis-app-role
  destination:
    name: postgis-app-dynamic-credentials
    create: true
    labels:
      cnpg.io/reload: "true"
---
# S3 object store for WAL archiving and base backups (SeaweedFS)
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgis-backups
  namespace: databases
spec:
  retentionPolicy: "4d"
  configuration:
    destinationPath: s3://cnpg-backups/
    endpointURL: https://seaweedfs-s3.databases.svc:9000
    endpointCA:
      name: postgis-server-cert
      key: ca.crt
    s3Credentials:
      accessKeyId:
        name: seaweedfs-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: seaweedfs-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgis-cluster
  namespace: databases
spec:
  instances: 1
  smartShutdownTimeout: 15
  stopDelay: 60
  imageName: ghcr.io/cloudnative-pg/postgis:18.3-3.6.2-system-trixie

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      memory: "2Gi"

  enableSuperuserAccess: true
  superuserSecret:
    name: postgis-app-credentials
  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      secret:
        name: postgis-app-credentials

      # Runs once at initdb to establish the shared read/write role
      postInitSQL:
        - CREATE ROLE app_readwrite NOLOGIN
        - GRANT pg_read_all_data, pg_write_all_data TO app_readwrite

  storage:
    size: 100Gi
    storageClass: local-path

  # TLS server certificate and CA issued via cert-manager and Vault PKI
  certificates:
    serverTLSSecret: postgis-server-cert
    serverCASecret: postgis-server-cert

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgis-backups
---
# Daily scheduled backup at midnight
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgis-cluster-daily-backup
  namespace: databases
spec:
  schedule: "0 0 0 * * *"
  immediate: true
  cluster:
    name: postgis-cluster
  backupOwnerReference: cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
# Host-network proxy forwarding 127.0.0.1:5432 to postgis-cluster-rw Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-proxy
  namespace: databases
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-proxy
  template:
    metadata:
      labels:
        app: postgres-proxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: socat-bridge
        image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
        command:
          - socat
          - TCP-LISTEN:5432,bind=127.0.0.1,fork,reuseaddr
          - TCP:postgis-cluster-rw.databases.svc.cluster.local:5432
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "32Mi"