apiVersion: v1
kind: ServiceAccount
metadata:
  name: databases-openbao-auth
  namespace: databases
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: barman-s3-credentials
  namespace: databases
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-bootstrap
  namespace: databases
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-bootstrap
  namespace: databases
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
    verbs:
      - get
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-bootstrap
  namespace: databases
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-bootstrap
subjects:
  - kind: ServiceAccount
    name: postgres-bootstrap
    namespace: databases
