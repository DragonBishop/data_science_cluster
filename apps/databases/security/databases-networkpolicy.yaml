apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-cluster
  namespace: databases
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: postgres-cluster
  ingress:
    # Gateway publishes PostgreSQL through postgres-external
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Replication, join and instance status checks between instances
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: postgres-cluster
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # CNPG operator status checks
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # OpenBao creates dynamic database roles
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: openbao
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Metrics over TLS: Prometheus
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
    # Grafana's database
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # core-test checks the server certificate and logins
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tekton-pipelines
            tekton.dev/pipeline: core-test
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
