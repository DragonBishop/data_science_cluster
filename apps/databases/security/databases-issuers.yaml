# Postgres's own CA and the ClusterIssuer that signs Postgres's server certificate with it

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: postgres-ca
  secretName: postgres-ca
  duration: ${LOCAL_CA_ROOT_DURATION}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  issuerRef:
    name: openbao-selfsigned-bootstrap
    kind: ClusterIssuer
---
# A ClusterIssuer reads its CA Secret from cert-manager's namespace
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: postgres-ca-issuer
spec:
  ca:
    secretName: postgres-ca
