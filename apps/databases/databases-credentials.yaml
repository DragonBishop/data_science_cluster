apiVersion: v1
kind: ServiceAccount
metadata:
  name: barman-s3-credentials
  namespace: databases
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: barman-s3-credentials
  namespace: databases
spec:
  provider: openbao
  parameters:
    baoAddress: https://openbao.openbao.svc:8200
    baoCACertPath: /openbao-ca/ca.crt
    roleName: barman-s3-role
    audience: openbao
    objects: |
      - objectName: ACCESS_KEY_ID
        secretPath: seaweedfs/creds/barman
        secretKey: access_key
      - objectName: ACCESS_SECRET_KEY
        secretPath: seaweedfs/creds/barman
        secretKey: secret_key
  secretObjects:
    - secretName: barman-s3-credentials
      type: Opaque
      data:
        - objectName: ACCESS_KEY_ID
          key: ACCESS_KEY_ID
        - objectName: ACCESS_SECRET_KEY
          key: ACCESS_SECRET_KEY
---
# CNPG pods can't mount CSI volumes, so this pod holds the mount the Secret is mirrored from
apiVersion: apps/v1
kind: Deployment
metadata:
  name: barman-s3-credentials
  namespace: databases
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: barman-s3-credentials
  template:
    metadata:
      labels:
        app.kubernetes.io/name: barman-s3-credentials
    spec:
      serviceAccountName: barman-s3-credentials
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
      containers:
        - name: hold
          image: registry.k8s.io/pause:${PAUSE_IMAGE_TAG}
          resources:
            requests:
              cpu: ${BARMAN_S3_CREDENTIALS_CPU_REQUEST}
              memory: ${BARMAN_S3_CREDENTIALS_MEM_REQUEST}
            limits:
              memory: ${BARMAN_S3_CREDENTIALS_MEM_LIMIT}
          volumeMounts:
            - name: barman-s3-credentials
              mountPath: /mnt/barman-s3-credentials
              readOnly: true
      volumes:
        - name: barman-s3-credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: barman-s3-credentials
