# postgis-tcproute.yaml
#
# Raw TCP passthrough to the CNPG primary through the shared Gateway
# (infrastructure/gateway/). postgis.internal (postgis-tls.yaml) is a
# human-friendly way to reach the same IP; TCPRoute itself never inspects it.
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: postgis-external
  namespace: databases
spec:
  parentRefs:
    - name: internal-gateway
      namespace: gateway
      sectionName: postgres
  rules:
    - backendRefs:
        - name: postgis-cluster-rw
          port: 5432
