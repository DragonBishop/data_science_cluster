apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - databases-backups.yaml
  - databases-credentials.yaml
# postgres-bootstrap creates the Cluster from the same file the databases-cluster Kustomization applies
configMapGenerator:
  - name: postgres-bootstrap-cluster
    namespace: databases
    files:
      - ../cluster/databases-cluster.yaml
    options:
      disableNameSuffixHash: true
