# TCPRoute for external PostgreSQL access via internal-gateway
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: postgres-external
  namespace: databases
spec:
  parentRefs:
    - name: internal-gateway
      namespace: gateway
      sectionName: postgres
  rules:
    - backendRefs:
        - name: postgres-cluster-rw
          port: 5432
