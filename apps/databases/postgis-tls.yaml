# postgis-tls.yaml
#
# Mints the Postgres server certificate Secret (postgis-server-cert) for CNPG
# via the centralized Vault PKI ClusterIssuer (vault-pki-issuer).
#
# Emits tls.crt, tls.key, and ca.crt on a 30d rotation cycle for CNPG's
# serverTLSSecret and serverCASecret. Requires cert-manager and Vault.

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgis-server-cert
  namespace: databases
spec:
  secretName: postgis-server-cert
  duration: 720h
  renewBefore: 120h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - postgis-cluster-rw
    - postgis-cluster-rw.databases
    - postgis-cluster-rw.databases.svc
    - postgis-cluster-rw.databases.svc.cluster.local
    - postgis-cluster-ro
    - postgis-cluster-ro.databases.svc.cluster.local
    - postgis-cluster-r
    - postgis-cluster-r.databases.svc.cluster.local
    - localhost
    - postgis.internal
  ipAddresses:
    - 127.0.0.1
    - ${GATEWAY_IP}
  issuerRef:
    name: vault-pki-issuer
    kind: ClusterIssuer