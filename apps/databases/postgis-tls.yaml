# PostgreSQL server TLS certificate issued via Vault PKI ClusterIssuer
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgis-server-cert
  namespace: databases
spec:
  secretName: postgis-server-cert
  duration: 720h
  renewBefore: 120h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - postgis-cluster-rw
    - postgis-cluster-rw.databases
    - postgis-cluster-rw.databases.svc
    - postgis-cluster-rw.databases.svc.cluster.local
    - postgis-cluster-ro
    - postgis-cluster-ro.databases.svc.cluster.local
    - postgis-cluster-r
    - postgis-cluster-r.databases.svc.cluster.local
    - localhost
    - postgis.internal
  ipAddresses:
    - 127.0.0.1
    - ${GATEWAY_IP}
  issuerRef:
    name: vault-pki-issuer
    kind: ClusterIssuer
---
# SeaweedFS S3 server TLS certificate issued via Vault PKI ClusterIssuer
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: seaweedfs-s3-tls
  namespace: databases
spec:
  secretName: seaweedfs-s3-tls
  duration: 720h
  renewBefore: 120h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - seaweedfs-s3
    - seaweedfs-s3.databases
    - seaweedfs-s3.databases.svc
    - seaweedfs-s3.databases.svc.cluster.local
    - localhost
  issuerRef:
    name: vault-pki-issuer
    kind: ClusterIssuer