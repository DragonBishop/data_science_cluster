# PostgreSQL server TLS certificate issued via OpenBao PKI ClusterIssuer
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgis-server-cert
  namespace: databases
spec:
  secretName: postgis-server-cert
  duration: ${OPENBAO_PKI_CERT_DURATION}
  renewBefore: ${OPENBAO_PKI_CERT_RENEW_BEFORE}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  dnsNames:
    - postgis-cluster-rw
    - postgis-cluster-rw.databases
    - postgis-cluster-rw.databases.svc
    - postgis-cluster-rw.databases.svc.cluster.local
    - postgis-cluster-ro
    - postgis-cluster-ro.databases.svc.cluster.local
    - postgis-cluster-r
    - postgis-cluster-r.databases.svc.cluster.local
    - localhost
    - postgis.${INTERNAL_DOMAIN}
  ipAddresses:
    - 127.0.0.1
    - ${GATEWAY_IP}
  issuerRef:
    name: openbao-pki-issuer
    kind: ClusterIssuer
