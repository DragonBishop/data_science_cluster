# postgis-tls.yaml
#
# Generates a custom self-signed CA and server certificate via cert-manager 
# for the CloudNativePG cluster. The certificate includes localhost/127.0.0.1 
# to support sslmode=verify-full over the socat proxy, alongside the required 
# in-cluster service DNS names.
#
# Apply this file before postgis-cluster.yaml. Requires cert-manager.

apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: postgis-selfsigned-bootstrap
  namespace: databases
spec:
  selfSigned: {}
---
# Creates a dedicated, long-lived local CA for the PostGIS cluster using 
# the self-signed bootstrap Issuer.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgis-local-ca
  namespace: databases
spec:
  isCA: true
  commonName: postgis-local-ca
  secretName: postgis-local-ca-secret
  duration: 87600h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: postgis-selfsigned-bootstrap
    kind: Issuer
---
# An Issuer backed by the local CA, used to mint the PostGIS server certificate.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: postgis-ca-issuer
  namespace: databases
spec:
  ca:
    secretName: postgis-local-ca-secret
---
# Generates the server certificate Secret (containing tls.crt, tls.key, and ca.crt) 
# for the CNPG cluster, valid for 90 days with auto-renewal.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgis-server-cert
  namespace: databases
spec:
  secretName: postgis-server-cert
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - postgis-cluster-rw
    - postgis-cluster-rw.databases
    - postgis-cluster-rw.databases.svc
    - postgis-cluster-rw.databases.svc.cluster.local
    - postgis-cluster-ro
    - postgis-cluster-ro.databases.svc.cluster.local
    - postgis-cluster-r
    - postgis-cluster-r.databases.svc.cluster.local
    - localhost
    - postgis.internal   # resolves via the internal zone on k3s's own CoreDNS
  ipAddresses:
    - 127.0.0.1
    - ${GATEWAY_IP}   # the shared Gateway's IP (infrastructure/gateway/)
  issuerRef:
    name: postgis-ca-issuer
    kind: Issuer