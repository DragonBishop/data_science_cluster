apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgis-ingress
  namespace: databases
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: postgis-cluster
  ingress:
    # CNPG operator status checks
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # OpenBao creates dynamic database roles
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: openbao
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
