# Postgres's server and replication certificates from the Postgres CA, and the Bundles that publish the CAs

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-server-cert
  namespace: databases
spec:
  secretName: postgres-server-cert
  secretTemplate:
    labels:
      cnpg.io/reload: ""
  usages:
    - server auth
  duration: ${OPENBAO_PKI_CERT_DURATION}
  renewBefore: ${OPENBAO_PKI_CERT_RENEW_BEFORE}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  dnsNames:
    - postgres-cluster-rw
    - postgres-cluster-rw.databases
    - postgres-cluster-rw.databases.svc
    - postgres-cluster-rw.databases.svc.cluster.local
    - postgres-cluster-ro
    - postgres-cluster-ro.databases.svc.cluster.local
    - postgres-cluster-r
    - postgres-cluster-r.databases.svc.cluster.local
    - localhost
    - databases.${INTERNAL_DOMAIN}
  ipAddresses:
    - 127.0.0.1
    - ${GATEWAY_IP}
  issuerRef:
    name: postgres-ca-issuer
    kind: ClusterIssuer
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: postgres-ca                 # trust-manager names each target ConfigMap after the Bundle
spec:
  sources:
    - secret:
        name: postgres-ca
        key: tls.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        data-cluster/ca-bundles: "true"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-replication-cert
  namespace: databases
spec:
  secretName: postgres-replication-cert
  secretTemplate:
    labels:
      cnpg.io/reload: ""
  commonName: streaming_replica
  usages:
    - client auth
  duration: ${OPENBAO_PKI_CERT_DURATION}
  renewBefore: ${OPENBAO_PKI_CERT_RENEW_BEFORE}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  issuerRef:
    name: postgres-ca-issuer
    kind: ClusterIssuer
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: postgres-client-ca          # CNPG's clientCASecret: the Root CA for SVIDs, the Postgres CA for replication
spec:
  sources:
    - secret:
        name: openbao-root-ca-source
        key: ca.crt
    - secret:
        name: postgres-ca
        key: tls.crt
  target:
    secret:
      key: ca.crt
      metadata:
        labels:
          cnpg.io/reload: ""
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: databases
