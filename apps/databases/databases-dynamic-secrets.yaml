# Dynamic database credentials; they need postgres-cluster-rw, so they deploy beside it

# Generates fresh dynamic database credentials from OpenBao on every refresh
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: postgres-app-dynamic
  namespace: databases
spec:
  method: GET
  path: database/creds/postgres-app-role
  provider:
    server: https://openbao.openbao.svc.cluster.local:8200
    caProvider:
      type: Secret
      name: openbao-ca-bundle
      key: ca.crt
    auth:
      kubernetes:
        mountPath: kubernetes
        role: databases-role
        serviceAccountRef:
          name: databases-openbao-auth
          audiences:
            - openbao
---
# Refresh below postgres-app-role's 3h default_ttl; old leases just expire
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-app-dynamic-credentials
  namespace: databases
spec:
  refreshInterval: ${ESO_DYNAMIC_REFRESH_INTERVAL}
  target:
    name: postgres-app-dynamic-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: postgres-app-dynamic
