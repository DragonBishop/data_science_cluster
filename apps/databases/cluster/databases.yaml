apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: data-science
  namespace: databases
spec:
  name: ${DATA_SCIENCE_DB_NAME}
  owner: app_readwrite
  cluster:
    name: postgres-cluster
  schemas:
    - name: topology
      owner: app_readwrite
    - name: tiger
      owner: app_readwrite
  extensions:
    - name: fuzzystrmatch
      schema: public
    - name: postgis
      schema: public
    - name: postgis_topology
      schema: topology
    - name: postgis_tiger_geocoder
      schema: tiger
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: grafana
  namespace: databases
spec:
  name: ${GRAFANA_DB_NAME}
  owner: grafana_readwrite
  cluster:
    name: postgres-cluster
