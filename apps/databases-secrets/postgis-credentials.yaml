# Static PostGIS credentials synced from OpenBao

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgis-app-credentials
  namespace: databases
spec:
  refreshInterval: ${ESO_REFRESH_INTERVAL}
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: postgis-app-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  dataFrom:
    - extract:
        key: postgis
