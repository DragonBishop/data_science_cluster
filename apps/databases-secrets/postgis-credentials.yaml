# Static and dynamic PostGIS credentials synced from OpenBao

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgis-app-credentials
  namespace: databases
spec:
  refreshInterval: ${ESO_REFRESH_INTERVAL}
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: postgis-app-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  dataFrom:
    - extract:
        key: postgis
---
# Generates fresh dynamic database credentials from OpenBao on every refresh
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: postgis-app-dynamic
  namespace: databases
spec:
  method: GET
  path: database/creds/postgis-app-role
  provider:
    server: https://openbao.openbao.svc.cluster.local:8200
    caProvider:
      type: Secret
      name: openbao-ca-bundle
      key: ca.crt
    auth:
      kubernetes:
        mountPath: kubernetes
        role: postgis-role
        serviceAccountRef:
          name: postgis-openbao-auth
          audiences:
            - openbao
---
# Refresh below postgis-app-role's 3h default_ttl; old leases just expire
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgis-app-dynamic-credentials
  namespace: databases
spec:
  refreshInterval: ${ESO_DYNAMIC_REFRESH_INTERVAL}
  target:
    name: postgis-app-dynamic-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: postgis-app-dynamic
