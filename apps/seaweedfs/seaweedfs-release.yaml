apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  interval: 24h
  url: https://seaweedfs.github.io/seaweedfs/helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  interval: 1h
  releaseName: seaweedfs
  chart:
    spec:
      chart: seaweedfs
      version: "${SEAWEEDFS_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
  install:
    remediation:
      retries: ${SEAWEEDFS_HELM_RETRIES}
  upgrade:
    remediation:
      retries: ${SEAWEEDFS_HELM_RETRIES}
      remediateLastFailure: true
  values:
    # gRPC mTLS between master, filer, volume and S3, from the chart's own cert-manager CA
    global:
      seaweedfs:
        enableSecurity: true
        # HTTPS between master, filer, volume and S3, each client verifying against the chart's CA
        extraEnvironmentVars:
          WEED_HTTPS_CLIENT_ENABLED: "true"
          WEED_HTTPS_CLIENT_CA: /usr/local/share/ca-certificates/ca/tls.crt
    certificates:
      # Volume servers advertise <pod>.seaweedfs-volume.seaweedfs, which *.seaweedfs doesn't cover
      dnsNames:
        - "*.seaweedfs-volume.seaweedfs"
      keyAlgorithm: ${CERT_KEY_ALGORITHM}
      keySize: ${CERT_KEY_SIZE}
      duration: ${LOCAL_CA_CERT_DURATION}
      renewBefore: ${LOCAL_CA_CERT_RENEW_BEFORE}
      ca:
        duration: ${LOCAL_CA_ROOT_DURATION}
    # One policy per component, admitting the release's own pods on that component's ports
    networkPolicy:
      enabled: true
      components:
        s3:
          extraIngress:
            # Barman Cloud WAL archiving and base backups
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: databases
                  podSelector:
                    matchLabels:
                      cnpg.io/cluster: postgres-cluster
              ports:
                - protocol: TCP
                  port: ${SEAWEEDFS_S3_PORT}
            # core-test checks the S3 certificate
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: tekton-pipelines
                  podSelector:
                    matchLabels:
                      tekton.dev/pipeline: core-test
              ports:
                - protocol: TCP
                  port: ${SEAWEEDFS_S3_PORT}
    master:
      ipBind: "0.0.0.0"
      extraEnvironmentVars:
        WEED_HTTPS_MASTER_CERT: /usr/local/share/ca-certificates/master/tls.crt
        WEED_HTTPS_MASTER_KEY: /usr/local/share/ca-certificates/master/tls.key
      livenessProbe:
        httpGet:
          scheme: HTTPS
      readinessProbe:
        httpGet:
          scheme: HTTPS
      data:
        type: "hostPath"
        hostPathPrefix: "${SEAWEEDFS_HOST_PATH}"
      resources:
        requests:
          cpu: ${SEAWEEDFS_MASTER_CPU_REQUEST}
          memory: ${SEAWEEDFS_MASTER_MEM_REQUEST}
        limits:
          memory: ${SEAWEEDFS_MASTER_MEM_LIMIT}
    filer:
      ipBind: "0.0.0.0"
      extraEnvironmentVars:
        WEED_HTTPS_FILER_CERT: /usr/local/share/ca-certificates/filer/tls.crt
        WEED_HTTPS_FILER_KEY: /usr/local/share/ca-certificates/filer/tls.key
        WEED_HTTPS_FILER_DISABLE_TLS_VERIFY_CLIENT_CERT: "true"
      livenessProbe:
        httpGet:
          scheme: HTTPS
      readinessProbe:
        httpGet:
          scheme: HTTPS
      data:
        type: "hostPath"
        hostPathPrefix: "${SEAWEEDFS_HOST_PATH}"
      resources:
        requests:
          cpu: ${SEAWEEDFS_FILER_CPU_REQUEST}
          memory: ${SEAWEEDFS_FILER_MEM_REQUEST}
        limits:
          memory: ${SEAWEEDFS_FILER_MEM_LIMIT}
    volume:
      extraEnvironmentVars:
        WEED_HTTPS_VOLUME_CERT: /usr/local/share/ca-certificates/volume/tls.crt
        WEED_HTTPS_VOLUME_KEY: /usr/local/share/ca-certificates/volume/tls.key
      livenessProbe:
        httpGet:
          scheme: HTTPS
      readinessProbe:
        httpGet:
          scheme: HTTPS
      dataDirs:
        - name: data1
          type: "hostPath"
          hostPathPrefix: "${SEAWEEDFS_HOST_PATH}"
          maxVolumes: ${SEAWEEDFS_MAX_VOLUMES}
      resources:
        requests:
          cpu: ${SEAWEEDFS_VOLUME_CPU_REQUEST}
          memory: ${SEAWEEDFS_VOLUME_MEM_REQUEST}
        limits:
          memory: ${SEAWEEDFS_VOLUME_MEM_LIMIT}
    s3:
      enabled: true
      resources:
        requests:
          cpu: ${SEAWEEDFS_S3_CPU_REQUEST}
          memory: ${SEAWEEDFS_S3_MEM_REQUEST}
        limits:
          memory: ${SEAWEEDFS_S3_MEM_LIMIT}
      port: ${SEAWEEDFS_S3_PORT}
      createBuckets:
        - name: ${CNPG_BACKUP_BUCKET}
      livenessProbe:
        httpGet:
          scheme: HTTPS
      readinessProbe:
        httpGet:
          scheme: HTTPS
      # S3 TLS certificates provisioned via cert-manager seaweedfs-s3-tls Certificate
      # backed by openbao-pki-issuer.
      extraArgs:
        - "-cert.file=/var/run/secrets/seaweedfs.io/tls.crt"
        - "-key.file=/var/run/secrets/seaweedfs.io/tls.key"
        - "-config=/var/run/secrets/seaweedfs-config/config"
      extraVolumeMounts: |
        - name: seaweedfs-tls
          mountPath: /var/run/secrets/seaweedfs.io
          readOnly: true
        - name: seaweedfs-config
          mountPath: /var/run/secrets/seaweedfs-config
          readOnly: true
      extraVolumes: |
        - name: seaweedfs-tls
          secret:
            secretName: seaweedfs-s3-tls
        - name: seaweedfs-config
          secret:
            secretName: seaweedfs-credentials
