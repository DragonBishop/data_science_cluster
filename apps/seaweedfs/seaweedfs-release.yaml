apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: seaweedfs
  namespace: databases
spec:
  interval: 24h
  url: https://seaweedfs.github.io/seaweedfs/helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: databases
spec:
  interval: 1h
  releaseName: seaweedfs
  chart:
    spec:
      chart: seaweedfs
      version: "${SEAWEEDFS_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
  values:
    # One policy per component, admitting the release's own pods on that component's ports
    networkPolicy:
      enabled: true
      components:
        s3:
          extraIngress:
            # Barman Cloud WAL archiving and base backups
            - from:
                - podSelector:
                    matchLabels:
                      cnpg.io/cluster: postgis-cluster
              ports:
                - protocol: TCP
                  port: ${SEAWEEDFS_S3_PORT}
    master:
      ipBind: "0.0.0.0"
      data:
        type: "hostPath"
        hostPathPrefix: "${SEAWEEDFS_HOST_PATH}"
      resources:
        requests:
          cpu: ${SEAWEEDFS_MASTER_CPU_REQUEST}
          memory: ${SEAWEEDFS_MASTER_MEM_REQUEST}
        limits:
          memory: ${SEAWEEDFS_MASTER_MEM_LIMIT}
    filer:
      ipBind: "0.0.0.0"
      data:
        type: "hostPath"
        hostPathPrefix: "${SEAWEEDFS_HOST_PATH}"
      resources:
        requests:
          cpu: ${SEAWEEDFS_FILER_CPU_REQUEST}
          memory: ${SEAWEEDFS_FILER_MEM_REQUEST}
        limits:
          memory: ${SEAWEEDFS_FILER_MEM_LIMIT}
    volume:
      dataDirs:
        - name: data1
          type: "hostPath"
          hostPathPrefix: "${SEAWEEDFS_HOST_PATH}"
          maxVolumes: ${SEAWEEDFS_MAX_VOLUMES}
      resources:
        requests:
          cpu: ${SEAWEEDFS_VOLUME_CPU_REQUEST}
          memory: ${SEAWEEDFS_VOLUME_MEM_REQUEST}
        limits:
          memory: ${SEAWEEDFS_VOLUME_MEM_LIMIT}
    s3:
      enabled: true
      resources:
        requests:
          cpu: ${SEAWEEDFS_S3_CPU_REQUEST}
          memory: ${SEAWEEDFS_S3_MEM_REQUEST}
        limits:
          memory: ${SEAWEEDFS_S3_MEM_LIMIT}
      port: ${SEAWEEDFS_S3_PORT}
      createBuckets:
        - name: ${CNPG_BACKUP_BUCKET}
      livenessProbe:
        httpGet:
          scheme: HTTPS
      readinessProbe:
        httpGet:
          scheme: HTTPS
      # S3 TLS certificates provisioned via cert-manager seaweedfs-s3-tls Certificate
      # backed by openbao-pki-issuer.
      extraArgs:
        - "-cert.file=/var/run/secrets/seaweedfs.io/tls.crt"
        - "-key.file=/var/run/secrets/seaweedfs.io/tls.key"
        - "-config=/var/run/secrets/seaweedfs-config/config"
      extraVolumeMounts: |
        - name: seaweedfs-tls
          mountPath: /var/run/secrets/seaweedfs.io
          readOnly: true
        - name: seaweedfs-config
          mountPath: /var/run/secrets/seaweedfs-config
          readOnly: true
      extraVolumes: |
        - name: seaweedfs-tls
          secret:
            secretName: seaweedfs-s3-tls
        - name: seaweedfs-config
          secret:
            secretName: seaweedfs-credentials
