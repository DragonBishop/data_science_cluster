apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  interval: 24h
  url: https://seaweedfs.github.io/seaweedfs/helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  interval: 1h
  driftDetection:
    mode: enabled
  releaseName: seaweedfs
  chart:
    spec:
      chart: seaweedfs
      version: "${SEAWEEDFS_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
  install:
    remediation:
      retries: ${SEAWEEDFS_HELM_RETRIES}
  upgrade:
    remediation:
      retries: ${SEAWEEDFS_HELM_RETRIES}
      remediateLastFailure: true
  # Ghostunnel serves metrics to Prometheus; appended last
  postRenderers:
    - kustomize:
        patches:
          # Chart monitors verify Ghostunnel's SPIRE DNS name.
          - target:
              kind: ServiceMonitor
              name: seaweedfs-(master|filer|volume|s3)
            patch: |
              - op: remove
                path: /spec/endpoints/0/port
              - op: add
                path: /spec/endpoints/0/targetPort
                value: metrics-tls
              - op: add
                path: /spec/endpoints/0/scheme
                value: https
              - op: add
                path: /spec/endpoints/0/tlsConfig
                value:
                  serverName: seaweedfs.metrics.spiffe
          - target:
              kind: (StatefulSet|Deployment)
              labelSelector: app.kubernetes.io/component in (master,filer,volume,s3)
            patch: |
              - op: add
                path: /spec/template/metadata/labels/data-cluster~1metrics-tls
                value: "true"
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: spiffe-workload-api
                  csi:
                    driver: csi.spiffe.io
                    readOnly: true
              - op: add
                path: /spec/template/spec/containers/-
                value:
                  name: metrics-tls
                  image: ghostunnel/ghostunnel:${GHOSTUNNEL_VERSION}
                  args:
                    - server
                    - --listen=0.0.0.0:${METRICS_TLS_PORT}
                    - --target=127.0.0.1:9327
                    - --use-workload-api-addr=unix:///spiffe-workload-api/spire-agent.sock
                    - --allow-uri=spiffe://cluster.internal/ns/observability/sa/prometheus
                  ports:
                    - name: metrics-tls
                      containerPort: ${METRICS_TLS_PORT}
                      protocol: TCP
                  securityContext:
                    runAsUser: 65532
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: [ALL]
                    seccompProfile:
                      type: RuntimeDefault
                  resources:
                    requests:
                      cpu: ${METRICS_TLS_CPU_REQUEST}
                      memory: ${METRICS_TLS_MEM_REQUEST}
                    limits:
                      memory: ${METRICS_TLS_MEM_LIMIT}
                  volumeMounts:
                    - name: spiffe-workload-api
                      mountPath: /spiffe-workload-api
                      readOnly: true
  values:
    # gRPC mTLS between master, filer, volume and S3, from the chart's own cert-manager CA
    global:
      seaweedfs:
        enableSecurity: true
        # Chart ServiceMonitors; no push gateway
        monitoring:
          enabled: true
        createClusterRole: false
        automountServiceAccountToken: false
        # HTTPS between master, filer, volume and S3, each client verifying against the chart's CA
        extraEnvironmentVars:
          WEED_HTTPS_CLIENT_ENABLED: "true"
          WEED_HTTPS_CLIENT_CA: /usr/local/share/ca-certificates/ca/tls.crt
    certificates:
      # Volume servers advertise <pod>.seaweedfs-volume.seaweedfs, which *.seaweedfs doesn't cover
      dnsNames:
        - "*.seaweedfs-volume.seaweedfs"
      keyAlgorithm: ${CERT_KEY_ALGORITHM}
      keySize: ${CERT_KEY_SIZE}
      duration: ${LOCAL_CA_CERT_DURATION}
      renewBefore: ${LOCAL_CA_CERT_RENEW_BEFORE}
      ca:
        duration: ${LOCAL_CA_ROOT_DURATION}
    # One policy per component, admitting the release's own pods on that component's ports
    networkPolicy:
      enabled: true
      components:
        s3:
          extraIngress:
            # Ghostunnel metrics
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: observability
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: prometheus
              ports:
                - protocol: TCP
                  port: ${METRICS_TLS_PORT}
            # Barman Cloud WAL archiving and base backups
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: databases
                  podSelector:
                    matchLabels:
                      cnpg.io/cluster: postgres-cluster
              ports:
                - protocol: TCP
                  port: ${SEAWEEDFS_S3_PORT}
            # OpenBao's secrets-aws plugin creates and deletes IAM users, and its snapshot agent uploads Raft snapshots
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: openbao
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: openbao
              ports:
                - protocol: TCP
                  port: ${SEAWEEDFS_S3_PORT}
            # postgres-bootstrap reads the backup catalog before creating the Cluster
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: databases
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: postgres-bootstrap
              ports:
                - protocol: TCP
                  port: ${SEAWEEDFS_S3_PORT}
            # Loki's bucket
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: observability
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: loki
                      app.kubernetes.io/component: single-binary
              ports:
                - protocol: TCP
                  port: ${SEAWEEDFS_S3_PORT}
            # core-test checks the S3 certificate
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: tekton-pipelines
                  podSelector:
                    matchLabels:
                      tekton.dev/pipeline: core-test
              ports:
                - protocol: TCP
                  port: ${SEAWEEDFS_S3_PORT}
        master:
          extraIngress:
            # Ghostunnel metrics
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: observability
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: prometheus
              ports:
                - protocol: TCP
                  port: ${METRICS_TLS_PORT}
            # core-test checks that gRPC refuses a client without a certificate
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: tekton-pipelines
                  podSelector:
                    matchLabels:
                      tekton.dev/pipeline: core-test
              ports:
                - protocol: TCP
                  port: 19333
        filer:
          extraIngress:
            # Ghostunnel metrics
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: observability
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: prometheus
              ports:
                - protocol: TCP
                  port: ${METRICS_TLS_PORT}
            # core-test checks that gRPC refuses a client without a certificate
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: tekton-pipelines
                  podSelector:
                    matchLabels:
                      tekton.dev/pipeline: core-test
              ports:
                - protocol: TCP
                  port: 18888
        volume:
          extraIngress:
            # Ghostunnel metrics
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: observability
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: prometheus
              ports:
                - protocol: TCP
                  port: ${METRICS_TLS_PORT}
            # core-test checks that gRPC refuses a client without a certificate
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: tekton-pipelines
                  podSelector:
                    matchLabels:
                      tekton.dev/pipeline: core-test
              ports:
                - protocol: TCP
                  port: 18080
    master:
      ipBind: "0.0.0.0"
      metricsIp: 127.0.0.1
      # Deletes multipart uploads a killed backup left unfinished
      config: |-
        [master.maintenance]
        scripts = """
          lock
          s3.clean.uploads -timeAgo=24h
          unlock
        """
        sleep_minutes = 17
      extraEnvironmentVars:
        WEED_HTTPS_MASTER_CERT: /usr/local/share/ca-certificates/master/tls.crt
        WEED_HTTPS_MASTER_KEY: /usr/local/share/ca-certificates/master/tls.key
      livenessProbe:
        httpGet:
          scheme: HTTPS
      readinessProbe:
        httpGet:
          scheme: HTTPS
      data:
        type: "hostPath"
        hostPathPrefix: "${SEAWEEDFS_HOST_PATH}"
      resources:
        requests:
          cpu: ${SEAWEEDFS_MASTER_CPU_REQUEST}
          memory: ${SEAWEEDFS_MASTER_MEM_REQUEST}
        limits:
          memory: ${SEAWEEDFS_MASTER_MEM_LIMIT}
    filer:
      ipBind: "0.0.0.0"
      metricsIp: 127.0.0.1
      extraEnvironmentVars:
        WEED_HTTPS_FILER_CERT: /usr/local/share/ca-certificates/filer/tls.crt
        WEED_HTTPS_FILER_KEY: /usr/local/share/ca-certificates/filer/tls.key
        WEED_HTTPS_FILER_DISABLE_TLS_VERIFY_CLIENT_CERT: "true"
      livenessProbe:
        httpGet:
          scheme: HTTPS
      readinessProbe:
        httpGet:
          scheme: HTTPS
      data:
        type: "hostPath"
        hostPathPrefix: "${SEAWEEDFS_HOST_PATH}"
      resources:
        requests:
          cpu: ${SEAWEEDFS_FILER_CPU_REQUEST}
          memory: ${SEAWEEDFS_FILER_MEM_REQUEST}
        limits:
          memory: ${SEAWEEDFS_FILER_MEM_LIMIT}
    volume:
      metricsIp: 127.0.0.1
      extraEnvironmentVars:
        WEED_HTTPS_VOLUME_CERT: /usr/local/share/ca-certificates/volume/tls.crt
        WEED_HTTPS_VOLUME_KEY: /usr/local/share/ca-certificates/volume/tls.key
      livenessProbe:
        httpGet:
          scheme: HTTPS
      readinessProbe:
        httpGet:
          scheme: HTTPS
      dataDirs:
        - name: data1
          type: "hostPath"
          hostPathPrefix: "${SEAWEEDFS_HOST_PATH}"
          maxVolumes: ${SEAWEEDFS_MAX_VOLUMES}
      resources:
        requests:
          cpu: ${SEAWEEDFS_VOLUME_CPU_REQUEST}
          memory: ${SEAWEEDFS_VOLUME_MEM_REQUEST}
        limits:
          memory: ${SEAWEEDFS_VOLUME_MEM_LIMIT}
    s3:
      enabled: true
      serviceAccountName: seaweedfs
      resources:
        requests:
          cpu: ${SEAWEEDFS_S3_CPU_REQUEST}
          memory: ${SEAWEEDFS_S3_MEM_REQUEST}
        limits:
          memory: ${SEAWEEDFS_S3_MEM_LIMIT}
      port: ${SEAWEEDFS_S3_PORT}
      createBuckets:
        - name: ${CNPG_BACKUP_BUCKET}
        - name: ${OPENBAO_SNAPSHOT_BUCKET}
        - name: ${LOKI_BUCKET}
      livenessProbe:
        httpGet:
          scheme: HTTPS
      readinessProbe:
        httpGet:
          scheme: HTTPS
      # S3 TLS certificates provisioned via cert-manager seaweedfs-s3-tls Certificate
      # backed by openbao-pki-issuer.
      extraArgs:
        - "-cert.file=/var/run/secrets/seaweedfs.io/tls.crt"
        - "-key.file=/var/run/secrets/seaweedfs.io/tls.key"
        - "-config=/var/run/secrets/seaweedfs-config/config"
        # The static identity is fixed; OpenBao manages the rest through the IAM API
        - "-iam.readOnly=false"
        - "-metricsIp=127.0.0.1"
      extraVolumeMounts: |
        - name: seaweedfs-tls
          mountPath: /var/run/secrets/seaweedfs.io
          readOnly: true
        - name: seaweedfs-config
          mountPath: /var/run/secrets/seaweedfs-config
          readOnly: true
      extraVolumes: |
        - name: seaweedfs-tls
          secret:
            secretName: seaweedfs-s3-tls
        - name: seaweedfs-config
          secret:
            secretName: seaweedfs-credentials
