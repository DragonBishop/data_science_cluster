# ESO setup and the SeaweedFS S3 identity config for the seaweedfs namespace

# ServiceAccount ESO presents to OpenBao's Kubernetes auth
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seaweedfs-openbao-auth
  namespace: seaweedfs
---
# Connection and Kubernetes auth to in-cluster OpenBao (KV v2 at secret/)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: seaweedfs
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: seaweedfs-role
          serviceAccountRef:
            name: seaweedfs-openbao-auth
            audiences:
              - openbao
---
# S3 identity config the SeaweedFS S3 gateway loads at start
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-credentials
  namespace: seaweedfs
spec:
  refreshInterval: ${ESO_REFRESH_INTERVAL}
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: seaweedfs-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: seaweedfs
