---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

provisioner:
  name: ansible
  connection_options:
    ansible_connection:
      containers.podman.podman
  ansible_args:
    - --extra-vars=target_host=data-cluster-test

platforms:
  - name: data-cluster-test

verifier:
  name: ansible
ansible:
  executor:
    backend: ansible-playbook
  cfg:
    defaults:
      collections_path: collections
      host_key_checking: false
      timeout: 30

scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
