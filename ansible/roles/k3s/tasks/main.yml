---
- name: Create /etc/rancher/k3s directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    mode: "0755"
    state: directory
  become: true

- name: Write k3s config.yaml
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
    content: |
      write-kubeconfig-mode: "0644"
      write-kubeconfig: "{{ kubeconfig_path }}"
      disable:
        - traefik
        - servicelb
      disable-kube-proxy: true
      disable-network-policy: true
      flannel-backend: none
      secrets-encryption: true
  become: true

- name: Confirm k3s install
  ansible.builtin.command: k3s -v
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Check for Cilium runtime state left by a previous cluster
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /sys/class/net/cilium_host
    - /run/cilium
  register: k3s_stale_cilium_state
  when: k3s_installed.rc != 0

- name: Refuse to install k3s over stale Cilium state
  ansible.builtin.assert:
    that:
      - k3s_stale_cilium_state.results | selectattr('stat.exists') | list | length == 0
    fail_msg: >-
      Cilium runtime state from a previous cluster is still present
      ({{ k3s_stale_cilium_state.results | selectattr('stat.exists') | map(attribute='item') | join(', ') }}).
      Its BPF programs stay attached after k3s-uninstall and break pod networking. Reboot, then re-run just bootstrap.
  when: k3s_installed.rc != 0

- name: Download k3s installation script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0700"
  when: k3s_installed.rc != 0
  become: true

- name: Execute k3s installation script
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_installed.rc != 0
  become: true
  changed_when: true

- name: Remove temporary k3s installation script
  ansible.builtin.file:
    path: /tmp/k3s-install.sh
    state: absent
  when: k3s_installed.rc != 0
  become: true

- name: Ensure ~/.kube directory exists
  ansible.builtin.file:
    path: "{{ kubeconfig_path | dirname }}"
    state: directory
    mode: "0755"

- name: Wait for Kubernetes API to respond
  ansible.builtin.command: kubectl get nodes
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: k3s_api_check
  until: k3s_api_check.rc == 0
  retries: 12
  delay: 5
  changed_when: false
