---
- name: Configure host firewall for k3s and Cilium (Fedora / RHEL firewalld)
  when: ansible_os_family == 'RedHat' or ansible_distribution == 'Fedora'
  become: true
  block:
    - name: Check if firewalld service is active
      ansible.builtin.command: systemctl is-active firewalld
      register: firewalld_status
      changed_when: false
      failed_when: false

    - name: Apply firewalld configuration for Cilium
      when: firewalld_status.rc == 0
      ansible.builtin.shell: |
        set -e
        zone=$(firewall-cmd --get-default-zone 2>/dev/null || echo "FedoraWorkstation")
        firewall-cmd --zone="$zone" --add-service=dns --permanent
        firewall-cmd --zone="$zone" --add-port=443/tcp --permanent
        firewall-cmd --zone="$zone" --add-masquerade --permanent
        firewall-cmd --zone="$zone" --add-forward --permanent
        firewall-cmd --zone=trusted --add-service=dns --permanent
        firewall-cmd --zone=trusted --add-source=10.42.0.0/16 --permanent
        firewall-cmd --zone=trusted --add-source=10.43.0.0/16 --permanent
        firewall-cmd --zone=trusted --add-interface=cilium_host --permanent
        firewall-cmd --zone=trusted --add-interface=cilium_net --permanent
        firewall-cmd --zone=trusted --add-interface=cilium_vxlan --permanent

        firewall-cmd --permanent --new-policy=k8s-host-to-pods 2>/dev/null || true
        firewall-cmd --permanent --policy=k8s-host-to-pods --add-ingress-zone=HOST
        firewall-cmd --permanent --policy=k8s-host-to-pods --add-egress-zone=trusted
        firewall-cmd --permanent --policy=k8s-host-to-pods --set-target=ACCEPT

        firewall-cmd --permanent --new-policy=k8s-pods-to-host 2>/dev/null || true
        firewall-cmd --permanent --policy=k8s-pods-to-host --add-ingress-zone=trusted
        firewall-cmd --permanent --policy=k8s-pods-to-host --add-egress-zone=HOST
        firewall-cmd --permanent --policy=k8s-pods-to-host --set-target=ACCEPT

        firewall-cmd --permanent --new-policy=k8s-pods-to-wan 2>/dev/null || true
        firewall-cmd --permanent --policy=k8s-pods-to-wan --add-ingress-zone=trusted
        firewall-cmd --permanent --policy=k8s-pods-to-wan --add-egress-zone="$zone"
        firewall-cmd --permanent --policy=k8s-pods-to-wan --set-target=ACCEPT

        firewall-cmd --reload
      changed_when: true

- name: Configure host firewall for k3s and Cilium (Debian / Ubuntu UFW)
  when: ansible_os_family == 'Debian'
  become: true
  block:
    - name: Check if ufw service is active
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false
      failed_when: false

    - name: Apply UFW configuration for Cilium
      when: "'Status: active' in ufw_status.stdout"
      ansible.builtin.shell: |
        set -e
        ufw allow 443/tcp
        ufw allow in on cilium_host
        ufw allow in on cilium_net
        ufw allow in on cilium_vxlan
        ufw allow in on lxc+
        sed -i 's/DEFAULT_FORWARD_POLICY="DROP"/DEFAULT_FORWARD_POLICY="ACCEPT"/' /etc/default/ufw
        ufw reload
      changed_when: true

- name: Create /etc/rancher/k3s directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    mode: "0755"
    state: directory
  become: true

- name: Write k3s config.yaml
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
    content: |
      write-kubeconfig-mode: "0644"
      write-kubeconfig: "{{ ansible_env.HOME }}/.kube/config"
      disable:
        - traefik
        - servicelb
      disable-kube-proxy: true
      disable-network-policy: true
      flannel-backend: none
      secrets-encryption: true
  become: true

- name: Confirm k3s install
  ansible.builtin.command: k3s -v
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Install k3s
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://get.k3s.io | sh -
  args:
    executable: /bin/bash
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_installed.rc != 0
  become: true

- name: Ensure ~/.kube directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: "0755"

- name: Wait for Kubernetes API to respond
  ansible.builtin.command: kubectl get nodes
  environment:
    KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
  register: k3s_api_check
  until: k3s_api_check.rc == 0
  retries: 12
  delay: 5
  changed_when: false
