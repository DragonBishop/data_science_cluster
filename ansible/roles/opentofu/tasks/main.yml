---
- name: Ensure secrets directory exists
  ansible.builtin.file:
    path: "{{ opentofu_secrets_dir }}"
    state: directory
    mode: "0700"

- name: Remove secrets write-only version to force S3 key rotation
  ansible.builtin.file:
    path: "{{ opentofu_secrets_wo_version_file }}"
    state: absent
  when: opentofu_rotate_openbao_secrets | bool

- name: Check whether a secrets write-only version is already recorded
  ansible.builtin.stat:
    path: "{{ opentofu_secrets_wo_version_file }}"
  register: opentofu_secrets_wo_version_stat

- name: Record a new secrets write-only version
  ansible.builtin.copy:
    dest: "{{ opentofu_secrets_wo_version_file }}"
    content: "{{ ansible_facts.date_time.epoch }}"
    mode: "0600"
  when: not opentofu_secrets_wo_version_stat.stat.exists

- name: Read secrets write-only version
  ansible.builtin.slurp:
    src: "{{ opentofu_secrets_wo_version_file }}"
  register: opentofu_secrets_wo_version_raw

# /dev/null: ansible.builtin.password's no-persist form.
- name: Resolve secrets to feed Terraform
  ansible.builtin.set_fact:
    opentofu_secrets_wo_version: "{{ opentofu_secrets_wo_version_raw.content | b64decode | trim }}"
    opentofu_s3_access_key: "{{ lookup('ansible.builtin.password', '/dev/null', length=20, chars=['hexdigits']) }}"
    opentofu_s3_secret_key: "{{ lookup('ansible.builtin.password', '/dev/null', length=40, chars=['hexdigits']) }}"
  no_log: true

# openbao_root_token is shared with the openbao role's default, not opentofu-local.
- name: Resolve in-cluster OpenBao root token  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    openbao_root_token: "{{ openbao_root_token | default(lookup('ansible.builtin.env', 'OPENBAO_ROOT_TOKEN'), true) }}"
  no_log: true

- name: Prompt for the OpenBao root token
  ansible.builtin.pause:
    prompt: "OpenBao root token (printed by the run that first initialized OpenBao)"
    echo: false
  register: opentofu_root_token_prompt
  when: openbao_root_token | length == 0
  no_log: true

- name: Use the prompted OpenBao root token  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    openbao_root_token: "{{ opentofu_root_token_prompt.user_input | trim }}"
  when: opentofu_root_token_prompt is not skipped
  no_log: true

- name: Verify in-cluster OpenBao root token is available
  ansible.builtin.assert:
    that:
      - openbao_root_token | length > 0
    fail_msg: >-
      No OpenBao root token available. Enter it at the prompt, or supply it via
      OPENBAO_ROOT_TOKEN=<token> ansible-playbook ...

- name: Verify the Terraform state encryption passphrase and Postgres superuser password are available
  ansible.builtin.assert:
    that:
      - opentofu_state_encryption_passphrase | default('') | length > 0
      - opentofu_postgres_superuser_password | default('') | length > 0
    fail_msg: >-
      Missing the Terraform state encryption passphrase or Postgres superuser
      password. Answer both prompts at the start of the play.

- name: Fetch in-cluster OpenBao CA certificate
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: openbao-server-cert
    namespace: "{{ openbao_namespace }}"
  register: opentofu_openbao_cert_secret
  failed_when: opentofu_openbao_cert_secret.resources | default([]) | length == 0

- name: Ensure local OpenBao cert directory exists
  ansible.builtin.file:
    path: "{{ openbao_local_dir }}/certs"
    state: directory
    mode: "0700"

- name: Write in-cluster OpenBao CA certificate locally
  ansible.builtin.copy:
    dest: "{{ openbao_local_dir }}/certs/openbao-internal-ca.crt"
    content: "{{ opentofu_openbao_cert_secret.resources[0].data['ca.crt'] | b64decode }}"
    mode: "0600"

- name: Wait for OpenBao on its local redirect
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8210
    timeout: 30
    msg: >-
      OpenBao did not answer on 127.0.0.1:8210. Check the openbao-localhost
      CiliumLocalRedirectPolicy and that openbao-0 is Running.

- name: Apply terraform/openbao
  cloud.terraform.terraform:
    project_path: "{{ repo_root }}/terraform/openbao"
    binary_path: "{{ opentofu_binary }}"
    state: present
    force_init: true
  environment:
    TF_VAR_openbao_token: "{{ openbao_root_token }}"
    TF_VAR_state_encryption_passphrase: "{{ opentofu_state_encryption_passphrase }}"
    TF_VAR_postgres_superuser_password: "{{ opentofu_postgres_superuser_password }}"
    TF_VAR_s3_access_key: "{{ opentofu_s3_access_key }}"
    TF_VAR_s3_secret_key: "{{ opentofu_s3_secret_key }}"
    TF_VAR_secrets_wo_version: "{{ opentofu_secrets_wo_version }}"
  no_log: true

