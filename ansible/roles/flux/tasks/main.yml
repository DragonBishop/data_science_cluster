- name: Apply Flux controllers (gotk-components)
  kubernetes.core.k8s:
    state: present
    src: "{{ repo_root }}/clusters/local/flux-system/gotk-components.yaml"

- name: Create GitHub App authentication secret
  ansible.builtin.command: >
    flux create secret githubapp flux-system
    --app-id="{{ lookup('env', 'GITHUB_APP_ID') }}"
    --app-installation-id="{{ lookup('env', 'GITHUB_APP_INSTALLATION_ID') }}"
    --app-private-key="{{ lookup('env', 'GITHUB_APP_PRIVATE_KEY_PATH') }}"
    --namespace=flux-system
  environment:
    KUBECONFIG: "{{ kubeconfig_path | default(ansible_facts.env.HOME + '/.kube/config') }}"
  when: lookup('env', 'GITHUB_APP_ID') != ""
  changed_when: true

- name: Obtain token for fallback github auth
  ansible.builtin.command: gh auth token
  register: flux_auth_token
  changed_when: false
  when: lookup('env', 'GITHUB_APP_ID') == ""

- name: Get git remote origin URL # noqa: command-instead-of-module
  ansible.builtin.command: git config --get remote.origin.url
  register: flux_git_remote_url
  changed_when: false
  when: lookup('env', 'GITHUB_APP_ID') == ""

- name: Format repository URL for HTTPS
  ansible.builtin.set_fact:
    flux_git_https_url: "{{ flux_git_remote_url.stdout | regex_replace('^git@github.com:', 'https://github.com/') | regex_replace('\\.git$', '') }}"
  when: lookup('env', 'GITHUB_APP_ID') == ""

- name: Create generic Git authentication secret (Fallback)
  ansible.builtin.command: >
    flux create secret git flux-system
    --url="{{ flux_git_https_url }}"
    --username=git
    --password="{{ flux_auth_token.stdout }}"
    --namespace=flux-system
  environment:
    KUBECONFIG: "{{ kubeconfig_path | default(ansible_facts.env.HOME + '/.kube/config') }}"
  when: lookup('env', 'GITHUB_APP_ID') == ""
  changed_when: true

- name: Apply Flux GitRepository (gotk-sync)
  kubernetes.core.k8s:
    state: present
    src: "{{ repo_root }}/clusters/local/flux-system/gotk-sync.yaml"

- name: Wait for Cilium CRDs to be established
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: ciliumclusterwidenetworkpolicies.cilium.io
  register: flux_crd_cilium
  until: flux_crd_cilium.resources | default([]) | length > 0
  retries: 12
  delay: 5

- name: Apply Cilium cluster-default network policy
  kubernetes.core.k8s:
    state: present
    src: "{{ repo_root }}/infrastructure/cilium/clusterwide-networkpolicy.yaml"

- name: Apply flux-egress network policy
  kubernetes.core.k8s:
    state: present
    definition: >-
      {{ lookup('file', repo_root + '/infrastructure/flux-system-policies/flux-networkpolicy.yaml')
      | regex_replace('\$\{GIT_FORGE_HOST\}', git_forge_host) }}

- name: Flux reconcile vault kustomization
  kubernetes.core.k8s:
    state: patched
    kind: Kustomization
    api_version: kustomize.toolkit.fluxcd.io/v1
    name: vault
    namespace: flux-system
    definition:
      metadata:
        annotations:
          reconcile.fluxcd.io/requestedAt: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
  register: flux_vault_kustomization

- name: Monitor reconciliation until clear.
  kubernetes.core.k8s_info:
    kind: Pod
    name: vault-0
    namespace: vault
  register: flux_vault
  until: >-
    (flux_vault.resources | default([]) | length > 0)
    and (
      flux_vault.resources[0].status.phase | default('') in ["Running", "Failed"]
      or (flux_vault.resources[0].status.containerStatuses | default([])
          | selectattr('state.waiting.reason', 'defined')
          | selectattr('state.waiting.reason', 'in', ['CrashLoopBackOff', 'ImagePullBackOff', 'ErrImagePull'])
          | list | length > 0)
    )
  retries: 24
  delay: 10

- name: Fail with diagnostic if Vault pod did not reach Running
  ansible.builtin.fail:
    msg: >-
      vault-0 did not reach Running: phase={{ flux_vault.resources[0].status.phase | default('unknown') }},
      containerStatuses={{ flux_vault.resources[0].status.containerStatuses | default([]) }}
  when: (flux_vault.resources | default([]) | length == 0) or (flux_vault.resources[0].status.phase | default('') != "Running")
