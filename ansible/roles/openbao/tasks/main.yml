---
- name: Check whether in-cluster OpenBao is already initialized
  kubernetes.core.k8s_exec:
    namespace: "{{ openbao_namespace }}"
    pod: "{{ openbao_pod }}"
    command: bao status -format=json
  register: openbao_status_result
  changed_when: false
  failed_when: false

- name: Ensure ~/.gnupg directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.gnupg"
    state: directory
    mode: "0700"

# Required for gpg --pinentry-mode loopback (no TTY available for a real prompt).
- name: Configure gpg-agent for loopback pinentry and zero caching
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts.env.HOME }}/.gnupg/gpg-agent.conf"
    line: "{{ item }}"
    create: true
    mode: "0600"
  loop:
    - "allow-loopback-pinentry"
    - "default-cache-ttl 0"
    - "max-cache-ttl 0"

- name: Reload gpg-agent
  ansible.builtin.command: gpgconf --reload gpg-agent
  changed_when: true

- name: Verify the unseal-keyfile GPG passphrase is available
  ansible.builtin.assert:
    that:
      - openbao_gpg_passphrase | default('') | length > 0
    fail_msg: >-
      No GPG passphrase supplied for {{ openbao_keyfile }}. Answer the
      "GPG passphrase for the unseal keyfile" prompt at the start of the play.

- name: Initialize OpenBao and write a new unseal keyfile
  when: not (openbao_status_result.stdout | from_json).initialized
  block:
    - name: Initialize in-cluster OpenBao
      kubernetes.core.k8s_exec:
        namespace: "{{ openbao_namespace }}"
        pod: "{{ openbao_pod }}"
        command: bao operator init -format=json
      register: openbao_init_result
      no_log: true

    - name: Parse OpenBao init output
      ansible.builtin.set_fact:
        openbao_root_token: "{{ (openbao_init_result.stdout | from_json).root_token }}"
        openbao_fresh_unseal_keys: "{{ (openbao_init_result.stdout | from_json).unseal_keys_b64[:3] }}"
      no_log: true

    - name: Ensure local OpenBao directory exists
      ansible.builtin.file:
        path: "{{ openbao_local_dir }}"
        state: directory
        mode: "0700"

    - name: Create tmpfs workdir for unseal keyfile
      ansible.builtin.tempfile:
        state: directory
        path: /dev/shm
        prefix: openbao-setup-
      register: openbao_setup_workdir

    - name: Write unseal keys to tmpfs keyfile
      ansible.builtin.copy:
        dest: "{{ openbao_setup_workdir.path }}/keys.txt"
        content: "{{ (openbao_fresh_unseal_keys | join('\n')) + '\n' }}"
        mode: "0600"
      no_log: true

    - name: GPG-encrypt unseal keyfile
      ansible.builtin.command:
        cmd: >-
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0
          --cipher-algo AES256 --s2k-mode 3 --s2k-count 65011712
          --s2k-digest-algo SHA512 --symmetric --output {{ openbao_keyfile }}
          {{ openbao_setup_workdir.path }}/keys.txt
        stdin: "{{ openbao_gpg_passphrase }}\n"
      no_log: true
      changed_when: true

    - name: Set unseal keyfile permissions
      ansible.builtin.file:
        path: "{{ openbao_keyfile }}"
        mode: "0600"

    - name: Remove tmpfs workdir
      ansible.builtin.file:
        path: "{{ openbao_setup_workdir.path }}"
        state: absent

- name: Decrypt unseal keyfile
  ansible.builtin.command:
    cmd: gpg --quiet --batch --pinentry-mode loopback --passphrase-fd 0 --decrypt {{ openbao_keyfile }}
    stdin: "{{ openbao_gpg_passphrase }}\n"
  register: openbao_decrypt_result
  changed_when: false
  no_log: true

- name: Collect unseal keys from decrypted keyfile
  ansible.builtin.set_fact:
    openbao_unseal_keys: "{{ openbao_decrypt_result.stdout_lines | select('truthy') | list }}"
  no_log: true

- name: Unseal OpenBao
  ansible.builtin.command:
    cmd: kubectl exec -i -n {{ openbao_namespace }} {{ openbao_pod }} -- bao write -format=json sys/unseal key=-
    stdin: "{{ item }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  loop: "{{ openbao_unseal_keys }}"
  no_log: true
  changed_when: true
