---
- name: Provision k3s Data Science Cluster
  hosts: localhost
  become: false

  vars_prompt:
    - name: openbao_gpg_passphrase
      prompt: "GPG passphrase for the unseal keyfile"
      private: true
      default: ""
    - name: opentofu_state_encryption_passphrase
      prompt: "State encryption passphrase for terraform/openbao's state file"
      private: true
      default: ""
    - name: opentofu_postgres_superuser_password
      prompt: "Postgres superuser password"
      private: true
      default: ""

  roles:
    - { role: k3s, tags: [k3s] }
    - { role: cilium, tags: [cilium] }
    - { role: flux, tags: [flux] }
    - { role: openbao, tags: [openbao] }
    - { role: opentofu, tags: [opentofu, openbao] }

  tasks:
    - name: Print freshly-generated OpenBao root token and unseal keys
      ansible.builtin.debug:
        msg: "{{ ['Root Token:', openbao_root_token, 'Fresh Unseal Keys:'] + openbao_fresh_unseal_keys }}"
      when: openbao_fresh_unseal_keys is defined
      tags: always
