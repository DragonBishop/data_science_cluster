---
- name: Wait for Cilium CRDs to be established
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: ciliumclusterwidenetworkpolicies.cilium.io
  register: flux_crd_cilium
  until: flux_crd_cilium.resources | default([]) | length > 0
  retries: 12
  delay: 5

# Policies Flux needs to fetch its source are applied here, ahead of Flux
- name: Apply Cilium cluster-default network policy
  kubernetes.core.k8s:
    state: present
    src: "{{ repo_root }}/infrastructure/cilium/clusterwide-networkpolicy.yaml"

- name: Apply CoreDNS network policy
  kubernetes.core.k8s:
    state: present
    src: "{{ repo_root }}/infrastructure/coredns-custom/coredns-networkpolicy.yaml"

- name: Apply flux-egress network policy
  kubernetes.core.k8s:
    state: present
    definition: >-
      {{ lookup('file', repo_root + '/infrastructure/flux-system-policies/flux-networkpolicy.yaml')
      | regex_replace('\$\{GIT_FORGE_HOST\}', git_forge_host) }}
