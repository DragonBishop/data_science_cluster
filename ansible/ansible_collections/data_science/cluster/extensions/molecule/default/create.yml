---
- name: Create container instances
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create containers from inventory
      containers.podman.podman_container:
        hostname: "{{ item }}"
        name: "{{ item }}"
        image: "{{ hostvars[item]['container_image'] }}"
        command: "{{ hostvars[item]['container_command'] }}"
        systemd: "{{ hostvars[item]['container_systemd'] }}"
        volumes: "{{ hostvars[item]['container_volumes'] | default(omit) }}"
        security_opt: "{{ hostvars[item]['container_security_opt'] | default(omit) }}"
        state: started
      register: result
      loop: "{{ groups['molecule'] }}"

    - name: Verify containers are running
      ansible.builtin.include_tasks:
        file: tasks/create-fail.yml
      when: >
        item.container.State.ExitCode != 0 or
        not item.container.State.Running
      loop: "{{ result.results }}"
      loop_control:
        label: "{{ item.container.Name }}"

    - name: Wait for containers to be ready
      ansible.builtin.ping:
      delegate_to: "{{ item }}"
      loop: "{{ groups['molecule'] }}"

- name: Install the packages become needs
  hosts: molecule
  gather_facts: false
  tasks:
    - name: Install sudo
      ansible.builtin.dnf:
        name: sudo
        state: present
