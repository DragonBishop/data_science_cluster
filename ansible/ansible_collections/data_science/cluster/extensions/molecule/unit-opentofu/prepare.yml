---
- name: OpenTofu inputs after a rotation request
  hosts: molecule
  gather_facts: false
  vars_files:
    - vars/main.yml
  tasks:
    - name: Start from an empty secrets directory
      ansible.builtin.file:
        path: "{{ opentofu_secrets_dir }}"
        state: absent

    - name: Create the secrets directory
      ansible.builtin.file:
        path: "{{ opentofu_secrets_dir }}"
        state: directory
        mode: "0700"

    - name: Record the previous version
      ansible.builtin.copy:
        dest: "{{ opentofu_secrets_wo_version_file }}"
        content: "{{ opentofu_previous_wo_version }}"
        mode: "0600"

    - name: Request a rotation
      ansible.builtin.file:
        path: "{{ opentofu_rotate_secrets_marker }}"
        state: touch
        mode: "0600"
