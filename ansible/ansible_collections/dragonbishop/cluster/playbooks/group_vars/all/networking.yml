cilium_endpoint_create_max_wait: "{{ cluster_config.CILIUM_ENDPOINT_CREATE_MAX_WAIT }}"
cilium_endpoint_create_parallel: "{{ cluster_config.CILIUM_ENDPOINT_CREATE_PARALLEL }}"
