openbao_pki_cert_duration: "{{ cluster_config.OPENBAO_PKI_CERT_DURATION }}"
openbao_pki_cert_renew_before: "{{ cluster_config.OPENBAO_PKI_CERT_RENEW_BEFORE }}"
