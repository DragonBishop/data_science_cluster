---
# Prints only once Flux has created the Secret
- name: Read the Grafana admin login
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: observability
    name: grafana-admin
  register: grafana_admin_secret
  failed_when: false

- name: Print the Grafana admin login
  ansible.builtin.debug:
    msg:
      - "Grafana: https://grafana.{{ cluster_config.INTERNAL_DOMAIN }}"
      - "Username: {{ grafana_admin_secret.resources[0].data['admin-user'] | b64decode }}"
      - "Password: {{ grafana_admin_secret.resources[0].data['admin-password'] | b64decode }}"
  when: grafana_admin_secret.resources | default([]) | length > 0
