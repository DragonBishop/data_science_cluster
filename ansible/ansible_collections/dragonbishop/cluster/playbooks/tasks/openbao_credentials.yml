---
- name: Print the OpenBao seal key for external storage
  ansible.builtin.debug:
    msg:
      - Store this seal key in your external secret store.
      - "Seal Key: {{ openbao_effective_seal_key }}"
  when:
    - openbao_effective_seal_key is defined
    - openbao_generated_seal_key.stdout is defined or openbao_fresh_recovery_keys is defined

- name: Print freshly initialized OpenBao credentials for external storage
  ansible.builtin.debug:
    msg: >-
      {{ ['Store these in your external secret store.', 'Root Token:', openbao_root_token,
          'Fresh Recovery Keys:'] + openbao_fresh_recovery_keys }}
  when: openbao_fresh_recovery_keys is defined
