---
- name: Print OpenBao credentials for external storage
  ansible.builtin.debug:
    msg:
      - Store these in your external secret store.
      - "Seal Key:"
      - "{{ openbao_effective_seal_key | default('Not generated') }}"
      - "Root Token:"
      - "{{ openbao_root_token if openbao_fresh_recovery_keys is defined else 'Not generated' }}"
      - "Fresh Recovery Keys:"
      - "{{ openbao_fresh_recovery_keys | default([]) }}"
  when: openbao_generated_seal_key.stdout is defined or openbao_fresh_recovery_keys is defined
