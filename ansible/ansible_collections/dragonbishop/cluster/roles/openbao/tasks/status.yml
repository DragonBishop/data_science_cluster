---
- name: Check whether in-cluster OpenBao is already initialized
  kubernetes.core.k8s_exec:
    namespace: "{{ openbao_namespace }}"
    pod: "{{ openbao_pod }}"
    command: bao status -format=json
  register: openbao_status_result
  changed_when: false
  failed_when: false

- name: Parse OpenBao's status
  ansible.builtin.set_fact:
    openbao_status: "{{ openbao_status_result.stdout | default('{}', true) | from_json }}"
