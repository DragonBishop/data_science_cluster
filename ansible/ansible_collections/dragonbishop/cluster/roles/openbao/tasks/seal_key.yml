---
- name: Read OpenBao's seal key Secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: openbao-seal-key
    namespace: "{{ openbao_namespace }}"
  register: openbao_seal_key_secret
  no_log: true

- name: Note whether the seal key Secret exists
  ansible.builtin.set_fact:
    openbao_seal_key_secret_exists: "{{ openbao_seal_key_secret.resources | length > 0 }}"

- name: Read the existing seal key
  when: openbao_seal_key_secret_exists
  ansible.builtin.set_fact:
    openbao_effective_seal_key: "{{ openbao_seal_key_secret.resources[0].data.key | b64decode }}"
  no_log: true

- name: Prepare a missing seal key Secret
  when: not openbao_seal_key_secret_exists
  block:
    - name: Keep an explicitly supplied seal key
      ansible.builtin.set_fact:
        openbao_effective_seal_key: "{{ openbao_seal_key | default('') }}"
      no_log: true

    - name: Generate a seal key for a fresh installation
      when: openbao_effective_seal_key | length == 0
      block:
        - name: Check for existing OpenBao storage claims
          kubernetes.core.k8s_info:
            api_version: v1
            kind: PersistentVolumeClaim
            namespace: "{{ openbao_namespace }}"
          register: openbao_storage_claims

        - name: Generate the initial seal key only without existing storage
          ansible.builtin.import_tasks: generate_seal_key.yml

    - name: Validate the selected seal key
      ansible.builtin.import_tasks: validate_seal_key.yml

# The static seal reads the file byte for byte, so the key carries no trailing newline
- name: Create OpenBao's seal key Secret
  when: not openbao_seal_key_secret_exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: openbao-seal-key
        namespace: "{{ openbao_namespace }}"
      type: Opaque
      stringData:
        key: "{{ openbao_effective_seal_key }}"
  no_log: true
