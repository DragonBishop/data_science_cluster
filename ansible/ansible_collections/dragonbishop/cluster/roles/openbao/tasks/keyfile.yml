---
- name: Write a new recovery keyfile
  when: openbao_fresh_recovery_keys is defined
  block:
    - name: Ensure local OpenBao directory exists
      ansible.builtin.file:
        path: "{{ openbao_local_dir }}"
        state: directory
        mode: "0700"

    - name: Create tmpfs workdir for recovery keyfile
      ansible.builtin.tempfile:
        state: directory
        path: /dev/shm
        prefix: openbao-setup-
      register: openbao_setup_workdir

    - name: Write recovery keys to tmpfs keyfile
      ansible.builtin.copy:
        dest: "{{ openbao_setup_workdir.path }}/keys.txt"
        content: "{{ (openbao_fresh_recovery_keys | join('\n')) + '\n' }}"
        mode: "0600"
      no_log: true

    - name: GPG-encrypt recovery keyfile
      ansible.builtin.command:
        cmd: >-
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0
          --cipher-algo AES256 --s2k-mode 3 --s2k-count 65011712
          --s2k-digest-algo SHA512 --symmetric --output {{ openbao_recovery_keyfile }}
          {{ openbao_setup_workdir.path }}/keys.txt
        stdin: "{{ openbao_gpg_passphrase }}\n"
      no_log: true
      changed_when: true

    - name: Set recovery keyfile permissions
      ansible.builtin.file:
        path: "{{ openbao_recovery_keyfile }}"
        mode: "0600"

    - name: Remove tmpfs workdir
      ansible.builtin.file:
        path: "{{ openbao_setup_workdir.path }}"
        state: absent
