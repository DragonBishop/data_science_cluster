---
- name: Substitute cluster-config values into OpenBao Helm values
  ansible.builtin.command:
    cmd: flux envsubst --strict
    stdin: "{{ lookup('ansible.builtin.file', repo_root + '/infrastructure/openbao/openbao-values.yaml') }}"
  environment:
    OPENBAO_CPU_REQUEST: "{{ openbao_cpu_request }}"
    OPENBAO_CSI_PROVIDER_CPU_REQUEST: "{{ openbao_csi_provider_cpu_request }}"
    OPENBAO_CSI_PROVIDER_MEM_LIMIT: "{{ openbao_csi_provider_mem_limit }}"
    OPENBAO_CSI_PROVIDER_MEM_REQUEST: "{{ openbao_csi_provider_mem_request }}"
    OPENBAO_DATA_STORAGE_SIZE: "{{ openbao_data_storage_size }}"
    OPENBAO_IMAGE_TAG: "{{ openbao_image_tag }}"
    OPENBAO_MEM_LIMIT: "{{ openbao_mem_limit }}"
    OPENBAO_MEM_REQUEST: "{{ openbao_mem_request }}"
    OPENBAO_SECRETS_AWS_VERSION: "{{ openbao_secrets_aws_version }}"
  register: openbao_values_substituted
  changed_when: false
