---
- name: Render the OpenBao Helm values
  ansible.builtin.import_tasks: render.yml

- name: Render and apply OpenBao's certificates, Bundles, policy and redirect
  ansible.builtin.import_tasks: manifests.yml

- name: Install OpenBao
  ansible.builtin.import_tasks: install.yml

- name: Wait for openbao-0 to run
  ansible.builtin.import_tasks: wait.yml

- name: Check OpenBao's status
  ansible.builtin.import_tasks: status.yml

- name: Prepare gpg-agent for the unseal keyfile
  ansible.builtin.import_tasks: gpg_agent.yml

- name: Initialize OpenBao if needed
  ansible.builtin.import_tasks: init.yml

- name: Write and read the unseal keyfile
  ansible.builtin.import_tasks: keyfile.yml

- name: Unseal OpenBao
  ansible.builtin.import_tasks: unseal.yml
