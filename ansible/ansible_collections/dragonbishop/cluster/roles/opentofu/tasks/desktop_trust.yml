---
# Copied from memory, never from a user-writable file
- name: Install the desktop and OpenBao CA certificates into the system trust store
  ansible.builtin.copy:
    dest: "{{ opentofu_trust_anchor_dirs[ansible_facts.os_family] }}/{{ item.name }}"
    content: "{{ item.certificate }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: data-science-cluster-desktop-ca.crt
      certificate: "{{ opentofu_apply.outputs.desktop_ca.value }}"
    - name: data-science-cluster-openbao-ca.crt
      certificate: "{{ opentofu_openbao_ca.resources[0].data['ca.crt'] }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  notify: Refresh the system trust store
  when: opentofu_desktop_trust | bool

- name: Remove the cluster's CA certificates from the system trust store
  ansible.builtin.file:
    path: "{{ opentofu_trust_anchor_dirs[ansible_facts.os_family] }}/{{ item }}"
    state: absent
  loop:
    - data-science-cluster-desktop-ca.crt
    - data-science-cluster-openbao-ca.crt
  become: true
  notify: Refresh the system trust store
  when: not (opentofu_desktop_trust | bool)
