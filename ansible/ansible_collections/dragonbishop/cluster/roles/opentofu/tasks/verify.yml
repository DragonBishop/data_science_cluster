---
# A failed login shows up as permission errors in the checks below.
- name: Log in to in-cluster OpenBao CLI
  ansible.builtin.command:
    cmd: kubectl exec -i -n {{ openbao_namespace }} {{ openbao_pod }} -- bao login -no-print -
    stdin: "{{ openbao_root_token }}\n"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false
  no_log: true

- name: Check terraform/openbao configured the internal-server PKI role
  ansible.builtin.command: kubectl exec -n {{ openbao_namespace }} {{ openbao_pod }} -- bao read pki_int/roles/internal-server
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Check terraform/openbao configured the cert-manager auth role
  ansible.builtin.command: kubectl exec -n {{ openbao_namespace }} {{ openbao_pod }} -- bao read auth/kubernetes/role/cert-manager-pki-role
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
