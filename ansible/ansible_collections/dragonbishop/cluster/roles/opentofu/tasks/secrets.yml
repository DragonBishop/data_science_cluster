---
- name: Write the Postgres superuser Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/basic-auth
      metadata:
        name: postgres-superuser-credentials
        namespace: databases
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ 'postgres' | b64encode }}"
        password: "{{ opentofu_postgres_superuser_password | b64encode }}"
  no_log: true

- name: Read Barman's S3 Secret
  kubernetes.core.k8s_info:
    kind: Secret
    name: barman-s3-credentials
    namespace: databases
  register: opentofu_barman_s3_secret
  no_log: true

- name: Read SeaweedFS's S3 identity Secret
  kubernetes.core.k8s_info:
    kind: Secret
    name: seaweedfs-credentials
    namespace: seaweedfs
  register: opentofu_seaweedfs_secret
  no_log: true

- name: Write the S3 key pair
  when: opentofu_barman_s3_secret.resources | length == 0 or opentofu_seaweedfs_secret.resources | length == 0
  block:
    - name: Write Barman's S3 Secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: barman-s3-credentials
            namespace: databases
          stringData:
            ACCESS_KEY_ID: "{{ opentofu_s3_access_key }}"
            ACCESS_SECRET_KEY: "{{ opentofu_s3_secret_key }}"
      no_log: true

    - name: Write SeaweedFS's S3 identity Secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: seaweedfs-credentials
            namespace: seaweedfs
          stringData:
            config: "{{ opentofu_seaweedfs_config | to_json }}"
      vars:
        opentofu_seaweedfs_config:
          identities:
            - name: barman
              credentials:
                - accessKey: "{{ opentofu_s3_access_key }}"
                  secretKey: "{{ opentofu_s3_secret_key }}"
              actions: [Read, Write, List, Tagging]
      no_log: true

    - name: Read the S3 gateway Deployment
      kubernetes.core.k8s_info:
        kind: Deployment
        name: seaweedfs-s3
        namespace: seaweedfs
      register: opentofu_seaweedfs_s3_deployment

    - name: Restart the S3 gateway
      when: opentofu_seaweedfs_s3_deployment.resources | length > 0
      kubernetes.core.k8s:
        state: patched
        kind: Deployment
        name: seaweedfs-s3
        namespace: seaweedfs
        definition:
          spec:
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/restartedAt: "{{ now(utc=true).isoformat() }}"

- name: Create Results' login Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: tekton-results-postgres
        namespace: tekton
