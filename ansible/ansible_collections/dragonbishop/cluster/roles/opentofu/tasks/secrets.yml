---
- name: Write the Postgres superuser Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/basic-auth
      metadata:
        name: postgres-superuser-credentials
        namespace: databases
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ 'postgres' | b64encode }}"
        password: "{{ opentofu_postgres_superuser_password | b64encode }}"
  register: opentofu_postgres_secret_write
  no_log: true

- name: Read SeaweedFS's S3 identity Secret
  kubernetes.core.k8s_info:
    kind: Secret
    name: seaweedfs-credentials
    namespace: seaweedfs
  register: opentofu_seaweedfs_secret
  no_log: true

- name: Read the S3 identities by name
  when: opentofu_seaweedfs_secret.resources | length > 0
  ansible.builtin.set_fact:
    opentofu_seaweedfs_identities: >-
      {{ (opentofu_seaweedfs_secret.resources[0].data.config | b64decode | from_json).identities
         | items2dict(key_name='name', value_name='credentials') }}
  no_log: true

- name: Use the generated admin key pair
  ansible.builtin.set_fact:
    opentofu_seaweedfs_credential:
      accessKey: "{{ opentofu_s3_access_key }}"
      secretKey: "{{ opentofu_s3_secret_key }}"
  no_log: true

- name: Keep OpenBao's existing admin key pair
  when:
    - "'openbao' in opentofu_seaweedfs_identities | default({})"
    - not opentofu_rotate_secrets_marker_stat.stat.exists
  ansible.builtin.set_fact:
    opentofu_seaweedfs_credential: "{{ opentofu_seaweedfs_identities.openbao[0] }}"
  no_log: true

- name: Build SeaweedFS's S3 identity config
  ansible.builtin.set_fact:
    opentofu_seaweedfs_config:
      identities:
        - name: openbao
          credentials:
            - "{{ opentofu_seaweedfs_credential }}"
          actions: [Admin, Read, Write, List, Tagging]
  no_log: true

- name: Write SeaweedFS's S3 identity Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: seaweedfs-credentials
        namespace: seaweedfs
      data:
        config: "{{ opentofu_seaweedfs_config | to_json | b64encode }}"
  register: opentofu_seaweedfs_secret_write
  notify: Restart the S3 gateway
  no_log: true

- name: Restart the S3 gateway before Terraform hands OpenBao the key pair
  ansible.builtin.meta: flush_handlers

- name: Pick a new secrets write-only version for the changed credentials
  when: opentofu_postgres_secret_write is changed or opentofu_seaweedfs_secret_write is changed
  ansible.builtin.set_fact:
    opentofu_secrets_wo_version: "{{ now(utc=true).strftime('%s') }}"

- name: Record the new secrets write-only version
  when: opentofu_postgres_secret_write is changed or opentofu_seaweedfs_secret_write is changed
  ansible.builtin.copy:
    dest: "{{ opentofu_secrets_wo_version_file }}"
    content: "{{ opentofu_secrets_wo_version }}"
    mode: "0600"

# The CSI driver only fills a Secret it sees, and it sees only labelled ones
- name: Create Results' login Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: tekton-results-postgres
        namespace: tekton
        labels:
          secrets-store.csi.k8s.io/managed: "true"
