---
- name: Wait for OpenBao's public listener CA
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig="{{ kubeconfig_path }}" -n {{ openbao_namespace }} wait
      configmap/openbao-ca-bundle --for=create --for=jsonpath='{.data.ca\.crt}' --timeout=120s
  changed_when: false

- name: Read OpenBao's public listener CA
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: v1
    kind: ConfigMap
    name: openbao-ca-bundle
    namespace: "{{ openbao_namespace }}"
  register: opentofu_openbao_ca

- name: Ensure local OpenBao cert directory exists
  ansible.builtin.file:
    path: "{{ openbao_local_dir }}/certs"
    state: directory
    mode: "0700"

- name: Write in-cluster OpenBao CA certificate locally
  ansible.builtin.copy:
    dest: "{{ openbao_local_dir }}/certs/openbao-internal-ca.crt"
    content: "{{ opentofu_openbao_ca.resources[0].data['ca.crt'] }}"
    mode: "0600"

- name: Wait for OpenBao on its local redirect
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8210
    timeout: 30
    msg: >-
      OpenBao did not answer on 127.0.0.1:8210. Check the openbao-localhost
      CiliumLocalRedirectPolicy and that openbao-0 is Running.
