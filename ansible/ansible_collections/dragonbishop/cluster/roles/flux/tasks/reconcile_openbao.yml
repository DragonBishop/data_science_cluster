---
- name: Check whether the OpenBao pod already exists
  kubernetes.core.k8s_info:
    kind: Pod
    name: openbao-0
    namespace: openbao
  register: flux_openbao_existing

- name: Flux reconcile openbao kustomization
  when: flux_openbao_existing.resources | default([]) | length == 0
  kubernetes.core.k8s:
    state: patched
    kind: Kustomization
    api_version: kustomize.toolkit.fluxcd.io/v1
    name: openbao
    namespace: flux-system
    definition:
      metadata:
        annotations:
          reconcile.fluxcd.io/requestedAt: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
  register: flux_openbao_kustomization

- name: Monitor reconciliation until clear.
  kubernetes.core.k8s_info:
    kind: Pod
    name: openbao-0
    namespace: openbao
  register: flux_openbao
  until: >-
    (flux_openbao.resources | default([]) | length > 0)
    and (
      flux_openbao.resources[0].status.phase | default('') in ["Running", "Failed"]
      or (flux_openbao.resources[0].status.containerStatuses | default([])
          | selectattr('state.waiting.reason', 'defined')
          | selectattr('state.waiting.reason', 'in', ['CrashLoopBackOff', 'ImagePullBackOff', 'ErrImagePull'])
          | list | length > 0)
    )
  retries: 24
  delay: 10

- name: Fail with diagnostic if OpenBao pod did not reach Running
  ansible.builtin.fail:
    msg: >-
      openbao-0 did not reach Running: phase={{ flux_openbao.resources[0].status.phase | default('unknown') }},
      containerStatuses={{ flux_openbao.resources[0].status.containerStatuses | default([]) }}
  when: (flux_openbao.resources | default([]) | length == 0) or (flux_openbao.resources[0].status.phase | default('') != "Running")
