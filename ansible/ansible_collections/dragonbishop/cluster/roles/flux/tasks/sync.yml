---
- name: Resolve the branch Flux syncs
  ansible.builtin.set_fact:
    flux_git_branch: "{{ lookup('ansible.builtin.env', 'FLUX_GIT_BRANCH', default='main') }}"

- name: Point gotk-sync at that branch
  ansible.builtin.set_fact:
    flux_gotk_sync: >-
      {{ lookup('ansible.builtin.file', repo_root + '/clusters/local/flux-system/gotk-sync.yaml')
         | regex_replace('branch: main', 'branch: ' + flux_git_branch) }}

- name: Apply Flux GitRepository (gotk-sync)
  kubernetes.core.k8s:
    state: present
    definition: "{{ flux_gotk_sync }}"

# gotk-sync.yaml pins main, so Flux would reset the branch on its first sync without this patch
- name: Keep Flux on the branch under test
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
    definition:
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: flux-system
        namespace: flux-system
      spec:
        patches:
          - target:
              kind: GitRepository
              name: flux-system
            patch: |
              - op: replace
                path: /spec/ref/branch
                value: {{ flux_git_branch }}
  when: flux_git_branch != 'main'

- name: Apply the network policy Flux needs to fetch its source
  kubernetes.core.k8s:
    state: present
    src: "{{ repo_root }}/clusters/local/flux-system/flux-networkpolicy.yaml"
