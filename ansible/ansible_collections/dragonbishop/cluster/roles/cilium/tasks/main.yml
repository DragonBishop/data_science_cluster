---
- name: Apply the cluster's Namespaces
  kubernetes.core.k8s:
    state: present
    src: "{{ repo_root }}/infrastructure/namespaces/namespaces.yaml"
    server_side_apply:
      field_manager: ansible

- name: Install the Gateway API CRDs
  ansible.builtin.import_tasks: gateway_crds.yml

- name: Render the Cilium Helm values
  ansible.builtin.import_tasks: render.yml

- name: Install Cilium
  ansible.builtin.import_tasks: install.yml
