---
- name: Read the Cilium release
  kubernetes.core.helm_info:
    name: cilium
    release_namespace: kube-system
  register: cilium_release

- name: Install Cilium
  kubernetes.core.helm:
    name: cilium
    chart_ref: oci://quay.io/cilium/charts/cilium
    chart_version: "{{ cilium_version }}"
    release_namespace: kube-system
    values: "{{ cilium_values_substituted.stdout | from_yaml }}"
  when: cilium_release.status is not defined
