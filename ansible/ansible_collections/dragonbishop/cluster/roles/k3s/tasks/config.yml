---
# Created as the user before k3s runs; otherwise k3s creates it as root.
- name: Ensure ~/.kube directory exists
  ansible.builtin.file:
    path: "{{ kubeconfig_path | dirname }}"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  become: true

- name: Create /etc/rancher/k3s directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    mode: "0755"
    state: directory
  become: true

- name: Write k3s config.yaml
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
    content: |
      write-kubeconfig-mode: "0660"
      write-kubeconfig-group: "{{ ansible_facts.user_gid }}"
      write-kubeconfig: "{{ kubeconfig_path }}"
      disable:
        - traefik
        - servicelb
        - gateway-api-crd
      disable-kube-proxy: true
      disable-network-policy: true
      flannel-backend: none
      secrets-encryption: true
      kubelet-arg:
        - config=/etc/rancher/k3s/kubelet.conf
      kube-controller-manager-arg:
        - terminated-pod-gc-threshold=50
  become: true

# Pods stopped at shutdown are replaced on start with fresh CSI mounts
- name: Write the kubelet config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/kubelet.conf
    mode: "0644"
    content: |
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      shutdownGracePeriod: 30s
      shutdownGracePeriodCriticalPods: 10s
  become: true
