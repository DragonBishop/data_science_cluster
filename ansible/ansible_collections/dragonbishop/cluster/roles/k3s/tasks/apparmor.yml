---
- name: Check for apparmor_parser
  ansible.builtin.stat:
    path: /sbin/apparmor_parser
  register: k3s_apparmor_parser

- name: Check for AppArmor's security filesystem
  ansible.builtin.stat:
    path: /sys/kernel/security/apparmor
  register: k3s_apparmor_securityfs
  become: true

- name: Read whether AppArmor is enabled
  ansible.builtin.slurp:
    src: /sys/module/apparmor/parameters/enabled
  register: k3s_apparmor_enabled
  failed_when: false

- name: Install containerd's AppArmor profile
  ansible.builtin.copy:
    src: cri-containerd.apparmor.d
    dest: /etc/apparmor.d/cri-containerd.apparmor.d
    mode: "0644"
  become: true
  notify: Load containerd's AppArmor profile
  when:
    - k3s_apparmor_parser.stat.exists
    - k3s_apparmor_securityfs.stat.exists
    - k3s_apparmor_enabled.content | default('') | b64decode is match('Y')

- name: Load the profile before k3s starts
  ansible.builtin.meta: flush_handlers
