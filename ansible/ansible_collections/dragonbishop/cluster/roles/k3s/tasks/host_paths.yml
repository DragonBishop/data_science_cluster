---
# The operator mounts database subdirectories. hostPath does not apply fsGroup
# ownership, so prepare those directories before kubelet could create them as root.
- name: Prepare Prometheus and Alertmanager host storage
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "2000"
    mode: "0770"
  loop:
    - "{{ prometheus_host_path }}"
    - "{{ prometheus_host_path }}/prometheus-db"
    - "{{ alertmanager_host_path }}"
    - "{{ alertmanager_host_path }}/alertmanager-db"
  become: true
