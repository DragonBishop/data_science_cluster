---
- name: Configure k3s
  ansible.builtin.import_tasks: config.yml

- name: Raise the inotify limits
  ansible.builtin.import_tasks: inotify.yml

- name: Load containerd's AppArmor profile
  ansible.builtin.import_tasks: apparmor.yml

- name: Create the observability host paths
  ansible.builtin.import_tasks: host_paths.yml

- name: Install k3s
  ansible.builtin.import_tasks: install.yml

- name: Wait for the k3s API
  ansible.builtin.import_tasks: wait_api.yml
