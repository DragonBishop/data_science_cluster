---
- name: Confirm k3s install
  ansible.builtin.command: k3s -v
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Read the installed k3s version
  ansible.builtin.set_fact:
    k3s_installed_version: "{{ k3s_installed.stdout.split()[2] if k3s_installed.rc == 0 else '' }}"

- name: Refuse to downgrade k3s
  ansible.builtin.assert:
    that:
      - not (k3s_installed_version is version(k3s_version, '>'))
    fail_msg: >-
      Installed k3s {{ k3s_installed_version }} is newer than the pinned {{ k3s_version }}.
      k3s does not support downgrades. Raise K3S_VERSION, or run just uninstall, reboot and re-run just bootstrap.
  when: k3s_installed.rc == 0

- name: Determine whether k3s needs installation or an upgrade
  ansible.builtin.set_fact:
    k3s_install_required: "{{ k3s_installed_version != k3s_version }}"

- name: Check for Cilium runtime state left by a previous cluster
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /sys/class/net/cilium_host
    - /run/cilium
  register: k3s_stale_cilium_state
  when: k3s_installed.rc != 0

- name: Refuse to install k3s over stale Cilium state
  vars:
    k3s_stale_cilium_paths: "{{ k3s_stale_cilium_state.results | selectattr('stat.exists') | map(attribute='item') | list }}"
  ansible.builtin.assert:
    that:
      - k3s_stale_cilium_paths | length == 0
    fail_msg: >-
      Cilium runtime state from a previous cluster is still present
      ({{ k3s_stale_cilium_paths | join(', ') }}).
      Its BPF programs stay attached after k3s-uninstall and break pod networking. Reboot, then re-run just bootstrap.
  when: k3s_installed.rc != 0

- name: Download k3s installation script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: /tmp/k3s-install.sh
    mode: "0700"
  when: k3s_install_required
  become: true

- name: Execute k3s installation script
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_install_required
  become: true
  changed_when: true

- name: Remove temporary k3s installation script
  ansible.builtin.file:
    path: /tmp/k3s-install.sh
    state: absent
  when: k3s_install_required
  become: true
