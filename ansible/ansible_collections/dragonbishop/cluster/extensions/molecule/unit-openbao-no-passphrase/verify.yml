---
- name: OpenBao recovery keyfile without a GPG passphrase
  hosts: molecule
  gather_facts: false
  vars_files:
    - vars/main.yml
  tasks:
    - name: Check for an OpenBao keyfile
      ansible.builtin.stat:
        path: "{{ openbao_recovery_keyfile }}"
      register: openbao_recovery_keyfile_stat

    - name: It should not write a recovery keyfile
      ansible.builtin.assert:
        that:
          - not openbao_recovery_keyfile_stat.stat.exists
        fail_msg: a recovery keyfile was written without a GPG passphrase
