---
- name: OpenBao unseal keyfile without a GPG passphrase
  hosts: molecule
  gather_facts: true
  vars_files:
    - vars/main.yml
  tasks:
    - name: Stop gpg-agent
      ansible.builtin.command: gpgconf --kill gpg-agent
      changed_when: true

    - name: Remove ~/.gnupg
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.gnupg"
        state: absent

    - name: Remove the test keyfile directory
      ansible.builtin.file:
        path: "{{ openbao_local_dir }}"
        state: absent
