---
- name: OpenBao recovery keyfile on a fresh host
  hosts: molecule
  gather_facts: true
  vars_files:
    - vars/main.yml
  tasks:
    - name: Check whether a recovery keyfile already exists
      ansible.builtin.stat:
        path: "{{ openbao_recovery_keyfile }}"
      register: openbao_recovery_keyfile_stat

    - name: Stand in for a fresh OpenBao init
      ansible.builtin.set_fact:
        openbao_fresh_recovery_keys: "{{ test_recovery_keys }}"
      when: not openbao_recovery_keyfile_stat.stat.exists
      no_log: true

    - name: Prepare gpg-agent for OpenBao's keyfiles
      ansible.builtin.import_role:
        name: dragonbishop.cluster.openbao
        tasks_from: gpg_agent

    - name: Write the recovery keyfile
      ansible.builtin.import_role:
        name: dragonbishop.cluster.openbao
        tasks_from: keyfile
