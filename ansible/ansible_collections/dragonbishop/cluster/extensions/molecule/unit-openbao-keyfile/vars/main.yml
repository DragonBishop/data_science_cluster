---
openbao_local_dir: /root/openbao-test
openbao_keyfile: "{{ openbao_local_dir }}/unseal-keys.gpg"
openbao_gpg_passphrase: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, seed='unit-openbao-keyfile-passphrase') }}"
test_unseal_keys:
  - "{{ lookup('ansible.builtin.password', '/dev/null', length=44, chars=['ascii_letters', 'digits', '+/'], seed='unit-openbao-keyfile-key-1') }}"
  - "{{ lookup('ansible.builtin.password', '/dev/null', length=44, chars=['ascii_letters', 'digits', '+/'], seed='unit-openbao-keyfile-key-2') }}"
  - "{{ lookup('ansible.builtin.password', '/dev/null', length=44, chars=['ascii_letters', 'digits', '+/'], seed='unit-openbao-keyfile-key-3') }}"
