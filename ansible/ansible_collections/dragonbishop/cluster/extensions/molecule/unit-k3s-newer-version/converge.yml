---
- name: The k3s install over a newer installed k3s
  hosts: molecule
  tasks:
    - name: Run the k3s role's install tasks
      block:
        - name: Install k3s
          ansible.builtin.import_role:
            name: dragonbishop.cluster.k3s
            tasks_from: install

        - name: Fail if the install was not refused
          ansible.builtin.fail:
            msg: install.yml finished without refusing
      rescue:
        - name: It should refuse because the installed k3s is newer than the pin
          ansible.builtin.assert:
            that:
              - "'is newer than the pinned' in ansible_failed_result.msg"
            fail_msg: "the install stopped for another reason: {{ ansible_failed_result.msg }}"
