---
ansible:
  cfg:
    defaults:
      collections_path: ${MOLECULE_PROJECT_DIRECTORY}/../../..
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/../inventory/
        - --inventory=${MOLECULE_PROJECT_DIRECTORY}/../../../inventory/

scenario:
  test_sequence:
    - prepare
    - converge
    - verify
    - idempotence
    - verify
    - cleanup

prerun: false
shared_state: true
