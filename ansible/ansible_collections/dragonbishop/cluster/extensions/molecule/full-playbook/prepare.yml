---
- name: Prepare the runner for the bootstrap playbook
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create the SeaweedFS host path
      ansible.builtin.file:
        path: "{{ cluster_config.SEAWEEDFS_HOST_PATH }}"
        state: directory
        mode: "0755"
      become: true

    - name: Run the host firewall setup
      ansible.builtin.command:
        cmd: src/bash/setup-firewall.sh
        chdir: "{{ repo_root }}"
      register: setup_firewall_result
      changed_when: false
      failed_when: >-
        setup_firewall_result.rc != 0
        or 'not found in infrastructure/cluster-config' in setup_firewall_result.stderr
