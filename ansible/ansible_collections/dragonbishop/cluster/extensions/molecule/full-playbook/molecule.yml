---
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/../inventory/
        - --extra-vars=opentofu_state_encryption_passphrase={{ 'full-playbook-state' | hash('sha256') }}
        - --extra-vars=opentofu_postgres_superuser_password={{ 'full-playbook-superuser' | hash('sha256') }}
        - --extra-vars=opentofu_binary=${OPENTOFU_BINARY}

scenario:
  test_sequence:
    - prepare
    - converge
    - verify
    - idempotence
    - side_effect
    - verify

shared_state: false
