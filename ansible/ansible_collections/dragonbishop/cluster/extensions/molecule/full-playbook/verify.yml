---
- name: The cluster after bootstrap
  hosts: localhost
  gather_facts: true
  vars:
    group_vars_dir: "{{ playbook_dir + '/../../../playbooks/group_vars/all' }}"
    routed_variable_names: >-
      {{ query('ansible.builtin.file',
               group_vars_dir + '/certificates.yml',
               group_vars_dir + '/cpu_memory.yml',
               group_vars_dir + '/networking.yml',
               group_vars_dir + '/replicas.yml',
               group_vars_dir + '/storage.yml',
               group_vars_dir + '/versions.yml')
         | map('from_yaml') | map('list') | flatten }}
  tasks:
    - name: Wait for Flux to apply cluster-config
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig="{{ kubeconfig_path }}" -n flux-system wait
          kustomization/cluster-config --for=create --for=condition=Ready --timeout=600s
      changed_when: false

    - name: Wait for Flux to apply Cilium's values
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig="{{ kubeconfig_path }}" -n flux-system wait
          kustomization/cilium --for=create --for=condition=Ready --timeout=600s
      changed_when: false

    - name: Read the live cluster-config ConfigMap
      kubernetes.core.k8s_info:
        kind: ConfigMap
        name: cluster-config
        namespace: flux-system
      register: live_cluster_config

    - name: It should route every Ansible variable to its live cluster-config value
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.vars', item) == live_cluster_config.resources[0].data.get(item | upper)
        fail_msg: >-
          {{ item }} is {{ lookup('ansible.builtin.vars', item) }},
          but cluster-config holds {{ live_cluster_config.resources[0].data.get(item | upper, 'no ' ~ item | upper) }}
      loop: "{{ routed_variable_names }}"

    - name: Render the Cilium values the cilium role installs
      ansible.builtin.import_role:
        name: dragonbishop.cluster.cilium
        tasks_from: render

    - name: Read the cilium-values ConfigMap Flux applies
      kubernetes.core.k8s_info:
        kind: ConfigMap
        name: cilium-values
        namespace: kube-system
      register: live_cilium_values

    - name: It should install Cilium with the values Flux reconciles to
      ansible.builtin.assert:
        that:
          - (cilium_values_substituted.stdout | from_yaml) == (live_cilium_values.resources[0].data['values.yaml'] | from_yaml)
        fail_msg: the cilium role's values differ from the cilium-values ConfigMap

    - name: Wait for OpenBao's root CA in spire
      kubernetes.core.k8s_info:
        kind: ConfigMap
        name: openbao-root-ca
        namespace: spire
      register: spire_openbao_root_ca
      until:
        - spire_openbao_root_ca.resources | length == 1
        - spire_openbao_root_ca.resources[0].data.get('ca.crt', '') | length > 0
      retries: 60
      delay: 5

    - name: Read the SPIRE server Service
      kubernetes.core.k8s_info:
        kind: Service
        name: spire-server
        namespace: spire
      register: spire_server_service

    - name: It should sign SPIRE's certificate with the OpenBao root
      ansible.builtin.command:
        cmd: >-
          timeout 10s openssl s_client -brief -alpn h2 -verify_return_error
          -CAfile /dev/stdin -connect {{ spire_server_service.resources[0].spec.clusterIP }}:443
        stdin: "{{ spire_openbao_root_ca.resources[0].data['ca.crt'] }}"
      changed_when: false

    - name: Wait for Flux to adopt cert-manager
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig="{{ kubeconfig_path }}" -n cert-manager wait
          helmrelease/cert-manager --for=create --for=condition=Ready --timeout=600s
      changed_when: false

    - name: It should allow cert-manager to request its own token
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig="{{ kubeconfig_path }}" auth can-i create
          serviceaccounts/cert-manager --subresource=token -n cert-manager
          --as=system:serviceaccount:cert-manager:cert-manager
          --as-group=system:serviceaccounts --as-group=system:serviceaccounts:cert-manager
          --as-group=system:authenticated
      changed_when: false

    - name: Check cert-manager requesting another account in its namespace
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig="{{ kubeconfig_path }}" auth can-i create
          serviceaccounts/default --subresource=token -n cert-manager
          --as=system:serviceaccount:cert-manager:cert-manager
          --as-group=system:serviceaccounts --as-group=system:serviceaccounts:cert-manager
          --as-group=system:authenticated
      register: cert_manager_other_token
      changed_when: false
      failed_when: false

    - name: It should deny cert-manager a different account in its namespace
      ansible.builtin.assert:
        that:
          - cert_manager_other_token.rc == 1
          - cert_manager_other_token.stdout | trim == 'no'

    - name: Check cert-manager requesting the Flux administrator token
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig="{{ kubeconfig_path }}" auth can-i create
          serviceaccounts/helm-controller --subresource=token -n flux-system
          --as=system:serviceaccount:cert-manager:cert-manager
          --as-group=system:serviceaccounts --as-group=system:serviceaccounts:cert-manager
          --as-group=system:authenticated
      register: cert_manager_flux_token
      changed_when: false
      failed_when: false

    - name: It should deny cert-manager the Flux administrator token
      ansible.builtin.assert:
        that:
          - cert_manager_flux_token.rc == 1
          - cert_manager_flux_token.stdout | trim == 'no'

    - name: Wait for Flux to adopt trust-manager
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig="{{ kubeconfig_path }}" -n cert-manager wait
          helmrelease/trust-manager --for=create --for=condition=Ready --timeout=600s
      changed_when: false

    - name: Wait for Flux to adopt OpenBao
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig="{{ kubeconfig_path }}" -n openbao wait
          helmrelease/openbao --for=create --for=condition=Ready --timeout=600s
      changed_when: false

    - name: Wait for Flux to reconcile the CNPG operator
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig="{{ kubeconfig_path }}" -n flux-system wait
          kustomization/cnpg-operator --for=create --for=condition=Ready --timeout=1200s
      changed_when: false

    - name: Wait for Flux to reconcile databases
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig="{{ kubeconfig_path }}" -n flux-system wait
          kustomization/databases --for=create --for=condition=Ready --timeout=1200s
      changed_when: false

    - name: It should archive Postgres WAL to SeaweedFS
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig="{{ kubeconfig_path }}" -n databases wait
          cluster.postgresql.cnpg.io/postgres-cluster --for=create --for=condition=ContinuousArchiving --timeout=600s
      changed_when: false

    - name: It should start Results with its mounted database login
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig="{{ kubeconfig_path }}" -n tekton wait
          deployment/tekton-results-api --for=create --for=condition=Available --timeout=1200s
      changed_when: false

    - name: Read the PostgreSQL cluster
      kubernetes.core.k8s_info:
        api_version: postgresql.cnpg.io/v1
        kind: Cluster
        name: postgres-cluster
        namespace: databases
      register: postgres_cluster

    - name: Verify the shared Gateway
      vars:
        gateway_hostname: "databases.{{ live_cluster_config.resources[0].data.INTERNAL_DOMAIN }}"
        gateway_address: "{{ live_cluster_config.resources[0].data.GATEWAY_IP }}"
      block:
        - name: It should verify the Gateway certificate chain and hostname
          ansible.builtin.command:
            cmd: >-
              timeout 10s openssl s_client -brief -verify_return_error
              -verify_hostname {{ gateway_hostname }} -servername {{ gateway_hostname }}
              -CAfile /dev/stdin -connect {{ gateway_address }}:443
            stdin: "{{ spire_openbao_root_ca.resources[0].data['ca.crt'] }}"
          changed_when: false

        - name: It should serve PostgreSQL through the Gateway
          ansible.builtin.command:
            cmd: >-
              kubectl --kubeconfig="{{ kubeconfig_path }}" -n databases
              exec {{ postgres_cluster.resources[0].status.currentPrimary }} -c postgres --
              pg_isready --host={{ gateway_address }} --port=5432 --timeout=10
          changed_when: false
