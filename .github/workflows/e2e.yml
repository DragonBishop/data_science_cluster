name: e2e

on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  e2e-scope:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.files.outputs.skip }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RELEASE_FILES: '\.release-please-manifest\.json|docs/CHANGELOG\.md|src/data_science_cluster/__init__\.py|ansible/ansible_collections/data_science/cluster/galaxy\.yml'
          E2E_PATHS: '^(ansible|clusters|infrastructure|apps|terraform|components|modules|scripts)/|^\.github/workflows/e2e\.yml$|^pyproject\.toml$|^uv\.lock$'
        run: |
          cluster_files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' | grep -v -x -E "$RELEASE_FILES" | grep -E "$E2E_PATHS" || true)
          echo "skip=$([ -z "$cluster_files" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  bootstrap:
    needs: e2e-scope
    if: ${{ !cancelled() && needs.e2e-scope.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      GITHUB_APP_ID: ${{ secrets.FLUX_GITHUB_APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ secrets.FLUX_GITHUB_APP_INSTALLATION_ID }}
      FLUX_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: ".python-version"
      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          version: 2.9.6
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: v1.13.1
          tofu_wrapper: false
      - run: uv sync --frozen
      - run: uv run ansible-galaxy collection install -r ansible/requirements.yml

      - name: Generate the test secrets
        run: |
          for variable_name in OPENBAO_GPG_PASSPHRASE OPENTOFU_STATE_ENCRYPTION_PASSPHRASE OPENTOFU_POSTGRES_SUPERUSER_PASSWORD; do
            secret_value="$(openssl rand -hex 32)"
            echo "::add-mask::$secret_value"
            echo "$variable_name=$secret_value" >> "$GITHUB_ENV"
          done
          echo "OPENTOFU_BINARY=$(command -v tofu)" >> "$GITHUB_ENV"

      - name: Write the Flux GitHub App private key
        env:
          FLUX_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FLUX_GITHUB_APP_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/flux-github-app.pem"
          printf '%s\n' "$FLUX_GITHUB_APP_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "GITHUB_APP_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Bootstrap the cluster with the integration scenario
        run: uv run molecule test
        working-directory: ansible

      - name: Wait for every Kustomization to be Ready
        run: |
          kustomizations=$(kubectl -n flux-system get kustomization -o name)
          deadline=$((SECONDS + 1200))
          until kubectl -n flux-system wait $kustomizations --for=condition=ready --timeout=0s > /dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo "Kustomizations not Ready after 20 minutes"
              exit 1
            fi
            flux get kustomizations
            sleep 60
          done
          flux get kustomizations

      - name: Show the cluster state
        if: failure()
        run: |
          flux get all -A || true
          for controller in source-controller kustomize-controller helm-controller; do
            kubectl -n flux-system logs deploy/$controller --tail=200 || true
          done
          kubectl get pods -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 100 || true
