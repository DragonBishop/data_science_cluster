name: e2e

on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  e2e-scope:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.files.outputs.skip }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RELEASE_FILES: '\.release-please-manifest\.json|docs/CHANGELOG\.md|src/data_science_cluster/__init__\.py|ansible/ansible_collections/dragonbishop/cluster/(galaxy\.yml|CHANGELOG\.md)'
          E2E_PATHS: '^(ansible|clusters|infrastructure|apps|terraform|components|modules|scripts)/|^\.github/workflows/e2e\.yml$|^pyproject\.toml$|^uv\.lock$'
        run: |
          cluster_files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' | grep -v -x -E "$RELEASE_FILES" | grep -E "$E2E_PATHS" || true)
          echo "skip=$([ -z "$cluster_files" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  bootstrap:
    needs: e2e-scope
    if: ${{ !cancelled() && needs.e2e-scope.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      GITHUB_APP_ID: ${{ secrets.FLUX_GITHUB_APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ secrets.FLUX_GITHUB_APP_INSTALLATION_ID }}
      FLUX_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
      - uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          version: 2.10.0
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: v1.13.2
          tofu_wrapper: false
      - run: uv sync --frozen
      - run: uv run ansible-galaxy collection install --upgrade -p ansible ansible/ansible_collections/dragonbishop/cluster

      - name: Generate the test secrets
        run: |
          for variable_name in OPENBAO_GPG_PASSPHRASE OPENTOFU_STATE_ENCRYPTION_PASSPHRASE OPENTOFU_POSTGRES_SUPERUSER_PASSWORD; do
            secret_value="$(openssl rand -hex 32)"
            echo "::add-mask::$secret_value"
            echo "$variable_name=$secret_value" >> "$GITHUB_ENV"
          done
          echo "OPENTOFU_BINARY=$(command -v tofu)" >> "$GITHUB_ENV"

      - name: Write the Flux GitHub App private key
        env:
          FLUX_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FLUX_GITHUB_APP_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/flux-github-app.pem"
          printf '%s\n' "$FLUX_GITHUB_APP_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "GITHUB_APP_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Bootstrap the cluster with the full-playbook scenario
        run: uv run molecule test --scenario-name full-playbook
        working-directory: ansible/ansible_collections/dragonbishop/cluster

      - name: Wait for every Kustomization to be Ready
        run: |
          kustomizations=$(kubectl -n flux-system get kustomization -o name)
          deadline=$((SECONDS + 1200))
          until kubectl -n flux-system wait $kustomizations --for=condition=ready --timeout=0s > /dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo "Kustomizations not Ready after 20 minutes"
              exit 1
            fi
            flux get kustomizations
            sleep 60
          done
          flux get kustomizations

      - name: Show the Flux objects
        if: failure() || cancelled()
        run: flux get all -A || true

      - name: Show source-controller's logs
        if: failure() || cancelled()
        run: kubectl logs -n flux-system deploy/source-controller --tail=200 || true

      - name: Show kustomize-controller's logs
        if: failure() || cancelled()
        run: kubectl logs -n flux-system deploy/kustomize-controller --tail=200 || true

      - name: Show helm-controller's logs
        if: failure() || cancelled()
        run: kubectl logs -n flux-system deploy/helm-controller --tail=200 || true

      - name: Show the pods
        if: failure() || cancelled()
        run: kubectl get pods -A || true

      - name: Show Postgres Flux reconciliation
        if: failure() || cancelled()
        run: |
          kubectl get kustomizations.kustomize.toolkit.fluxcd.io cnpg-operator databases -n flux-system -o wide || true
          kubectl get clusters.postgresql.cnpg.io -A -o wide || true

      - name: Show the recent events
        if: failure() || cancelled()
        run: kubectl get events -A --sort-by=.lastTimestamp | tail -n 100

      - name: Describe pods that are not ready
        if: failure() || cancelled()
        run: |
          kubectl get pods -A -o json |
            jq -r '
              .items[]
              | select(.status.phase != "Succeeded")
              | select(.status.phase != "Running" or any(.status.conditions[]?; .type == "Ready" and .status != "True"))
              | [.metadata.namespace, .metadata.name] | @tsv
            ' |
            while IFS=$'\t' read -r namespace pod_name; do
              kubectl describe pod -n "$namespace" "$pod_name" || true
              kubectl logs -n "$namespace" "$pod_name" --all-containers --prefix --tail=100 || true
            done
