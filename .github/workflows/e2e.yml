name: e2e

on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  e2e-scope:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.files.outputs.skip }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RELEASE_FILES: '\.release-please-manifest\.json|docs/CHANGELOG\.md|src/data_science_cluster/__init__\.py|ansible/ansible_collections/dragonbishop/cluster/(galaxy\.yml|CHANGELOG\.md)'
          E2E_PATHS: '^(ansible|clusters|infrastructure|apps|terraform|components|modules|scripts|src/bash)/|^\.github/workflows/e2e\.yml$|^(ansible\.cfg|pyproject\.toml|uv\.lock)$'
        run: |
          cluster_files="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' |
              grep -v -x -E "$RELEASE_FILES" |
              grep -E "$E2E_PATHS" || true
          )"
          skip=false
          if [[ -z "$cluster_files" ]]; then
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  bootstrap-ubuntu:
    needs: e2e-scope
    if: ${{ !cancelled() && needs.e2e-scope.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      REPO_DIR: .
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &setup_uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - &read_flux_version
        name: Read the Flux version gotk-components pins
        id: flux_version
        run: |
          flux_version="$(awk '/^# Flux Version: v/ {sub(/^v/, "", $4); print $4; exit}' clusters/local/flux-system/gotk-components.yaml)"
          echo "version=$flux_version" >> "$GITHUB_OUTPUT"
      - &setup_flux
        uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          version: ${{ steps.flux_version.outputs.version }}
      - &setup_opentofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: v1.13.9
          tofu_wrapper: false

      - &install_python_environment
        name: Install the Python environment
        run: $ON_NODE uv --directory "$REPO_DIR" sync --frozen

      - &install_collection
        name: Install the collection
        run: |
          $ON_NODE uv --directory "$REPO_DIR" run ansible-galaxy collection install \
            --upgrade -p ansible ansible/ansible_collections/dragonbishop/cluster

      - &write_flux_private_key
        name: Write the Flux GitHub App private key
        env:
          FLUX_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FLUX_GITHUB_APP_PRIVATE_KEY }}
        run: |
          $ON_NODE install --mode=600 /dev/null /tmp/flux-github-app.pem
          printf '%s\n' "$FLUX_GITHUB_APP_PRIVATE_KEY" | $ON_NODE tee /tmp/flux-github-app.pem > /dev/null

      - &run_full_playbook
        name: Bootstrap the cluster with the full-playbook scenario
        env:
          GITHUB_APP_ID: ${{ secrets.FLUX_GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.FLUX_GITHUB_APP_INSTALLATION_ID }}
          FLUX_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          $ON_NODE bash -s <<EOF
          export GITHUB_APP_ID='$GITHUB_APP_ID'
          export GITHUB_APP_INSTALLATION_ID='$GITHUB_APP_INSTALLATION_ID'
          export GITHUB_APP_PRIVATE_KEY_PATH=/tmp/flux-github-app.pem
          export FLUX_GIT_BRANCH='$FLUX_GIT_BRANCH'
          export OPENTOFU_BINARY="\$(command -v tofu)"
          uv --directory '$REPO_DIR/ansible/ansible_collections/dragonbishop/cluster' \
            run molecule test --scenario-name full-playbook
          EOF

      - &wait_for_kustomizations
        name: Wait for every Kustomization to be Ready
        run: |
          $ON_NODE kubectl -n flux-system wait kustomization --all \
            --for=condition=ready --timeout=1200s

      - &show_flux_objects
        name: Show the Flux objects
        if: failure() || cancelled()
        run: $ON_NODE flux get all -A || true

      - &show_cluster_state
        name: Show the cluster's state
        if: failure() || cancelled()
        run: |
          for controller_name in source-controller kustomize-controller helm-controller; do
            echo "--- $controller_name logs"
            $ON_NODE kubectl logs -n flux-system "deploy/$controller_name" --tail=200 || true
          done

          echo "--- Pods"
          $ON_NODE kubectl get pods -A || true

          echo "--- Postgres clusters"
          $ON_NODE kubectl get clusters.postgresql.cnpg.io -A -o wide || true

          echo "--- Recent events"
          $ON_NODE kubectl get events -A --sort-by=.lastTimestamp | tail -n 100

          echo "--- Logs from unready pods"
          unready_pods="$(
            $ON_NODE kubectl get pods -A --no-headers --field-selector=status.phase!=Succeeded |
              awk '{ split($3, ready, "/") } ready[1] != ready[2] { print $1, $2 }'
          )"
          xargs --no-run-if-empty --max-lines=1 \
            $ON_NODE kubectl describe pod -n <<< "$unready_pods" || true
          xargs --no-run-if-empty --max-lines=1 \
            $ON_NODE kubectl logs --all-containers --prefix --tail=100 -n <<< "$unready_pods" || true

  bootstrap-fedora:
    needs: e2e-scope
    if: ${{ !cancelled() && needs.e2e-scope.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      ON_NODE: ssh lima-node
      REPO_DIR: repo
    steps:
      - *checkout
      - *setup_uv
      - *read_flux_version
      - *setup_flux
      - *setup_opentofu
      - uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5 # v1.1.0
        with:
          version: v2.3.0

      - name: Start the Fedora VM
        run: |
          limactl start --plain --name=node \
            --cpus=4 --memory=12 --disk=60 template:fedora-44

      - name: Install the VM's packages
        run: $ON_NODE sudo dnf install --assumeyes rsync firewalld git gnupg2 openssl

      - name: Start firewalld in the VM
        run: $ON_NODE sudo systemctl enable --now firewalld

      - name: Give the VM the cluster's LAN interface
        run: |
          lan_interface="$(yq '.data.LAN_INTERFACE' infrastructure/cluster-config/networking.yaml)"
          $ON_NODE sudo ip link add "$lan_interface" type dummy

      - name: Copy the tools into the VM
        run: |
          for tool_name in uv kubectl helm flux tofu; do
            tool_path="$(command -v "$tool_name")"
            rsync --copy-links --executability --rsync-path='sudo rsync' \
              "$tool_path" "lima-node:/usr/local/bin/$tool_name"
          done

      - name: Copy the repository into the VM
        run: rsync --archive ./ "lima-node:$REPO_DIR/"

      - *install_python_environment
      - *install_collection
      - *write_flux_private_key
      - *run_full_playbook
      - *wait_for_kustomizations
      - *show_flux_objects
      - *show_cluster_state

      - name: Show SELinux denials
        if: failure() || cancelled()
        run: $ON_NODE sudo journalctl -k --grep=avc --no-pager || true
