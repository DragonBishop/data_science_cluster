name: tests

on:
  workflow_dispatch:
  pull_request:
  # push:
  #   branches: [main]
permissions:
  contents: read

jobs:
  release-only:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.files.outputs.skip }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RELEASE_FILES: '\.release-please-manifest\.json|docs/CHANGELOG\.md|src/data_science_cluster/__init__\.py|ansible/ansible_collections/data_science/cluster/galaxy\.yml'
        run: |
          other_files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' | grep -v -x -E "$RELEASE_FILES" || true)
          echo "skip=$([ -z "$other_files" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  molecule-unit:
    needs: release-only
    if: ${{ !cancelled() && needs.release-only.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    env:
      CONTAINER_HOST: unix:///run/podman/podman.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: ".python-version"
      - name: Give the runner user root's podman socket
        run: |
          sudo systemctl start podman.socket
          sudo chmod 0711 /run/podman
          sudo chown "$USER" /run/podman/podman.sock
      - run: uv sync --frozen
      - run: uv run ansible-galaxy collection install -r ansible/requirements.yml
      - run: uv run molecule test --all
        working-directory: ansible/ansible_collections/data_science/cluster
  pytest:
    needs: release-only
    if: ${{ !cancelled() && needs.release-only.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: "Set up Python"
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: ".python-version"
      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          version: 2.9.6
      - name: Install the project
        run: uv sync --all-extras --all-groups --frozen
      - name: unit tests
        run: |
          set -o pipefail && \
          uv run pytest --cov=src/data_science_cluster --cov-report=term-missing:skip-covered --junitxml=pytest.xml \
          | tee pytest-coverage.txt
      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@9ee59af31bd7bcada1cc496f086b407122602dbd # v1.12.3
        continue-on-error: true
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
