name: release

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  lint-pr-title:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - id: version
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: echo "tag=v$(jq -r '."."' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          args: --tag ${{ steps.version.outputs.tag }} -o docs/CHANGELOG.md
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/CHANGELOG.md
          git commit -m "docs: regenerate changelog for ${{ steps.version.outputs.tag }}" || exit 0
          git push
