name: release

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  lint-pr-title:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - id: version
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: echo "tag=v$(jq -r '."."' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: orhun/git-cliff-action@v4
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          args: --tag ${{ steps.version.outputs.tag }} -o CHANGELOG.md
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: regenerate changelog for ${{ steps.version.outputs.tag }}" || exit 0
          git push
