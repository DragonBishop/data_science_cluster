name: release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  lint-commits:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit messages against Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|refactor|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
          status=0
          while IFS= read -r line; do
            sha=${line%% *}
            subject=${line#* }
            if ! grep -qE "$pattern" <<< "$subject"; then
              echo "::error::${sha}: '${subject}' is not a Conventional Commit (type(scope)!: description)"
              status=1
            fi
          done < <(git log --no-merges --format='%h %s' "$BASE..$HEAD")
          exit "$status"

  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - id: version
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: echo "tag=v$(jq -r '."."' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          args: --tag ${{ steps.version.outputs.tag }} -o docs/CHANGELOG.md --github-repo ${{ github.repository }}
      # Collection changelog; the manifest keeps release tags in the filter, a95e17a only created it.
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          args: >-
            --tag ${{ steps.version.outputs.tag }}
            --include-path "ansible/**"
            --include-path ".release-please-manifest.json"
            --skip-commit a95e17a292a2bb6ff23b585bc4f05081108d280a
            -o ansible/ansible_collections/dragonbishop/cluster/CHANGELOG.md
            --github-repo ${{ github.repository }}
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/CHANGELOG.md ansible/ansible_collections/dragonbishop/cluster/CHANGELOG.md
          git commit -m "docs: regenerate changelog for ${{ steps.version.outputs.tag }}" || exit 0
          git push
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.release_created }}
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        if: ${{ steps.release.outputs.release_created }}
        with:
          args: --latest --strip all -o release-notes.md --github-repo ${{ github.repository }}
      - if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$TAG" --notes-file release-notes.md
