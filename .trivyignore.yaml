misconfigurations:
  - id: KSV-0037
    paths:
      - cilium.yaml
      - cilium-hubble.yaml
      - openbao-server.yaml
      - secrets-store-csi-driver.yaml
    statement: Cilium, CoreDNS's LAN Service, Hubble UI's certificate and redirect, its namespaced desktop Issuer, and the CSI driver serve kube-system workloads.
  - id: KSV-0109
    paths:
      - cluster-config.yaml
      - databases-objectstore.yaml
      - openbao-server.yaml
    statement: These ConfigMaps store configuration and Secret references.
  - id: KSV-01010
    paths:
      - cluster-config.yaml
      - openbao-server.yaml
    statement: The matched fields describe certificate key sizes and the seal key file path.
  - id: KSV-0109
    paths:
      - kube-prometheus-stack-server.yaml
    statement: Grafana reads its password from a CSI-mounted file and its admin credentials from a Secret.
  - id: KSV-01010
    paths:
      - kube-prometheus-stack-server.yaml
    statement: The chart values reference TLS Secret keys and certificate files.
  - id: KSV-0109
    paths:
      - cilium-hubble.yaml
    statement: The chart values name the Secret that holds the Cilium operator's TLS certificate.
  - id: KSV-01010
    paths:
      - cilium-hubble.yaml
    statement: The chart values include the key name for Hubble's CA bundle.
  - id: KSV-0048
    paths:
      - tekton-pipelines.yaml
    statement: Role core-test-role creates and deletes the probe pods of core-test's unauthorized-pod-denied Task
  - id: KSV-0125
    paths:
      - databases-objectstore.yaml
      - openbao-snapshot.yaml
    statement: The cluster's images come from registry.k8s.io, ghcr.io, quay.io and Docker Hub, which the check's default trusted list does not name
  - id: KSV-0125
    paths:
      - tekton-dashboard.yaml
    statement: The Dashboard uses Tekton's digest-pinned GHCR release and Ghostunnel's pinned Docker Hub release.
  - id: DS-0026
    paths:
      - cluster/Dockerfile
      - host/Dockerfile
    statement: Devcontainers run interactively in VS Code, which reads no HEALTHCHECK
