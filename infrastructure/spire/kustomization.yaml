apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - spire-release.yaml
  - core-test-spiffeid.yaml
  - flux-controllers-spiffeid.yaml
  - prometheus-spiffeid.yaml
  - rotate-credentials-spiffeid.yaml
  - spire-metrics-service.yaml
  - spire-networkpolicy.yaml
configMapGenerator:
  - name: spire-values
    namespace: spire
    files:
      - values.yaml=spire-values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
