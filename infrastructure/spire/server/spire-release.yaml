apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: spire
  namespace: spire
spec:
  interval: 24h
  url: https://spiffe.github.io/helm-charts-hardened/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire-crds
  namespace: spire
spec:
  driftDetection:
    mode: enabled
  interval: 1h
  releaseName: spire-crds
  chart:
    spec:
      chart: spire-crds
      version: "${SPIRE_CRDS_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: spire
  install:
    remediation:
      retries: ${SPIRE_HELM_RETRIES}
  upgrade:
    remediation:
      retries: ${SPIRE_HELM_RETRIES}
      remediateLastFailure: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name:  spire
  namespace: spire
spec:
  driftDetection:
    mode: enabled
  interval: 1h
  releaseName: spire
  chart:
    spec:
      chart: spire
      version: "${SPIRE_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: spire
  dependsOn:
    - name: spire-crds
  valuesFrom:
    - kind: ConfigMap
      name: spire-values
      valuesKey: values.yaml
  # Flux only: the monitors need the Prometheus CRDs
  values:
    spire-server:
      telemetry:
        prometheus:
          podMonitor:
            enabled: true
    spire-agent:
      telemetry:
        prometheus:
          podMonitor:
            enabled: true
  # Server SVIDs lack DNS SANs. SPIRE verifies Prometheus's client SVID.
  postRenderers:
    - kustomize:
        patches:
          # The controller-manager's 8082 has no TLS
          - target:
              kind: PodMonitor
              name: spire-server
            patch: |
              - op: remove
                path: /spec/podMetricsEndpoints/1
          - target:
              kind: PodMonitor
              name: (spire-server|spire-agent)
            patch: |
              - op: add
                path: /spec/podMetricsEndpoints/0/scheme
                value: https
              - op: add
                path: /spec/podMetricsEndpoints/0/tlsConfig
                value:
                  insecureSkipVerify: true
