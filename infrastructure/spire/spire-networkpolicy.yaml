apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: spire
  namespace: spire
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: server
      app.kubernetes.io/instance: spire
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9988"
              protocol: TCP
