apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: openbao-snapshot-s3
  namespace: openbao
spec:
  provider: openbao
  parameters:
    baoAddress: https://openbao.openbao.svc:8200
    baoCACertPath: /openbao-ca/ca.crt
    roleName: openbao-snapshot-s3-role
    audience: openbao
    objects: |
      - objectName: AWS_ACCESS_KEY_ID
        secretPath: seaweedfs/creds/openbao-snapshot
        secretKey: access_key
      - objectName: AWS_SECRET_ACCESS_KEY
        secretPath: seaweedfs/creds/openbao-snapshot
        secretKey: secret_key
  secretObjects:
    - secretName: openbao-snapshot-s3
      type: Opaque
      data:
        - objectName: AWS_ACCESS_KEY_ID
          key: AWS_ACCESS_KEY_ID
        - objectName: AWS_SECRET_ACCESS_KEY
          key: AWS_SECRET_ACCESS_KEY
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-snapshot-credentials
  namespace: openbao
---
# The snapshot CronJob's pods come and go, so this pod holds the mount the S3 Secret is mirrored from
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-snapshot-credentials
  namespace: openbao
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao-snapshot-credentials
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-snapshot-credentials
    spec:
      serviceAccountName: openbao-snapshot-credentials
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
      containers:
        - name: hold
          image: registry.k8s.io/pause:${PAUSE_IMAGE_TAG}
          resources:
            requests:
              cpu: ${OPENBAO_SNAPSHOT_CREDENTIALS_CPU_REQUEST}
              memory: ${OPENBAO_SNAPSHOT_CREDENTIALS_MEM_REQUEST}
            limits:
              memory: ${OPENBAO_SNAPSHOT_CREDENTIALS_MEM_LIMIT}
          volumeMounts:
            - name: openbao-snapshot-s3
              mountPath: /mnt/openbao-snapshot-s3
              readOnly: true
      volumes:
        - name: openbao-snapshot-s3
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: openbao-snapshot-s3
