apiVersion: v1
kind: PersistentVolume
metadata:
  name: loki
  labels:
    data-cluster/volume: loki
spec:
  capacity:
    storage: ${LOKI_STORAGE_SIZE}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: ${LOKI_HOST_PATH}
    type: DirectoryOrCreate
