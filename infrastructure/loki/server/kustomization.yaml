apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - loki-release.yaml
configMapGenerator:
  - name: loki-values
    namespace: observability
    files:
      - values.yaml=loki-values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
