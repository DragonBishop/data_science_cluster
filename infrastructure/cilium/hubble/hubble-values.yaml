# Cilium Helm values for Hubble
hubble:
  eventBufferCapacity: "${HUBBLE_EVENT_BUFFER_CAPACITY}"
  relay:
    resources:
      requests:
        memory: ${HUBBLE_RELAY_MEM_REQUEST}
      limits:
        memory: ${HUBBLE_RELAY_MEM_LIMIT}
    enabled: true
    tls:
      server:
        enabled: true
        mtls: true
  # localhost-tls serves HTTPS to the workstation
  ui:
    enabled: true
    frontend:
      resources:
        requests:
          cpu: ${HUBBLE_UI_FRONTEND_CPU_REQUEST}
          memory: ${HUBBLE_UI_FRONTEND_MEM_REQUEST}
        limits:
          memory: ${HUBBLE_UI_FRONTEND_MEM_LIMIT}
    backend:
      resources:
        requests:
          cpu: ${HUBBLE_UI_BACKEND_CPU_REQUEST}
          memory: ${HUBBLE_UI_BACKEND_MEM_REQUEST}
        limits:
          memory: ${HUBBLE_UI_BACKEND_MEM_LIMIT}
  tls:
    auto:
      enabled: true
      method: certmanager
      certValidityDuration: ${HUBBLE_CERT_VALIDITY_DAYS}
      certManagerIssuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: openbao-pki-issuer
