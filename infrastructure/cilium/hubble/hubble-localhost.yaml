# Hubble UI on loopback; literal ports preserve their string type in Flux
apiVersion: cilium.io/v2
kind: CiliumLocalRedirectPolicy
metadata:
  name: hubble-ui-localhost
  namespace: kube-system
spec:
  redirectFrontend:
    addressMatcher:
      ip: "127.0.0.1"
      toPorts:
        - port: "12000"
          protocol: TCP
  redirectBackend:
    localEndpointSelector:
      matchLabels:
        k8s-app: hubble-ui
    toPorts:
      - port: "8443"
        protocol: TCP
