apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 24h
  type: oci
  url: oci://quay.io/cilium/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  releaseName: cilium
  timeout: 10m
  chart:
    spec:
      chart: cilium
      version: "${CILIUM_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: cilium
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: cilium-values-hubble
      valuesKey: values.yaml
      optional: true
  upgrade:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true