# CoreDNS custom configuration for the internal zone
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  internal.server: |
    ${INTERNAL_DOMAIN}:53 {
      template IN A ${INTERNAL_DOMAIN} {
        match "^.*\.${INTERNAL_DOMAIN}\.?$"
        answer "{{ .Name }} 60 IN A ${GATEWAY_IP}"
      }
    }
