apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 24h
  type: oci
  url: oci://quay.io/cilium/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  driftDetection:
    mode: enabled
  releaseName: cilium
  timeout: 10m
  chart:
    spec:
      chart: cilium
      version: "${CILIUM_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: cilium
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: hubble-values
      valuesKey: values.yaml
      optional: true
  # The operator's chart monitor has no TLS settings
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ServiceMonitor
              name: cilium-operator
            patch: |
              - op: add
                path: /spec/endpoints/0/scheme
                value: https
              - op: add
                path: /spec/endpoints/0/tlsConfig
                value:
                  serverName: cilium-operator.kube-system.svc.cluster.local
                  ca:
                    configMap:
                      name: openbao-root-ca
                      key: ca.crt
          # Terminate HTTPS inside the Hubble UI pod
          - target:
              kind: Deployment
              name: hubble-ui
            patch: |
              - op: add
                path: /spec/template/spec/containers/-
                value:
                  name: localhost-tls
                  image: ghostunnel/ghostunnel:${GHOSTUNNEL_VERSION}
                  args:
                    - server
                    - --listen=0.0.0.0:8443
                    - --target=127.0.0.1:8081
                    - --cert=/tls/tls.crt
                    - --key=/tls/tls.key
                    # Access is restricted to the host
                    - --disable-authentication
                    # Picks up cert-manager's renewal
                    - --timed-reload=1h
                  ports:
                    - name: localhost-tls
                      containerPort: 8443
                      protocol: TCP
                  securityContext:
                    runAsUser: 65532
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: [ALL]
                    seccompProfile:
                      type: RuntimeDefault
                  resources:
                    requests:
                      cpu: ${LOCALHOST_TLS_CPU_REQUEST}
                      memory: ${LOCALHOST_TLS_MEM_REQUEST}
                    limits:
                      memory: ${LOCALHOST_TLS_MEM_LIMIT}
                  volumeMounts:
                    - name: localhost-tls
                      mountPath: /tls
                      readOnly: true
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: localhost-tls
                  secret:
                    secretName: hubble-ui-localhost-tls
  install:
    remediation:
      retries: ${CILIUM_HELM_RETRIES}
  upgrade:
    crds: CreateReplace
    remediation:
      retries: ${CILIUM_HELM_RETRIES}
      remediateLastFailure: true
