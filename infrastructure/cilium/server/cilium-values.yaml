# Cilium Helm chart values

kubeProxyReplacement: true

# Direct API server endpoint for kube-proxy replacement
k8sServiceHost: "${K3S_API_HOST}"
k8sServicePort: ${K3S_API_PORT}

ipv4NativeRoutingCIDR: "${POD_CIDR}"

bpf:
  masquerade: true

resources:
  requests:
    cpu: ${CILIUM_CPU_REQUEST}
    memory: ${CILIUM_MEM_REQUEST}
  limits:
    memory: ${CILIUM_MEM_LIMIT}

# Single-node cluster
operator:
  replicas: ${CILIUM_OPERATOR_REPLICAS}
  resources:
    requests:
      cpu: ${CILIUM_OPERATOR_CPU_REQUEST}
      memory: ${CILIUM_OPERATOR_MEM_REQUEST}
    limits:
      memory: ${CILIUM_OPERATOR_MEM_LIMIT}

envoy:
  prometheus:
    enabled: false
  resources:
    requests:
      cpu: ${CILIUM_ENVOY_CPU_REQUEST}
      memory: ${CILIUM_ENVOY_MEM_REQUEST}

l2announcements:
  enabled: true

ipam:
  operator:
    # Must match k3s --cluster-cidr.
    clusterPoolIPv4PodCIDRList:
      - "${POD_CIDR}"

gatewayAPI:
  enabled: true

egressGateway:
  # Enables the CiliumEgressGatewayPolicy CRD.
  enabled: true

# Enables the CiliumLocalRedirectPolicy CRD.
localRedirectPolicy: true

# Lets every pod on a booting node queue for its network endpoint instead of getting 429s
apiRateLimit: "endpoint-create=auto-adjust:false,rate-limit:${CILIUM_ENDPOINT_CREATE_RATE_LIMIT},rate-burst:${CILIUM_ENDPOINT_CREATE_BURST},parallel-requests:${CILIUM_ENDPOINT_CREATE_PARALLEL},max-wait-duration:${CILIUM_ENDPOINT_CREATE_MAX_WAIT}"

# Agent metrics on loopback; Ghostunnel serves them to Prometheus with the SPIRE socket over hostPath
extraConfig:
  prometheus-serve-addr: "127.0.0.1:9962"
podLabels:
  data-cluster/metrics-tls: "true"
extraVolumes:
  - name: spire-agent-socket
    hostPath:
      path: /run/spire/agent-sockets
      type: DirectoryOrCreate
extraContainers:
  - name: metrics-tls
    image: ghostunnel/ghostunnel:${GHOSTUNNEL_VERSION}
    args:
      - server
      - --listen=0.0.0.0:${METRICS_TLS_PORT}
      - --target=127.0.0.1:9962
      - --use-workload-api-addr=unix:///run/spire/agent-sockets/spire-agent.sock
      - --use-workload-api-timeout=0
      - --allow-uri=spiffe://cluster.internal/ns/observability/sa/prometheus
    ports:
      - name: metrics-tls
        containerPort: ${METRICS_TLS_PORT}
        protocol: TCP
    securityContext:
      runAsUser: 65532
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: ${METRICS_TLS_CPU_REQUEST}
        memory: ${METRICS_TLS_MEM_REQUEST}
      limits:
        memory: ${METRICS_TLS_MEM_LIMIT}
    volumeMounts:
      - name: spire-agent-socket
        mountPath: /run/spire/agent-sockets
        readOnly: true
