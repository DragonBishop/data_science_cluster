# gateway-l2-policy.yaml
#
# ARP-announces .240 for the Gateway's generated Service, same pattern as
# the retired postgis-l2-policy. Same serviceSelector caveat as
# gateway-lb-pool.yaml — confirm the label before applying.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: gateway-l2-policy
spec:
  serviceSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: internal-gateway # confirm before use — see gateway-lb-pool.yaml
  interfaces:
    - ^enp9s0$
  externalIPs: false
  loadBalancerIPs: true
