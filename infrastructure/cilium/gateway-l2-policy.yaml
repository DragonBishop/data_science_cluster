# gateway-l2-policy.yaml
#
# ARP-announces .240 for the Gateway's generated Service, same pattern as
# the retired postgis-l2-policy. Targets the same serviceSelector label as
# gateway-lb-pool.yaml.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: gateway-l2-policy
spec:
  serviceSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: internal-gateway
  interfaces:
    - ^enp9s0$
  externalIPs: false
  loadBalancerIPs: true
