# Cilium Helm chart values (Gateway API v1.6.1)

kubeProxyReplacement: true

# Direct API server endpoint for kube-proxy replacement
k8sServiceHost: "127.0.0.1"
k8sServicePort: 6443

bpf:
  masquerade: true

resources:
  requests:
    cpu: 20m
    memory: 200Mi
  limits:
    memory: 600Mi

# Single-node cluster
operator:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 150Mi
    limits:
      memory: 450Mi

envoy:
  resources:
    requests:
      cpu: 1.75m
      memory: 65Mi

l2announcements:
  enabled: true

ipam:
  operator:
    # Must match k3s --cluster-cidr.
    clusterPoolIPv4PodCIDRList:
      - "10.42.0.0/16"

gatewayAPI:
  enabled: true

egressGateway:
  # Enables the CiliumEgressGatewayPolicy CRD.
  enabled: true

# Enables the CiliumLocalRedirectPolicy CRD.
localRedirectPolicy: true