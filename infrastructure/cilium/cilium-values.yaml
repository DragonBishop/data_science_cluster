# Cilium Helm chart values (Gateway API version tracked in cluster-config.yaml GATEWAY_API_VERSION)

kubeProxyReplacement: true

# Direct API server endpoint for kube-proxy replacement
k8sServiceHost: "${K3S_API_HOST}"
k8sServicePort: ${K3S_API_PORT}

ipv4NativeRoutingCIDR: "${POD_CIDR}"

bpf:
  masquerade: true
  hostRouting: false

resources:
  requests:
    cpu: ${CILIUM_CPU_REQUEST}
    memory: ${CILIUM_MEM_REQUEST}
  limits:
    memory: ${CILIUM_MEM_LIMIT}

# Single-node cluster
operator:
  replicas: ${CILIUM_OPERATOR_REPLICAS}
  resources:
    requests:
      cpu: ${CILIUM_OPERATOR_CPU_REQUEST}
      memory: ${CILIUM_OPERATOR_MEM_REQUEST}
    limits:
      memory: ${CILIUM_OPERATOR_MEM_LIMIT}

envoy:
  resources:
    requests:
      cpu: ${CILIUM_ENVOY_CPU_REQUEST}
      memory: ${CILIUM_ENVOY_MEM_REQUEST}

l2announcements:
  enabled: true

ipam:
  operator:
    # Must match k3s --cluster-cidr.
    clusterPoolIPv4PodCIDRList:
      - "${POD_CIDR}"

gatewayAPI:
  enabled: true

egressGateway:
  # Enables the CiliumEgressGatewayPolicy CRD.
  enabled: true

# Enables the CiliumLocalRedirectPolicy CRD.
localRedirectPolicy: true
