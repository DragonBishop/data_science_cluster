# lan-lb-pool.yaml
#
# Reserved LAN address block for every LoadBalancer Service in the cluster.
# No serviceSelector — Cilium treats a pool with none as the default pool,
# so any LoadBalancer Service gets the next free IP from this block.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-ip-pool
spec:
  blocks:
    - start: "192.0.2.240"
      stop: "192.0.2.250"
