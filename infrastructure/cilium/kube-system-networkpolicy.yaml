apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  ingress:
    # LAN clients use the CoreDNS LoadBalancer directly
    - fromCIDR:
        - "${LAN_CIDR}"
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Every pod resolves through CoreDNS
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
  egress:
    # Upstream resolvers
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Policies for components k3s bundles into kube-system
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s-app: metrics-server
  egress:
    # Kubelet metrics
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hubble-relay
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s-app: hubble-relay
  egress:
    # Hubble server in the Cilium agent
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "4244"
              protocol: TCP
  ingress:
    # hubble-drops in Tekton runs
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tekton-pipelines
      toPorts:
        - ports:
            - port: "4245"
              protocol: TCP
