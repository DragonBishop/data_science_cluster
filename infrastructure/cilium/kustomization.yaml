apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cilium-release.yaml
  - lan-lb-pool.yaml
  - lan-l2-policy.yaml
configMapGenerator:
  - name: cilium-values
    namespace: kube-system
    files:
      - values.yaml=cilium-values.yaml
generatorOptions:
  disableNameSuffixHash: true