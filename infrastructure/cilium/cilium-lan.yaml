# Reserved LAN IP address pool for LoadBalancer Services
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-ip-pool
spec:
  blocks:
    - start: "${GATEWAY_IP}"
      stop: "${LAN_LB_POOL_STOP}"
---
# L2 announcement policy for LoadBalancer Services on the LAN interface
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan-l2-policy
spec:
  interfaces:
    - "^${LAN_INTERFACE}$"
  externalIPs: false
  loadBalancerIPs: true
