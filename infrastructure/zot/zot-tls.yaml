apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zot-tls
  namespace: zot
spec:
  secretName: zot-tls
  dnsNames:
    - zot.zot.svc.cluster.local
  usages:
    - server auth
  duration: ${OPENBAO_PKI_CERT_DURATION}
  renewBefore: ${OPENBAO_PKI_CERT_RENEW_BEFORE}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  issuerRef:
    name: openbao-pki-issuer
    kind: ClusterIssuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: zot
  namespace: zot
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: zot
  validation:
    hostname: zot.zot.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: openbao-root-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zot
  namespace: zot
spec:
  parentRefs:
    - name: internal-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - zot.${INTERNAL_DOMAIN}
  rules:
    - backendRefs:
        - name: zot
          port: 5000
