apiVersion: v1
kind: ServiceAccount
metadata:
  name: zot
  namespace: zot
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: zot
  namespace: zot
spec:
  provider: openbao
  parameters:
    baoAddress: https://openbao.openbao.svc:8200
    baoCACertPath: /openbao-ca/ca.crt
    roleName: zot-role
    audience: openbao
    objects: |
      - objectName: AWS_ACCESS_KEY_ID
        secretPath: seaweedfs/creds/zot
        secretKey: access_key
      - objectName: AWS_SECRET_ACCESS_KEY
        secretPath: seaweedfs/creds/zot
        secretKey: secret_key
      - objectName: htpasswd
        secretPath: secret/data/zot-push
        secretKey: htpasswd
  secretObjects:
    - secretName: zot-s3
      type: Opaque
      data:
        - objectName: AWS_ACCESS_KEY_ID
          key: AWS_ACCESS_KEY_ID
        - objectName: AWS_SECRET_ACCESS_KEY
          key: AWS_SECRET_ACCESS_KEY
