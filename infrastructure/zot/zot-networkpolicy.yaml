apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zot
  namespace: zot
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: zot
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
  egress:
    - toFQDNs:
        - matchName: ghcr.io
        - matchName: pkg-containers.githubusercontent.com
        - matchName: quay.io
        - matchPattern: "*.quay.io"
        - matchName: registry-1.docker.io
        - matchName: auth.docker.io
        - matchPattern: "**.docker.com"
        - matchName: docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com
        - matchName: registry.k8s.io
        - matchPattern: "*.pkg.dev"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
