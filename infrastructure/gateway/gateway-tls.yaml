# Wildcard edge TLS certificate for *.internal HTTPRoutes issued via Vault PKI
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-edge-cert
  namespace: gateway
spec:
  secretName: internal-edge-cert
  dnsNames:
    - "*.internal"
    - "internal"
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: vault-pki-issuer
    kind: ClusterIssuer
