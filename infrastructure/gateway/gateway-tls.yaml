# Wildcard edge TLS certificate for the internal domain's HTTPRoutes issued via Vault PKI
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-edge-cert
  namespace: gateway
spec:
  secretName: internal-edge-cert
  dnsNames:
    - "*.${INTERNAL_DOMAIN}"
    - "${INTERNAL_DOMAIN}"
    - "hubble.${INTERNAL_DOMAIN}"
  duration: ${VAULT_PKI_CERT_DURATION}
  renewBefore: ${VAULT_PKI_CERT_RENEW_BEFORE}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  issuerRef:
    name: vault-pki-issuer
    kind: ClusterIssuer
