# Clients allowed to reach the shared Gateway's listeners: the LAN and the node itself
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: gateway-clients
spec:
  endpointSelector:
    matchExpressions:
      - key: reserved:ingress
        operator: Exists
  ingress:
    - fromCIDR:
        - "${LAN_CIDR}"
        - 127.0.0.1/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "5432"
              protocol: TCP
