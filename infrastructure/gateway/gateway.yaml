# Shared Gateway for HTTPS (443) and PostgreSQL (5432) traffic
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-gateway
  namespace: gateway
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: "${GATEWAY_IP}"
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.internal"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: internal-edge-cert
      allowedRoutes:
        namespaces:
          from: All
    - name: postgres
      protocol: TCP
      port: 5432
      allowedRoutes:
        namespaces:
          from: All
