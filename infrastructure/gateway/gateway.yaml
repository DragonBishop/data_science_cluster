# gateway.yaml
#
# The one shared Gateway every internal tool attaches a Route to. HTTPS
# listener (443) for web UIs, raw TCP listener (5432) for Postgres.
# allowedRoutes.namespaces.from: All lets any namespace attach without a
# ReferenceGrant. Pinned via spec.addresses to GATEWAY_IP (infrastructure/cluster-config/).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-gateway
  namespace: gateway
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: "${GATEWAY_IP}"
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.internal"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: internal-edge-cert
      allowedRoutes:
        namespaces:
          from: All
    - name: postgres
      protocol: TCP
      port: 5432
      allowedRoutes:
        namespaces:
          from: All
