# Cilium Helm values for Hubble Relay and UI
hubble:
  relay:
    resources:
      requests:
        memory: ${HUBBLE_RELAY_MEM_REQUEST}
      limits:
        memory: ${HUBBLE_RELAY_MEM_LIMIT}
    enabled: true
    tls:
      server:
        enabled: true
        mtls: true
  ui:
    frontend:
      resources:
        requests:
          memory: ${HUBBLE_UI_FRONTEND_MEM_REQUEST}
        limits:
          memory: ${HUBBLE_UI_FRONTEND_MEM_LIMIT}
    backend:
      resources:
        requests:
          memory: ${HUBBLE_UI_BACKEND_MEM_REQUEST}
        limits:
          memory: ${HUBBLE_UI_BACKEND_MEM_LIMIT}
    enabled: true
  tls:
    auto:
      enabled: true
      method: certmanager
      certManagerIssuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: vault-pki-issuer
