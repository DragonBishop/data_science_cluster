# Cilium chart values for Hubble Relay/UI, merged into the cilium
# HelmRelease (infrastructure/cilium/cilium-release.yaml) as an optional
# valuesFrom source. Generated as a ConfigMap by this Kustomization, which
# depends on cert-manager and gateway — the ConfigMap only exists once
# hubble-ca-issuer does.
hubble:
  relay:
    enabled: true
    tls:
      server:
        enabled: true
        mtls: true
  ui:
    enabled: true
  tls:
    auto:
      enabled: true
      method: certmanager
      certManagerIssuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: hubble-ca-issuer
