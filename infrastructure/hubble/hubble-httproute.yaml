# hubble-httproute.yaml
#
# Attaches Hubble UI to the shared Gateway (infrastructure/gateway/) at
# hubble.internal. Lives in kube-system, alongside its own backendRef
# (hubble-ui Service, port 80.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: internal-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - "hubble.internal"
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
