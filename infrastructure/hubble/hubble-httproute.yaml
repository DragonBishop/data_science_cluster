# hubble-httproute.yaml
#
# Routes to the hubble-ui Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: internal-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - "hubble.internal"
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
