apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - hubble-localhost.yaml
configMapGenerator:
  - name: hubble-values
    namespace: kube-system
    files:
      - values.yaml=hubble-values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
