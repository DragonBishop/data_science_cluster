apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hubble-relay
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s-app: hubble-relay
  egress:
    # Hubble server in the Cilium agent
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "4244"
              protocol: TCP
