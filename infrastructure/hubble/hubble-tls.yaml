# hubble-tls.yaml
#
# ClusterIssuer chain for Hubble's mTLS certificates (hubble.tls.auto.method:
# certmanager in infrastructure/cilium/cilium-values.yaml). Cluster-scoped,
# not namespaced like postgis-ca-issuer, because Cilium's chart only supports
# referencing a ClusterIssuer for this feature.
#
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: hubble-selfsigned-bootstrap
spec:
  selfSigned: {}
---
# Dedicated local CA for Hubble, separate from postgis-local-ca — Hubble's
# mTLS trust domain (cilium-agent, hubble-relay, hubble-ui) has no reason to
# share a root with the Postgres server certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hubble-local-ca
  # ClusterIssuer.spec.ca.secretName resolves in cert-manager's configured
  # cluster-resource-namespace, confirmed live as `cert-manager`
  # (--cluster-resource-namespace=$(POD_NAMESPACE) on the cert-manager
  # controller Deployment) — this Certificate must be created here, not in
  # kube-system where the Hubble/Cilium pods themselves run.
  namespace: cert-manager
spec:
  isCA: true
  commonName: hubble-local-ca
  secretName: hubble-local-ca-secret
  duration: 87600h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: hubble-selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: hubble-ca-issuer
spec:
  ca:
    secretName: hubble-local-ca-secret
