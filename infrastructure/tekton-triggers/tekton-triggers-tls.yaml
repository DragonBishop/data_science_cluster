apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: el-flux-events-cert
  namespace: tekton-triggers
spec:
  secretName: el-flux-events-cert
  dnsNames:
    - el-flux-events.tekton-triggers.svc.cluster.local
  usages:
    - server auth
  duration: ${OPENBAO_PKI_CERT_DURATION}
  renewBefore: ${OPENBAO_PKI_CERT_RENEW_BEFORE}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  issuerRef:
    name: openbao-pki-issuer
    kind: ClusterIssuer
