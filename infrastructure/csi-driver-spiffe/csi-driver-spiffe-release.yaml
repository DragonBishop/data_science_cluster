apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-spiffe
  namespace: cert-manager
spec:
  interval: 1h
  releaseName: csi-driver-spiffe
  chart:
    spec:
      chart: cert-manager-csi-driver-spiffe
      version: "v0.15.0"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
  values:
    app:
      logLevel: 1
      trustDomain: cluster.local
      issuer:
        name: vault-pki-issuer
        kind: ClusterIssuer
        group: cert-manager.io
      driver:
        resources:
          requests:
            cpu: 1m
            memory: 50Mi
          limits:
            memory: 150Mi
    approver:
      replicaCount: 1
      resources:
        requests:
          cpu: 1m
          memory: 50Mi
        limits:
          memory: 150Mi
