# Helm values for kube-prometheus-stack

# From prometheus-crds
crds:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false

# Inside k3s's server process; CoreDNS has no metrics TLS
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false

# Verified against kube-root-ca.crt
kubelet:
  serviceMonitor:
    # Keeps the chart's CA
    tlsConfig:
      insecureSkipVerify: false
    # Duplicates of the apiserver job's series on k3s
    metricRelabelings:
    - action: drop
      sourceLabels: [__name__]
      regex: (apiserver|etcd)_.*

grafana:
  # Bound by OpenBao's grafana-role
  serviceAccount:
    name: grafana
  rbac:
    namespaced: true
  # Synced by SecretProviderClass grafana
  admin:
    existingSecret: grafana-admin
  resources:
    requests:
      cpu: ${GRAFANA_CPU_REQUEST}
      memory: ${GRAFANA_MEM_REQUEST}
    limits:
      memory: ${GRAFANA_MEM_LIMIT}
  service:
    port: 3000
  route:
    main:
      enabled: true
      hostnames:
        - grafana.${INTERNAL_DOMAIN}
      parentRefs:
        - name: internal-gateway
          namespace: gateway
          sectionName: https
  readinessProbe:
    httpGet:
      path: /api/health
      port: grafana
      scheme: HTTPS
  livenessProbe:
    httpGet:
      path: /api/health
      port: grafana
      scheme: HTTPS
    initialDelaySeconds: 60
    timeoutSeconds: 30
    failureThreshold: 10
  serviceMonitor:
    scheme: https
    tlsConfig:
      serverName: kube-prometheus-stack-grafana.observability.svc.cluster.local
      ca:
        configMap:
          name: openbao-root-ca
          key: ca.crt
  grafana.ini:
    server:
      protocol: https
      cert_file: /etc/grafana/tls/tls.crt
      cert_key: /etc/grafana/tls/tls.key
      root_url: https://grafana.${INTERNAL_DOMAIN}/
    database:
      type: postgres
      host: postgres-cluster-rw.databases.svc.cluster.local:5432
      name: ${GRAFANA_DB_NAME}
      user: $__file{/mnt/grafana-credentials/username}
      password: $__file{/mnt/grafana-credentials/password}
      ssl_mode: verify-full
      ca_cert_path: /etc/postgres-ca/ca.crt
    # No internet egress
    analytics:
      check_for_updates: false
      check_for_plugin_updates: false
      reporting_enabled: false
    plugins:
      public_key_retrieval_disabled: true
  extraSecretMounts:
    - name: grafana-tls
      secretName: grafana-tls
      mountPath: /etc/grafana/tls
      readOnly: true
  extraConfigmapMounts:
    - name: postgres-ca
      configMap: postgres-ca
      mountPath: /etc/postgres-ca
      readOnly: true
    - name: openbao-root-ca
      configMap: openbao-root-ca
      mountPath: /etc/openbao-root-ca
      readOnly: true
  extraVolumes:
    - name: grafana-credentials
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: grafana
  extraVolumeMounts:
    - name: grafana-credentials
      mountPath: /mnt/grafana-credentials
      readOnly: true
  # Restarts the pod's containers in place when the database login rotates
  extraInitContainers:
    - name: credential-watch
      image: alpine/k8s:${ALPINE_K8S_VERSION}
      restartPolicy: Always
      restartPolicyRules:
        - action: RestartAllContainers
          exitCodes:
            operator: In
            values: [3]
      command: [bash, -c]
      args:
        - |
          while true; do
            current_user=$(< /credential/username) || exit 1
            [[ $current_user == "$STARTED_WITH" ]] || exit 3
            sleep 60
          done
      env:
        - name: STARTED_WITH
          valueFrom:
            secretKeyRef:
              name: grafana-postgres
              key: username
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: ${GRAFANA_CREDENTIAL_WATCH_CPU_REQUEST}
          memory: ${GRAFANA_CREDENTIAL_WATCH_MEM_REQUEST}
        limits:
          memory: ${GRAFANA_CREDENTIAL_WATCH_MEM_LIMIT}
      volumeMounts:
        - name: grafana-credentials
          mountPath: /credential
          readOnly: true
  sidecar:
    resources:
      requests:
        cpu: ${GRAFANA_SIDECAR_CPU_REQUEST}
        memory: ${GRAFANA_SIDECAR_MEM_REQUEST}
      limits:
        memory: ${GRAFANA_SIDECAR_MEM_LIMIT}
    dashboards:
      searchNamespace: [observability]
      reloadURL: https://localhost:3000/api/admin/provisioning/dashboards/reload
      env: &grafana-sidecar-env
        REQUESTS_CA_BUNDLE: /etc/openbao-root-ca/ca.crt
      extraMounts: &grafana-sidecar-mounts
        - name: openbao-root-ca
          mountPath: /etc/openbao-root-ca
          readOnly: true
    datasources:
      # Defined below with a verified CA
      defaultDatasourceEnabled: false
      alertmanager:
        enabled: false
      reloadURL: https://localhost:3000/api/admin/provisioning/datasources/reload
      env: *grafana-sidecar-env
      extraMounts: *grafana-sidecar-mounts
  additionalDataSources:
    - name: Prometheus
      type: prometheus
      uid: prometheus
      url: https://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
      access: proxy
      isDefault: true
      jsonData:
        httpMethod: POST
        tlsAuthWithCACert: true
      secureJsonData:
        tlsCACert: $__file{/etc/openbao-root-ca/ca.crt}
    - name: Alertmanager
      type: alertmanager
      uid: alertmanager
      url: https://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
      access: proxy
      jsonData:
        implementation: prometheus
        handleGrafanaManagedAlerts: false
        tlsAuthWithCACert: true
      secureJsonData:
        tlsCACert: $__file{/etc/openbao-root-ca/ca.crt}
    - name: Loki
      type: loki
      uid: loki
      url: https://loki.observability.svc.cluster.local:3100
      access: proxy
      jsonData:
        tlsAuthWithCACert: true
      secureJsonData:
        tlsCACert: $__file{/etc/openbao-root-ca/ca.crt}

prometheusOperator:
  resources:
    requests:
      cpu: ${PROMETHEUS_OPERATOR_CPU_REQUEST}
      memory: ${PROMETHEUS_OPERATOR_MEM_REQUEST}
    limits:
      memory: ${PROMETHEUS_OPERATOR_MEM_LIMIT}
  admissionWebhooks:
    # Helm installs rules before the operator can serve the admission webhooks.
    failurePolicy: IgnoreOnInstallOnly
    patch:
      enabled: false
    certManager:
      enabled: true
      admissionCert:
        duration: ${OPENBAO_PKI_CERT_DURATION}
      issuerRef:
        name: openbao-pki-issuer
        kind: ClusterIssuer
  prometheusConfigReloader:
    resources:
      requests:
        cpu: ${PROMETHEUS_CONFIG_RELOADER_CPU_REQUEST}
        memory: ${PROMETHEUS_CONFIG_RELOADER_MEM_REQUEST}
      limits:
        memory: ${PROMETHEUS_CONFIG_RELOADER_MEM_LIMIT}

alertmanager:
  serviceMonitor:
    scheme: https
    tlsConfig:
      serverName: kube-prometheus-stack-alertmanager.observability.svc.cluster.local
      ca:
        configMap:
          name: openbao-root-ca
          key: ca.crt
  alertmanagerSpec:
    resources:
      requests:
        cpu: ${ALERTMANAGER_CPU_REQUEST}
        memory: ${ALERTMANAGER_MEM_REQUEST}
      limits:
        memory: ${ALERTMANAGER_MEM_LIMIT}
    web:
      tlsConfig:
        cert:
          secret:
            name: alertmanager-web-tls
            key: tls.crt
        keySecret:
          name: alertmanager-web-tls
          key: tls.key
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: ""
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: ${ALERTMANAGER_STORAGE_SIZE}
          selector:
            matchLabels:
              data-cluster/volume: alertmanager

prometheus:
  serviceAccount:
    name: prometheus
  serviceMonitor:
    scheme: https
    tlsConfig:
      serverName: kube-prometheus-stack-prometheus.observability.svc.cluster.local
      ca:
        configMap:
          name: openbao-root-ca
          key: ca.crt
  prometheusSpec:
    retention: ${PROMETHEUS_RETENTION}
    retentionSize: ${PROMETHEUS_RETENTION_SIZE}
    # Accept Tekton's OTLP metrics with a 30-minute out-of-order window.
    enableOTLPReceiver: true
    tsdb:
      outOfOrderTimeWindow: 30m
    resources:
      requests:
        cpu: ${PROMETHEUS_CPU_REQUEST}
        memory: ${PROMETHEUS_MEM_REQUEST}
      limits:
        memory: ${PROMETHEUS_MEM_LIMIT}
    # All monitors and rules
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    web:
      tlsConfig:
        cert:
          secret:
            name: prometheus-web-tls
            key: tls.crt
        keySecret:
          name: prometheus-web-tls
          key: tls.key
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ""
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: ${PROMETHEUS_STORAGE_SIZE}
          selector:
            matchLabels:
              data-cluster/volume: prometheus
    # Sidecar-written files; monitor tlsConfig takes no files
    scrapeClasses:
      # Prometheus's SVID for every monitor without its own client certificate or CA
      - name: metrics-tls
        default: true
        tlsConfig:
          certFile: /svid/svid.pem
          keyFile: /svid/svid_key.pem
          caFile: /svid/bundle.pem
    volumes: &spiffe-helper-volumes
      - name: spiffe-workload-api
        csi:
          driver: csi.spiffe.io
          readOnly: true
      - name: svid
        emptyDir:
          medium: Memory
      - name: prometheus-sidecars
        configMap:
          name: prometheus-sidecars
    volumeMounts:
      - name: svid
        mountPath: /svid
        readOnly: true
    containers:
      - name: spiffe-helper
        image: ghcr.io/spiffe/spiffe-helper:${SPIFFE_HELPER_VERSION}
        args: ["-config", "/config/spiffe-helper.conf"]
        securityContext: &spiffe-helper-security
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources: &spiffe-helper-resources
          requests:
            cpu: ${SPIFFE_HELPER_CPU_REQUEST}
            memory: ${SPIFFE_HELPER_MEM_REQUEST}
          limits:
            memory: ${SPIFFE_HELPER_MEM_LIMIT}
        volumeMounts: &spiffe-helper-mounts
          - name: spiffe-workload-api
            mountPath: /spiffe-workload-api
            readOnly: true
          - name: svid
            mountPath: /svid
          - name: prometheus-sidecars
            mountPath: /config
            readOnly: true

kube-state-metrics:
  podLabels:
    data-cluster/metrics-tls: "true"
  resources:
    requests:
      cpu: ${KUBE_STATE_METRICS_CPU_REQUEST}
      memory: ${KUBE_STATE_METRICS_MEM_REQUEST}
    limits:
      memory: ${KUBE_STATE_METRICS_MEM_LIMIT}
  # Chart ServiceMonitor; SVIDs are named <namespace>.metrics.spiffe
  prometheus:
    monitor:
      http:
        scheme: https
        tlsConfig:
          serverName: observability.metrics.spiffe
  # Serves mTLS itself
  extraArgs:
    - --tls-config=/config/kube-state-metrics-web.yaml
  volumes: *spiffe-helper-volumes
  volumeMounts:
    - name: svid
      mountPath: /svid
      readOnly: true
    - name: prometheus-sidecars
      mountPath: /config
      readOnly: true
  # Native sidecar: starts first
  initContainers:
    - name: spiffe-helper
      image: ghcr.io/spiffe/spiffe-helper:${SPIFFE_HELPER_VERSION}
      restartPolicy: Always
      args: ["-config", "/config/spiffe-helper.conf"]
      securityContext: *spiffe-helper-security
      resources: *spiffe-helper-resources
      volumeMounts: *spiffe-helper-mounts

prometheus-node-exporter:
  namespaceOverride: node-exporter
  podLabels:
    jobLabel: node-exporter
    data-cluster/metrics-tls: "true"
  resources:
    requests:
      cpu: ${NODE_EXPORTER_CPU_REQUEST}
      memory: ${NODE_EXPORTER_MEM_REQUEST}
    limits:
      memory: ${NODE_EXPORTER_MEM_LIMIT}
  # The Service and chart ServiceMonitor reach the Ghostunnel host port
  service:
    targetPort: ${NODE_EXPORTER_METRICS_TLS_PORT}
  prometheus:
    monitor:
      scheme: https
      tlsConfig:
        serverName: node-exporter.metrics.spiffe
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: instance
  extraVolumes:
    - name: spiffe-workload-api
      csi:
        driver: csi.spiffe.io
        readOnly: true
  # The Cilium agent holds METRICS_TLS_PORT on the host
  sidecars:
    - name: metrics-tls
      image: ghostunnel/ghostunnel:${GHOSTUNNEL_VERSION}
      args:
        - server
        - --listen=0.0.0.0:${NODE_EXPORTER_METRICS_TLS_PORT}
        - --target=127.0.0.1:9100
        - --use-workload-api-addr=unix:///spiffe-workload-api/spire-agent.sock
        - --allow-uri=spiffe://cluster.internal/ns/observability/sa/prometheus
      ports:
        - name: metrics-tls
          containerPort: ${NODE_EXPORTER_METRICS_TLS_PORT}
          protocol: TCP
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: ${METRICS_TLS_CPU_REQUEST}
          memory: ${METRICS_TLS_MEM_REQUEST}
        limits:
          memory: ${METRICS_TLS_MEM_LIMIT}
      volumeMounts:
        - name: spiffe-workload-api
          mountPath: /spiffe-workload-api
          readOnly: true
