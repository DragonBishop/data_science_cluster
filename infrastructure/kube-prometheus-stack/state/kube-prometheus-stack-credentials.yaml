apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana
  namespace: observability
spec:
  provider: openbao
  parameters:
    baoAddress: https://openbao.openbao.svc:8200
    baoCACertPath: /openbao-ca/ca.crt
    roleName: grafana-role
    audience: openbao
    objects: |
      - objectName: username
        secretPath: database/creds/grafana-app-role
        secretKey: username
      - objectName: password
        secretPath: database/creds/grafana-app-role
        secretKey: password
      - objectName: admin-user
        secretPath: secret/data/grafana/admin
        secretKey: admin-user
      - objectName: admin-password
        secretPath: secret/data/grafana/admin
        secretKey: admin-password
  secretObjects:
    # credential-watch's starting value
    - secretName: grafana-postgres
      type: Opaque
      data:
        - objectName: username
          key: username
    # Grafana and its sidecars
    - secretName: grafana-admin
      type: Opaque
      data:
        - objectName: admin-user
          key: admin-user
        - objectName: admin-password
          key: admin-password
