# jetstack Helm Repository -> ./infrastructure/cert-manager/cert-manager-release.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  interval: 1h
  releaseName: trust-manager
  chart:
    spec:
      chart: trust-manager
      version: "${TRUST_MANAGER_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: jetstack
  valuesFrom:
    - kind: ConfigMap
      name: trust-manager-values
      valuesKey: values.yaml
