# IPs, CIDRs, ports, hostnames, domains, interfaces and Cilium's endpoint creation limits.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-config
  namespace: flux-system
data:
  CILIUM_ENDPOINT_CREATE_BURST: "40"
  CILIUM_ENDPOINT_CREATE_MAX_WAIT: "60s"
  CILIUM_ENDPOINT_CREATE_PARALLEL: "8"
  CILIUM_ENDPOINT_CREATE_RATE_LIMIT: "5/s"
  COREDNS_LAN_IP: "192.0.2.242"
  GATEWAY_IP: "192.0.2.240"
  INTERNAL_DOMAIN: "cluster.internal"
  K3S_API_HOST: "127.0.0.1"
  K3S_API_PORT: "6443"
  LAN_CIDR: "192.168.1.0/24"
  LAN_INTERFACE: "enp9s0"
  LAN_LB_POOL_STOP: "192.0.2.250"
  METRICS_TLS_PORT: "9445"
  NODE_EXPORTER_METRICS_TLS_PORT: "9446"
  POD_CIDR: "10.42.0.0/16"
  SEAWEEDFS_S3_PORT: "9000"
  TETRAGON_METRICS_TLS_PORT: "9447"
