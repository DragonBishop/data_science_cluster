# CPU and memory requests and limits, one section per component.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-config
  namespace: flux-system
data:
  # --- cert-manager ---
  CERT_MANAGER_CAINJECTOR_CPU_REQUEST: "1m"
  CERT_MANAGER_CAINJECTOR_MEM_LIMIT: "210Mi"
  CERT_MANAGER_CAINJECTOR_MEM_REQUEST: "70Mi"
  CERT_MANAGER_CPU_REQUEST: "1m"
  CERT_MANAGER_MEM_LIMIT: "300Mi"
  CERT_MANAGER_MEM_REQUEST: "100Mi"
  CERT_MANAGER_STARTUPAPICHECK_CPU_REQUEST: "1m"
  CERT_MANAGER_STARTUPAPICHECK_MEM_LIMIT: "200Mi"
  CERT_MANAGER_STARTUPAPICHECK_MEM_REQUEST: "50Mi"
  CERT_MANAGER_WEBHOOK_CPU_REQUEST: "1m"
  CERT_MANAGER_WEBHOOK_MEM_LIMIT: "180Mi"
  CERT_MANAGER_WEBHOOK_MEM_REQUEST: "60Mi"

  # --- Cilium / Hubble ---
  CILIUM_CPU_REQUEST: "20m"
  CILIUM_ENVOY_CPU_REQUEST: "1.75m"
  CILIUM_ENVOY_MEM_REQUEST: "65Mi"
  CILIUM_MEM_LIMIT: "1Gi"
  CILIUM_MEM_REQUEST: "256Mi"
  CILIUM_OPERATOR_CPU_REQUEST: "10m"
  CILIUM_OPERATOR_MEM_LIMIT: "450Mi"
  CILIUM_OPERATOR_MEM_REQUEST: "150Mi"
  HUBBLE_RELAY_MEM_LIMIT: "100Mi"
  HUBBLE_RELAY_MEM_REQUEST: "70Mi"

  # --- CNPG operator / barman-cloud plugin ---
  BARMAN_CLOUD_CPU_REQUEST: "10m"
  BARMAN_CLOUD_MEM_LIMIT: "630Mi"
  BARMAN_CLOUD_MEM_REQUEST: "210Mi"
  CNPG_CPU_REQUEST: "2m"
  CNPG_MEM_LIMIT: "600Mi"
  CNPG_MEM_REQUEST: "200Mi"

  # --- OpenBao ---
  OPENBAO_CPU_REQUEST: "30m"
  OPENBAO_CSI_PROVIDER_CPU_REQUEST: "5m"
  OPENBAO_CSI_PROVIDER_MEM_LIMIT: "60Mi"
  OPENBAO_CSI_PROVIDER_MEM_REQUEST: "20Mi"
  OPENBAO_MEM_LIMIT: "800Mi"
  OPENBAO_MEM_REQUEST: "350Mi"

  # --- PostGIS cluster ---
  BARMAN_S3_CREDENTIALS_CPU_REQUEST: "1m"
  BARMAN_S3_CREDENTIALS_MEM_LIMIT: "16Mi"
  BARMAN_S3_CREDENTIALS_MEM_REQUEST: "4Mi"
  POSTGRES_CPU_REQUEST: "500m"
  POSTGRES_MEM_LIMIT: "2Gi"
  POSTGRES_MEM_REQUEST: "1Gi"

  # --- Secrets Store CSI driver ---
  SECRETS_STORE_CSI_DRIVER_CPU_REQUEST: "10m"
  SECRETS_STORE_CSI_DRIVER_MEM_LIMIT: "150Mi"
  SECRETS_STORE_CSI_DRIVER_MEM_REQUEST: "50Mi"
  SECRETS_STORE_CSI_LIVENESS_CPU_REQUEST: "1m"
  SECRETS_STORE_CSI_LIVENESS_MEM_LIMIT: "30Mi"
  SECRETS_STORE_CSI_LIVENESS_MEM_REQUEST: "10Mi"
  SECRETS_STORE_CSI_REGISTRAR_CPU_REQUEST: "1m"
  SECRETS_STORE_CSI_REGISTRAR_MEM_LIMIT: "30Mi"
  SECRETS_STORE_CSI_REGISTRAR_MEM_REQUEST: "10Mi"

  # --- SPIRE --- ###
  SPIRE_AGENT_CPU_REQUEST: "10m"
  SPIRE_AGENT_MEM_REQUEST: "32Mi"
  SPIRE_AGENT_MEM_LIMIT: "64Mi"
  SPIRE_CONTROLLER_MANAGER_CPU_REQUEST: "10m"
  SPIRE_CONTROLLER_MANAGER_MEM_REQUEST: "32Mi"
  SPIRE_CONTROLLER_MANAGER_MEM_LIMIT: "64Mi"
  SPIFFE_CSI_DRIVER_CPU_REQUEST: "5m"
  SPIFFE_CSI_DRIVER_MEM_REQUEST: "16Mi"
  SPIFFE_CSI_DRIVER_MEM_LIMIT: "32Mi"
  SPIRE_SERVER_CPU_REQUEST: "20m"
  SPIRE_SERVER_MEM_REQUEST: "64Mi"
  SPIRE_SERVER_MEM_LIMIT: "128Mi"

  # --- SeaweedFS ---
  SEAWEEDFS_FILER_CPU_REQUEST: "5m"
  SEAWEEDFS_FILER_MEM_LIMIT: "512Mi"
  SEAWEEDFS_FILER_MEM_REQUEST: "192Mi"
  SEAWEEDFS_MASTER_CPU_REQUEST: "5m"
  SEAWEEDFS_MASTER_MEM_LIMIT: "256Mi"
  SEAWEEDFS_MASTER_MEM_REQUEST: "64Mi"
  SEAWEEDFS_S3_CPU_REQUEST: "5m"
  SEAWEEDFS_S3_MEM_LIMIT: "1Gi"
  SEAWEEDFS_S3_MEM_REQUEST: "256Mi"
  SEAWEEDFS_VOLUME_CPU_REQUEST: "5m"
  SEAWEEDFS_VOLUME_MEM_LIMIT: "512Mi"
  SEAWEEDFS_VOLUME_MEM_REQUEST: "64Mi"

  # --- Tekton Operator ---
  TEKTON_OPERATOR_CPU_REQUEST: "5m"
  TEKTON_OPERATOR_MEM_LIMIT: "300Mi"
  TEKTON_OPERATOR_MEM_REQUEST: "100Mi"
  TEKTON_OPERATOR_WEBHOOK_CPU_REQUEST: "2m"
  TEKTON_OPERATOR_WEBHOOK_MEM_LIMIT: "150Mi"
  TEKTON_OPERATOR_WEBHOOK_MEM_REQUEST: "50Mi"

  # --- Tekton Pipelines ---
  TEKTON_EVENTS_CONTROLLER_CPU_REQUEST: "2m"
  TEKTON_EVENTS_CONTROLLER_MEM_LIMIT: "120Mi"
  TEKTON_EVENTS_CONTROLLER_MEM_REQUEST: "40Mi"
  TEKTON_PIPELINES_CONTROLLER_CPU_REQUEST: "5m"
  TEKTON_PIPELINES_CONTROLLER_MEM_LIMIT: "250Mi"
  TEKTON_PIPELINES_CONTROLLER_MEM_REQUEST: "80Mi"
  TEKTON_PIPELINES_WEBHOOK_CPU_REQUEST: "5m"
  TEKTON_PIPELINES_WEBHOOK_MEM_LIMIT: "300Mi"
  TEKTON_PIPELINES_WEBHOOK_MEM_REQUEST: "100Mi"
  TEKTON_PROXY_WEBHOOK_CPU_REQUEST: "2m"
  TEKTON_PROXY_WEBHOOK_MEM_LIMIT: "120Mi"
  TEKTON_PROXY_WEBHOOK_MEM_REQUEST: "40Mi"
  TEKTON_RESOLVERS_CPU_REQUEST: "2m"
  TEKTON_RESOLVERS_MEM_LIMIT: "1Gi"
  TEKTON_RESOLVERS_MEM_REQUEST: "40Mi"

  # --- Tekton Results ---
  TEKTON_RESULTS_API_CPU_REQUEST: "2m"
  TEKTON_RESULTS_API_MEM_LIMIT: "240Mi"
  TEKTON_RESULTS_API_MEM_REQUEST: "80Mi"
  TEKTON_RESULTS_RETENTION_AGENT_CPU_REQUEST: "1m"
  TEKTON_RESULTS_RETENTION_AGENT_MEM_LIMIT: "90Mi"
  TEKTON_RESULTS_RETENTION_AGENT_MEM_REQUEST: "30Mi"
  TEKTON_RESULTS_WATCHER_CPU_REQUEST: "10m"
  TEKTON_RESULTS_WATCHER_MEM_LIMIT: "120Mi"
  TEKTON_RESULTS_WATCHER_MEM_REQUEST: "40Mi"

  # --- Tekton steps (defaults for steps that set none) ---
  TEKTON_STEP_CPU_REQUEST: "50m"
  TEKTON_STEP_MEM_LIMIT: "1Gi"
  TEKTON_STEP_MEM_REQUEST: "128Mi"

  # --- Tekton Triggers ---
  TEKTON_TRIGGERS_CONTROLLER_CPU_REQUEST: "2m"
  TEKTON_TRIGGERS_CONTROLLER_MEM_LIMIT: "120Mi"
  TEKTON_TRIGGERS_CONTROLLER_MEM_REQUEST: "40Mi"
  TEKTON_TRIGGERS_INTERCEPTORS_CPU_REQUEST: "2m"
  TEKTON_TRIGGERS_INTERCEPTORS_MEM_LIMIT: "120Mi"
  TEKTON_TRIGGERS_INTERCEPTORS_MEM_REQUEST: "40Mi"
  TEKTON_TRIGGERS_WEBHOOK_CPU_REQUEST: "2m"
  TEKTON_TRIGGERS_WEBHOOK_MEM_LIMIT: "120Mi"
  TEKTON_TRIGGERS_WEBHOOK_MEM_REQUEST: "40Mi"

  # --- Trust-Manager --- #
  TRUST_MANAGER_CPU_REQUEST: "10m"
  TRUST_MANAGER_MEM_REQUEST: "32Mi"
  TRUST_MANAGER_MEM_LIMIT: "64Mi"
