# How long, or how many, things are kept.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-config
  namespace: flux-system
data:
  HUBBLE_EVENT_BUFFER_CAPACITY: "16383"
  OPENBAO_SNAPSHOT_RETENTION_DAYS: "1"
  POSTGRES_BACKUP_RETENTION: "4d"
  PROMETHEUS_RETENTION: "30d"
  PROMETHEUS_RETENTION_SIZE: "18GB"
  TEKTON_PRUNER_KEEP: "100"
