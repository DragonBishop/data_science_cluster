# cluster-config.yaml
#
# Single source of truth for values otherwise duplicated across multiple
# manifests. Referenced via postBuild.substituteFrom by Kustomization.
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-config
  namespace: flux-system
data:
  # --- Backups ---
  CNPG_BACKUP_BUCKET: "cnpg-backups"
  POSTGIS_BACKUP_RETENTION: "4d"
  POSTGIS_BACKUP_SCHEDULE: "0 0 0 * * *"

  # --- Databases ---
  TEKTON_RESULTS_DB_NAME: "tekton_results"

  # --- Lifecycle ---
  ESO_DYNAMIC_REFRESH_INTERVAL: "2h"
  ESO_REFRESH_INTERVAL: "1h"
  POSTGIS_SMART_SHUTDOWN_TIMEOUT: "15"
  POSTGIS_STOP_DELAY: "60"
  TEKTON_PRUNER_KEEP: "100"
  TEKTON_PRUNER_SCHEDULE: "0 8 * * *"

  # --- Networking ---
  COREDNS_LAN_IP: "192.0.2.242"
  GATEWAY_IP: "192.0.2.240"
  GIT_FORGE_HOST: "github.com"
  INTERNAL_DOMAIN: "internal"
  K3S_API_HOST: "127.0.0.1"
  K3S_API_PORT: "6443"
  LAN_CIDR: "192.168.1.0/24"
  LAN_INTERFACE: "enp9s0"
  LAN_LB_POOL_STOP: "192.0.2.250"
  POD_CIDR: "10.42.0.0/16"
  SEAWEEDFS_S3_PORT: "9000"

  # --- Resource sizing: cert-manager ---
  CERT_MANAGER_CAINJECTOR_CPU_REQUEST: "1m"
  CERT_MANAGER_CAINJECTOR_MEM_LIMIT: "210Mi"
  CERT_MANAGER_CAINJECTOR_MEM_REQUEST: "70Mi"
  CERT_MANAGER_CPU_REQUEST: "1m"
  CERT_MANAGER_MEM_LIMIT: "300Mi"
  CERT_MANAGER_MEM_REQUEST: "100Mi"
  CERT_MANAGER_STARTUPAPICHECK_CPU_REQUEST: "1m"
  CERT_MANAGER_STARTUPAPICHECK_MEM_LIMIT: "200Mi"
  CERT_MANAGER_STARTUPAPICHECK_MEM_REQUEST: "50Mi"
  CERT_MANAGER_WEBHOOK_CPU_REQUEST: "1m"
  CERT_MANAGER_WEBHOOK_MEM_LIMIT: "180Mi"
  CERT_MANAGER_WEBHOOK_MEM_REQUEST: "60Mi"

  # --- Resource sizing: Cilium / Hubble ---
  CILIUM_CPU_REQUEST: "20m"
  CILIUM_ENVOY_CPU_REQUEST: "1.75m"
  CILIUM_ENVOY_MEM_REQUEST: "65Mi"
  CILIUM_MEM_LIMIT: "600Mi"
  CILIUM_MEM_REQUEST: "200Mi"
  CILIUM_OPERATOR_CPU_REQUEST: "10m"
  CILIUM_OPERATOR_MEM_LIMIT: "450Mi"
  CILIUM_OPERATOR_MEM_REQUEST: "150Mi"
  HUBBLE_RELAY_MEM_LIMIT: "100Mi"
  HUBBLE_RELAY_MEM_REQUEST: "70Mi"

  # --- Resource sizing: CNPG operator / barman-cloud plugin ---
  BARMAN_CLOUD_CPU_REQUEST: "10m"
  BARMAN_CLOUD_MEM_LIMIT: "630Mi"
  BARMAN_CLOUD_MEM_REQUEST: "210Mi"
  CNPG_CPU_REQUEST: "2m"
  CNPG_MEM_LIMIT: "600Mi"
  CNPG_MEM_REQUEST: "200Mi"

  # --- Resource sizing: External Secrets Operator ---
  ESO_CERT_CONTROLLER_CPU_REQUEST: "5m"
  ESO_CERT_CONTROLLER_MEM_LIMIT: "128Mi"
  ESO_CERT_CONTROLLER_MEM_REQUEST: "48Mi"
  ESO_CPU_REQUEST: "10m"
  ESO_MEM_LIMIT: "256Mi"
  ESO_MEM_REQUEST: "96Mi"
  ESO_WEBHOOK_CPU_REQUEST: "5m"
  ESO_WEBHOOK_MEM_LIMIT: "128Mi"
  ESO_WEBHOOK_MEM_REQUEST: "48Mi"

  # --- Resource sizing: OpenBao ---
  OPENBAO_CPU_REQUEST: "14m"
  OPENBAO_MEM_LIMIT: "800Mi"
  OPENBAO_MEM_REQUEST: "350Mi"

  # --- Resource sizing: PostGIS cluster ---
  POSTGIS_CPU_REQUEST: "500m"
  POSTGIS_MEM_LIMIT: "2Gi"
  POSTGIS_MEM_REQUEST: "1Gi"

  # --- Resource sizing: Tekton Operator ---
  TEKTON_OPERATOR_CPU_REQUEST: "5m"
  TEKTON_OPERATOR_MEM_LIMIT: "300Mi"
  TEKTON_OPERATOR_MEM_REQUEST: "100Mi"
  TEKTON_OPERATOR_WEBHOOK_CPU_REQUEST: "2m"
  TEKTON_OPERATOR_WEBHOOK_MEM_LIMIT: "150Mi"
  TEKTON_OPERATOR_WEBHOOK_MEM_REQUEST: "50Mi"

  # --- Storage sizing ---
  OPENBAO_DATA_STORAGE_SIZE: "10Gi"
  POSTGIS_STORAGE_CLASS: "local-path"
  POSTGIS_STORAGE_SIZE: "100Gi"
  SEAWEEDFS_HOST_PATH: "/mnt/vault13/seaweedfs"
  SEAWEEDFS_MAX_VOLUMES: "90"

  # --- TLS ---
  CERT_KEY_ALGORITHM: "ECDSA"
  CERT_KEY_SIZE: "256"
  HUBBLE_CERT_VALIDITY_DAYS: "30"
  LOCAL_CA_CERT_DURATION: "2160h"
  LOCAL_CA_CERT_RENEW_BEFORE: "360h"
  LOCAL_CA_ROOT_DURATION: "87600h"
  OPENBAO_PKI_CERT_DURATION: "720h"
  OPENBAO_PKI_CERT_RENEW_BEFORE: "120h"

  # --- Topology ---
  CILIUM_HELM_RETRIES: "3"
  CILIUM_OPERATOR_REPLICAS: "1"
  POSTGIS_INSTANCES: "1"

  # --- Versions ---
  BARMAN_CLOUD_VERSION: "0.8.0"
  CERT_MANAGER_VERSION: "1.21.2"
  CILIUM_VERSION: "1.20.2"
  CNPG_VERSION: "0.29.0"
  ESO_VERSION: "2.11.0"
  GATEWAY_API_VERSION: "v1.6.2"
  K3S_VERSION: "v1.37.0+k3s1"
  OPENBAO_IMAGE_TAG: "2.7.1"
  OPENBAO_VERSION: "0.30.2"
  POSTGIS_VERSION: "3.6.4"
  POSTGRES_VERSION: "18.6"
  SEAWEEDFS_VERSION: "4.47.0"
  TEKTON_OPERATOR_VERSION: "0.81.1"
