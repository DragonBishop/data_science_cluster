apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: cert-manager
spec:
  interval: 24h
  type: oci
  url: oci://quay.io/jetstack/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
  values:
    resources:
      requests:
        cpu: 1m
        memory: 100Mi
      limits:
        memory: 300Mi
    webhook:
      resources:
        requests:
          cpu: 1m
          memory: 60Mi
        limits:
          memory: 180Mi
    cainjector:
      resources:
        requests:
          cpu: 1m
          memory: 70Mi
        limits:
          memory: 210Mi
    startupapicheck:
      resources: 
        requests:
          cpu: 1m
          memory: 50Mi
        limits:
          memory: 200Mi
    crds:
      enabled: true