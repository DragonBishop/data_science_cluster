apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hashicorp
  namespace: vault
spec:
  interval: 24h
  url: https://helm.releases.hashicorp.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 1h
  releaseName: vault
  chart:
    spec:
      chart: vault
      version: "0.34.0"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
  valuesFrom:
    - kind: ConfigMap
      name: vault-values
      valuesKey: values.yaml