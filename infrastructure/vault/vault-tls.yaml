# Vault TLS certificates, local CA, and cert-manager ClusterIssuer configuration

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-selfsigned-bootstrap
spec:
  selfSigned: {}
---
# Dedicated local CA for Vault
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: vault-local-ca
  secretName: vault-local-ca-secret
  duration: ${LOCAL_CA_ROOT_DURATION}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  issuerRef:
    name: vault-selfsigned-bootstrap
    kind: ClusterIssuer
---
# ClusterIssuer backed by the Vault local CA
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-ca-issuer
spec:
  ca:
    secretName: vault-local-ca-secret
---
# Server certificate for Vault
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-server-cert
  namespace: vault
spec:
  secretName: vault-server-cert
  duration: ${LOCAL_CA_CERT_DURATION}
  renewBefore: ${LOCAL_CA_CERT_RENEW_BEFORE}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  dnsNames:
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - vault-internal
    - vault-internal.vault
    - vault-internal.vault.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: vault-ca-issuer
    kind: ClusterIssuer
---
# Vault CA bundle for the databases namespace
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-ca-databases
  namespace: databases
spec:
  commonName: vault-ca-bundle
  secretName: vault-ca-bundle
  duration: ${LOCAL_CA_CERT_DURATION}
  renewBefore: ${LOCAL_CA_CERT_RENEW_BEFORE}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  dnsNames:
    - vault-ca-bundle.unused.invalid
  issuerRef:
    name: vault-ca-issuer
    kind: ClusterIssuer
---
# Vault CA bundle for the tekton-pipelines namespace
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-ca-tekton
  namespace: tekton-pipelines
spec:
  commonName: vault-ca-bundle
  secretName: vault-ca-bundle
  duration: ${LOCAL_CA_CERT_DURATION}
  renewBefore: ${LOCAL_CA_CERT_RENEW_BEFORE}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  dnsNames:
    - vault-ca-bundle.unused.invalid
  issuerRef:
    name: vault-ca-issuer
    kind: ClusterIssuer
---
# ClusterIssuer backed by Vault's Intermediate PKI secrets engine.
# Signs leaf certificates for Postgres (postgis-tls) and SeaweedFS S3.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-pki-issuer
spec:
  vault:
    server: https://vault.vault.svc.cluster.local:8200
    path: pki_int/sign/internal-server
    caBundleSecretRef:
      name: vault-local-ca-secret
      key: tls.crt
    auth:
      kubernetes:
        role: cert-manager-pki-role
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: cert-manager
---
# RBAC allowing cert-manager to request tokens for Vault Kubernetes authentication.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-tokenrequest
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-tokenrequest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-tokenrequest
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
