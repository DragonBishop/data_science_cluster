# dns-release.yaml
#
# A standalone LAN-facing DNS resolver, separate from k3s's own in-cluster
# CoreDNS (kube-system, resolves *.svc.cluster.local for pods only). This
# instance is what LAN devices point their own DNS settings at, so every
# *.internal hostname (hubble.internal, postgres.internal, and any future
# tool) resolves without per-device /etc/hosts entries.

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: coredns
  namespace: dns
spec:
  interval: 24h
  url: https://coredns.github.io/helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
  namespace: dns
spec:
  interval: 1h
  releaseName: coredns
  chart:
    spec:
      chart: coredns
      version: "1.47.0"
      sourceRef:
        kind: HelmRepository
        name: coredns
  values:
    serviceType: LoadBalancer
    servers:
      - zones:
          - zone: .
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
          - name: ready
          # Answers every *.internal query with the Gateway's IP, so a new
          # tool needs only an HTTPRoute/TCPRoute — never a CoreDNS edit.
          - name: template
            parameters: IN A internal
            configBlock: |-
              match "^.*\.internal\.?$"
              answer "{{ .Name }} 60 IN A 192.0.2.240"
          # Everything else goes to the router, so this resolver is a fully
          # usable general-purpose DNS server, not a *.internal-only one —
          # a device can point at it exclusively rather than needing two
          # DNS servers configured.
          - name: forward
            parameters: . 192.168.1.1
          - name: cache
            parameters: "30"
          - name: loop
          - name: reload
