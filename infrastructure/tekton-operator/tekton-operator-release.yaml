apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: tekton-operator
  namespace: tekton-operator
spec:
  interval: 24h
  url: oci://ghcr.io/tektoncd/operator/charts/tekton-operator
  ref:
    tag: "${TEKTON_OPERATOR_VERSION}"
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tekton-operator
  namespace: tekton-operator
spec:
  interval: 1h
  releaseName: tekton-operator
  chartRef:
    kind: OCIRepository
    name: tekton-operator
  values:
    installCRDs: true
    webhook:
      resources:
        requests:
          cpu: ${TEKTON_OPERATOR_WEBHOOK_CPU_REQUEST}
          memory: ${TEKTON_OPERATOR_WEBHOOK_MEM_REQUEST}
        limits:
          memory: ${TEKTON_OPERATOR_WEBHOOK_MEM_LIMIT}
    operator:
      autoInstallComponents: false
      resources:
        requests:
          cpu: ${TEKTON_OPERATOR_CPU_REQUEST}
          memory: ${TEKTON_OPERATOR_MEM_REQUEST}
        limits:
          memory: ${TEKTON_OPERATOR_MEM_LIMIT}
