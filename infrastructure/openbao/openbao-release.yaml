apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 24h
  type: oci
  url: oci://ghcr.io/openbao/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 1h
  releaseName: openbao
  chart:
    spec:
      chart: openbao
      version: "${OPENBAO_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: openbao
  valuesFrom:
    - kind: ConfigMap
      name: openbao-values
      valuesKey: values.yaml
