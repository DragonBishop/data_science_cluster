apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rotate-credentials
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["barman-s3-credentials"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tekton-results-postgres", "seaweedfs-credentials"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["seaweedfs-s3"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["rotate-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rotate-credentials
  namespace: tekton
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rotate-credentials
subjects:
  - kind: ServiceAccount
    name: rotate-credentials
    namespace: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rotate-credentials
  namespace: databases
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rotate-credentials
subjects:
  - kind: ServiceAccount
    name: rotate-credentials
    namespace: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rotate-credentials
  namespace: seaweedfs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rotate-credentials
subjects:
  - kind: ServiceAccount
    name: rotate-credentials
    namespace: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: core-test-rotation-ran
  namespace: openbao
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rotate-credentials
subjects:
  - kind: ServiceAccount
    name: core-test
    namespace: tekton-pipelines
