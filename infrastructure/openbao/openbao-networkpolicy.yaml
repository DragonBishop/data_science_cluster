apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao
  namespace: openbao
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cert-manager
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: openbao
            app.kubernetes.io/name: openbao-csi-provider
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tekton-pipelines
            tekton.dev/pipeline: core-test
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: spire
            app.kubernetes.io/name: server
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
  egress:
    # plugin_auto_download pulls the secrets-aws plugin image
    - toFQDNs:
        - matchName: "ghcr.io"
        - matchName: "pkg-containers.githubusercontent.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
