apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao
  namespace: openbao
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: external-secrets
            app.kubernetes.io/name: external-secrets
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cert-manager
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tekton-pipelines
            tekton.dev/pipeline: core-test
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: spire
            app.kubernetes.io/name: server
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
