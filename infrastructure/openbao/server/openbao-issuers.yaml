# OpenBao and desktop certificate issuers

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao-selfsigned-bootstrap
spec:
  selfSigned: {}
---
# Signs service and Hubble certificates through pki_int
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao-pki-issuer
spec:
  vault:
    server: https://openbao.openbao.svc.cluster.local:8200
    path: pki_int/sign/internal-server
    caBundleSecretRef:
      name: openbao-local-ca-secret
      key: tls.crt
    auth:
      kubernetes:
        role: cert-manager-pki-role
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: cert-manager
---
# ClusterIssuer backed by the OpenBao local CA
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao-ca-issuer
spec:
  ca:
    secretName: openbao-local-ca-secret
---
# cert-manager requests only its own token
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-tokenrequest
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["cert-manager"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-tokenrequest
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-tokenrequest
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
# Dedicated local CA for OpenBao
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: openbao-local-ca
  secretName: openbao-local-ca-secret
  duration: ${LOCAL_CA_ROOT_DURATION}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  # Signs only openbao-server-cert's names
  nameConstraints:
    critical: true
    permitted:
      dnsDomains:
        - openbao
        - openbao.openbao
        - openbao.openbao.svc
        - openbao.openbao.svc.cluster.local
        - openbao-internal
        - openbao-internal.openbao
        - openbao-internal.openbao.svc.cluster.local
        - localhost
      ipRanges:
        - 127.0.0.1/32
  issuerRef:
    name: openbao-selfsigned-bootstrap
    kind: ClusterIssuer
---
# Desktop CA Issuer; logs in as desktop-issuer-gateway-role
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-desktop-issuer
  namespace: gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-desktop-issuer-tokenrequest
  namespace: gateway
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["openbao-desktop-issuer"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-desktop-issuer-tokenrequest
  namespace: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-desktop-issuer-tokenrequest
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao-desktop-issuer
  namespace: gateway
spec:
  vault:
    server: https://openbao.openbao.svc.cluster.local:8200
    path: pki_desktop/sign/desktop
    # Synced by Bundle openbao-issuer-ca
    caBundleSecretRef:
      name: openbao-issuer-ca
      key: ca.crt
    auth:
      kubernetes:
        role: desktop-issuer-gateway-role
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: openbao-desktop-issuer
---
