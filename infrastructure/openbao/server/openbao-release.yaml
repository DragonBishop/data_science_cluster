apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 24h
  type: oci
  url: oci://ghcr.io/openbao/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 1h
  driftDetection:
    mode: enabled
  releaseName: openbao
  chart:
    spec:
      chart: openbao
      version: "${OPENBAO_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: openbao
  valuesFrom:
    - kind: ConfigMap
      name: openbao-values
      valuesKey: values.yaml
  # Flux only: the monitor needs the Prometheus CRDs
  values:
    serverTelemetry:
      serviceMonitor:
        enabled: true
        tlsConfig:
          serverName: openbao-internal.openbao.svc.cluster.local
          ca:
            secret:
              name: openbao-server-cert
              key: ca.crt
  postRenderers:
    - kustomize:
        patches:
          # The openbao-internal Service doesn't list the metrics port
          - target:
              kind: ServiceMonitor
              name: openbao
            patch: |
              - op: remove
                path: /spec/endpoints/0/port
              - op: add
                path: /spec/endpoints/0/targetPort
                value: metrics
          - target:
              kind: ClusterRole
              name: openbao-csi-provider-clusterrole
            patch: |
              - op: replace
                path: /rules
                value: []
