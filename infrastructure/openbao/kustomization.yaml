apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - openbao-tls.yaml
  - openbao-release.yaml
  - openbao-networkpolicy.yaml
configurations:
  - kustomizeconfig.yaml
configMapGenerator:
  - name: openbao-values
    namespace: openbao
    files:
      - values.yaml=openbao-values.yaml
