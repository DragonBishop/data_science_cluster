apiVersion: v1
kind: ServiceAccount
metadata:
  name: rotate-credentials
  namespace: openbao
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rotate-credentials-spiffe-helper
  namespace: openbao
data:
  helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cert_dir = "/work"
    daemon_mode = false
    svid_file_name = "svid.0.pem"
    svid_key_file_name = "svid.0.key"
    svid_bundle_file_name = "bundle.0.pem"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rotate-credentials
  namespace: openbao
spec:
  schedule: "${CREDENTIAL_ROTATION_SCHEDULE}"
  startingDeadlineSeconds: 86400
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rotate-credentials
        spec:
          serviceAccountName: rotate-credentials
          restartPolicy: Never
          securityContext:
            runAsUser: 65532
          volumes:
            - name: spiffe-workload-api
              csi:
                driver: csi.spiffe.io
                readOnly: true
            - name: work
              emptyDir:
                medium: Memory
            - name: openbao-ca-bundle
              configMap:
                name: openbao-ca-bundle
            - name: spiffe-helper-config
              configMap:
                name: rotate-credentials-spiffe-helper
          initContainers:
            - name: fetch-svid
              image: ghcr.io/spiffe/spiffe-helper:${SPIFFE_HELPER_VERSION}
              args:
                - -config
                - /etc/spiffe-helper/helper.conf
              resources:
                requests:
                  cpu: ${ROTATE_CREDENTIALS_CPU_REQUEST}
                  memory: ${ROTATE_CREDENTIALS_MEM_REQUEST}
                limits:
                  memory: ${ROTATE_CREDENTIALS_MEM_LIMIT}
              volumeMounts:
                - name: spiffe-workload-api
                  mountPath: /spiffe-workload-api
                  readOnly: true
                - name: spiffe-helper-config
                  mountPath: /etc/spiffe-helper
                  readOnly: true
                - name: work
                  mountPath: /work
            - name: read-logins
              image: openbao/openbao:${OPENBAO_IMAGE_TAG}
              env:
                - name: BAO_ADDR
                  value: https://openbao.openbao.svc.cluster.local:8200
                - name: BAO_CACERT
                  value: /openbao-ca/ca.crt
              command:
                - /bin/sh
                - -c
              args:
                - |
                  set -eu
                  BAO_TOKEN=$(bao login -token-only -method=cert -client-cert=/work/svid.0.pem -client-key=/work/svid.0.key name=rotate-credentials)
                  export BAO_TOKEN
                  bao read -format=json database/creds/tekton-results-app-role > /work/tekton-results.json
              resources:
                requests:
                  cpu: ${ROTATE_CREDENTIALS_CPU_REQUEST}
                  memory: ${ROTATE_CREDENTIALS_MEM_REQUEST}
                limits:
                  memory: ${ROTATE_CREDENTIALS_MEM_LIMIT}
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: openbao-ca-bundle
                  mountPath: /openbao-ca
                  readOnly: true
          containers:
            - name: rotate
              image: alpine/k8s:${ALPINE_K8S_VERSION}
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -euo pipefail

                  # Random hex of $1 bytes
                  random_hex() {
                    head -c "$1" /dev/urandom | od -An -tx1 | tr -d ' \n'
                  }

                  # Write the barman identity with credentials $1 and restart the gateway
                  write_seaweedfs_identity() {
                    local identity_config
                    identity_config=$(jq -cn --argjson credentials "$1" \
                      '{identities: [{name: "barman", credentials: $credentials, actions: ["Read", "Write", "List", "Tagging"]}]}')
                    kubectl patch secret seaweedfs-credentials -n seaweedfs --type merge \
                      -p "$(jq -cn --arg config "$identity_config" '{stringData: {config: $config}}')"
                    kubectl rollout restart deployment/seaweedfs-s3 -n seaweedfs
                    kubectl rollout status deployment/seaweedfs-s3 -n seaweedfs --timeout=2m
                  }

                  kubectl patch secret tekton-results-postgres -n tekton --type merge \
                    -p "$(jq -c '{stringData: {username: .data.username, password: .data.password}}' /work/tekton-results.json)"

                  new_access_key=$(random_hex 10)
                  new_secret_key=$(random_hex 20)
                  old_access_key=$(kubectl get secret barman-s3-credentials -n databases -o jsonpath='{.data.ACCESS_KEY_ID}' | base64 -d)
                  old_secret_key=$(kubectl get secret barman-s3-credentials -n databases -o jsonpath='{.data.ACCESS_SECRET_KEY}' | base64 -d)
                  old_credential=$(jq -cn --arg access "$old_access_key" --arg secret "$old_secret_key" '{accessKey: $access, secretKey: $secret}')
                  new_credential=$(jq -cn --arg access "$new_access_key" --arg secret "$new_secret_key" '{accessKey: $access, secretKey: $secret}')

                  write_seaweedfs_identity "[$old_credential, $new_credential]"
                  kubectl patch secret barman-s3-credentials -n databases --type merge \
                    -p "$(jq -cn --arg access "$new_access_key" --arg secret "$new_secret_key" '{stringData: {ACCESS_KEY_ID: $access, ACCESS_SECRET_KEY: $secret}}')"
                  write_seaweedfs_identity "[$new_credential]"
              resources:
                requests:
                  cpu: ${ROTATE_CREDENTIALS_CPU_REQUEST}
                  memory: ${ROTATE_CREDENTIALS_MEM_REQUEST}
                limits:
                  memory: ${ROTATE_CREDENTIALS_MEM_LIMIT}
              volumeMounts:
                - name: work
                  mountPath: /work
