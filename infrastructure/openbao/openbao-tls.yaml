# OpenBao's server certificate and the OpenBao CA bundles

# Server certificate for OpenBao
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-server-cert
  namespace: openbao
spec:
  secretName: openbao-server-cert
  duration: ${LOCAL_CA_CERT_DURATION}
  renewBefore: ${LOCAL_CA_CERT_RENEW_BEFORE}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  dnsNames:
    - openbao
    - openbao.openbao
    - openbao.openbao.svc
    - openbao.openbao.svc.cluster.local
    - openbao-internal
    - openbao-internal.openbao
    - openbao-internal.openbao.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: openbao-ca-issuer
    kind: ClusterIssuer
---
# OpenBao CA bundle for the databases namespace
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-ca-databases
  namespace: databases
spec:
  commonName: openbao-ca-bundle
  secretName: openbao-ca-bundle
  duration: ${LOCAL_CA_CERT_DURATION}
  renewBefore: ${LOCAL_CA_CERT_RENEW_BEFORE}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  dnsNames:
    - openbao-ca-bundle.unused.invalid
  issuerRef:
    name: openbao-ca-issuer
    kind: ClusterIssuer
---
# OpenBao CA bundle for the tekton namespace
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-ca-tekton
  namespace: tekton
spec:
  commonName: openbao-ca-bundle
  secretName: openbao-ca-bundle
  duration: ${LOCAL_CA_CERT_DURATION}
  renewBefore: ${LOCAL_CA_CERT_RENEW_BEFORE}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  dnsNames:
    - openbao-ca-bundle.unused.invalid
  issuerRef:
    name: openbao-ca-issuer
    kind: ClusterIssuer
---
# OpenBao CA bundle for the tekton-pipelines namespace
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-ca-tekton-pipelines
  namespace: tekton-pipelines
spec:
  commonName: openbao-ca-bundle
  secretName: openbao-ca-bundle
  duration: ${LOCAL_CA_CERT_DURATION}
  renewBefore: ${LOCAL_CA_CERT_RENEW_BEFORE}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  dnsNames:
    - openbao-ca-bundle.unused.invalid
  issuerRef:
    name: openbao-ca-issuer
    kind: ClusterIssuer
