# OpenBao's server certificate, and the OpenBao CA and PKI root Bundles

# Server certificate for OpenBao
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-server-cert
  namespace: openbao
spec:
  secretName: openbao-server-cert
  duration: ${LOCAL_CA_CERT_DURATION}
  renewBefore: ${LOCAL_CA_CERT_RENEW_BEFORE}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  dnsNames:
    - openbao
    - openbao.openbao
    - openbao.openbao.svc
    - openbao.openbao.svc.cluster.local
    - openbao-internal
    - openbao-internal.openbao
    - openbao-internal.openbao.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: openbao-ca-issuer
    kind: ClusterIssuer
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: openbao-ca-bundle           # trust-manager names each target ConfigMap after the Bundle
spec:
  sources:
    - secret:
        name: openbao-local-ca-secret
        key: tls.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        data-cluster/ca-bundles: "true"
---
# Leaf from openbao-pki-issuer; its ca.crt carries the PKI root for Bundle openbao-root-ca
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-root-ca-source
  namespace: cert-manager
spec:
  secretName: openbao-root-ca-source
  commonName: openbao-root-ca-source.cert-manager.svc.cluster.local
  dnsNames:
    - openbao-root-ca-source.cert-manager.svc.cluster.local
  duration: ${OPENBAO_PKI_CERT_DURATION}
  renewBefore: ${OPENBAO_PKI_CERT_RENEW_BEFORE}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  issuerRef:
    name: openbao-pki-issuer
    kind: ClusterIssuer
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: openbao-root-ca             # trust-manager names each target ConfigMap after the Bundle
spec:
  sources:
    - secret:
        name: openbao-root-ca-source
        key: ca.crt
  target:
    configMap:
      key: ca.crt
    # CNPG's ObjectStore endpointCA reads a Secret
    secret:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        data-cluster/ca-bundles: "true"
