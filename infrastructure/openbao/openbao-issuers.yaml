# cert-manager ClusterIssuers for OpenBao, and OpenBao's local CA

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao-selfsigned-bootstrap
spec:
  selfSigned: {}
---
# ClusterIssuer backed by OpenBao's Intermediate PKI secrets engine.
# Signs leaf certificates for PostgreSQL (databases-tls) and SeaweedFS S3.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao-pki-issuer
spec:
  vault:
    server: https://openbao.openbao.svc.cluster.local:8200
    path: pki_int/sign/internal-server
    caBundleSecretRef:
      name: openbao-local-ca-secret
      key: tls.crt
    auth:
      kubernetes:
        role: cert-manager-pki-role
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: cert-manager
---
# ClusterIssuer backed by the OpenBao local CA
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao-ca-issuer
spec:
  ca:
    secretName: openbao-local-ca-secret
---
# RBAC allowing cert-manager to request tokens for OpenBao Kubernetes authentication.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-tokenrequest
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-tokenrequest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-tokenrequest
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
# Dedicated local CA for OpenBao
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: openbao-local-ca
  secretName: openbao-local-ca-secret
  duration: ${LOCAL_CA_ROOT_DURATION}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  issuerRef:
    name: openbao-selfsigned-bootstrap
    kind: ClusterIssuer
