# coredns-lan-service.yaml
#
# LAN-facing Service for k3s's own CoreDNS, selecting the same pods as the
# operator-managed ClusterIP kube-dns Service (that one stays, in-cluster
# only). Confirmed selector against the live k3s coredns manifest.
apiVersion: v1
kind: Service
metadata:
  name: coredns-external
  namespace: kube-system
  annotations:
    lbipam.cilium.io/ips: "${COREDNS_LAN_IP}"
spec:
  type: LoadBalancer
  selector:
    k8s-app: kube-dns
  ports:
    - name: dns
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
