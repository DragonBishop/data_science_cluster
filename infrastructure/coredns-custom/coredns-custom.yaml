# CoreDNS custom configuration for the internal zone
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  internal.server: |
    internal:53 {
      template IN A internal {
        match "^.*\.internal\.?$"
        answer "{{ .Name }} 60 IN A ${GATEWAY_IP}"
      }
    }
