apiVersion: v1
kind: ServiceAccount
metadata:
  name: core-test
  namespace: tekton-pipelines
---
# ca-bundles reads the CA ConfigMaps in every labelled namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: core-test-ca-bundles
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: core-test-ca-bundles
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: core-test-ca-bundles
subjects:
  - kind: ServiceAccount
    name: core-test
    namespace: tekton-pipelines
