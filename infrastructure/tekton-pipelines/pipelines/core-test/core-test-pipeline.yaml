apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: core-test
  namespace: tekton-pipelines
spec:
  params:
    - name: revision
      description: The Flux revision to test, <branch>@sha1:<sha>; empty tests the GitRepository's stored artifact
      type: string
      default: ""
  workspaces:
    - name: source
  tasks:
    - name: fetch-source
      taskRef:
        name: fetch-source
      params:
        - name: repository
          value: flux-system
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
    - name: flux-ready
      taskRef:
        name: flux-ready
      params:
        - name: selector
          value: data-cluster/core=true
        - name: revision
          value: $(tasks.fetch-source.results.revision)
    - name: ca-bundles
      runAfter: [flux-ready]
      taskRef:
        name: ca-bundles
    - name: spire
      runAfter: [flux-ready]
      taskRef:
        name: spire
    - name: flux-mtls
      runAfter: [flux-ready]
      taskRef:
        name: flux-mtls
    - name: openbao-login
      runAfter: [flux-ready]
      taskRef:
        name: openbao-login
    - name: postgres-login
      runAfter: [flux-ready]
      taskRef:
        name: postgres-login
    - name: postgres-database-applied
      runAfter: [flux-ready]
      taskRef:
        name: postgres-database-applied
      params:
        - name: database
          value: data-science
        - name: namespace
          value: databases
    - name: workloads-ready
      runAfter: [flux-ready]
      taskRef:
        name: workloads-ready
      matrix:
        params:
          - name: kind
            value: [deployments, statefulsets, daemonsets]
    - name: hubble-drops
      runAfter: [ca-bundles, spire, flux-mtls, openbao-login, postgres-login, postgres-database-applied, workloads-ready]
      taskRef:
        name: hubble-drops
      params:
        - name: namespaces
          value: >-
            kube-system flux-system openbao cnpg-system databases cert-manager gateway seaweedfs spire
            tekton-operator tekton tekton-triggers tekton-pipelines
        - name: since
          value: $(tasks.fetch-source.results.started-at)
