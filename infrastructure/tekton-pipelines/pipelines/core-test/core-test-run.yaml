# Hand run: kubectl create -f infrastructure/tekton-pipelines/pipelines/core-test/core-test-run.yaml
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: core-test-
  namespace: tekton-pipelines
spec:
  pipelineRef:
    name: core-test
  taskRunTemplate:
    serviceAccountName: core-test
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
