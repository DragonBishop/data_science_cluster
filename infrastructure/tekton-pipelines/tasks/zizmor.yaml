apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: zizmor
  namespace: tekton-pipelines
spec:
  workspaces:
    - name: source
  steps:
    - name: audit-workflows
      image: ghcr.io/zizmorcore/zizmor:${ZIZMOR_VERSION}
      securityContext:
        runAsUser: 65532
      env:
        - name: HOME
          value: /tmp
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        zizmor --offline .github/workflows
