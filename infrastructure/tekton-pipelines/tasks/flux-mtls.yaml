apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flux-mtls
  namespace: tekton-pipelines
spec:
  stepTemplate:
    image: alpine/k8s:${ALPINE_K8S_VERSION}
    securityContext:
      runAsUser: 65532
  steps:
    - name: artifact-server-requires-svid
      script: |
        #!/usr/bin/env bash
        output=$(curl --insecure --silent --show-error --max-time 10 --tlsv1.3 https://source-controller.flux-system.svc.cluster.local./ 2>&1)
        echo "$output"
        [[ $output == *"alert certificate required"* ]]
    - name: event-server-requires-svid
      script: |
        #!/usr/bin/env bash
        output=$(curl --insecure --silent --show-error --max-time 10 --tlsv1.3 https://notification-controller.flux-system.svc.cluster.local./ 2>&1)
        echo "$output"
        [[ $output == *"alert certificate required"* ]]
