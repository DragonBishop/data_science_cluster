apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: spire
  namespace: tekton-pipelines
spec:
  volumes:
    - name: spiffe-workload-api
      csi:
        driver: csi.spiffe.io
        readOnly: true
  stepTemplate:
    securityContext:
      runAsUser: 65532
  steps:
    - name: wait-for-entry-sync
      image: alpine/k8s:${ALPINE_K8S_VERSION}
      script: |
        #!/usr/bin/env bash
        sleep 30
    - name: fetch-identity
      image: ghcr.io/spiffe/spire-agent:${SPIRE_AGENT_IMAGE_TAG}
      onError: continue
      volumeMounts:
        - name: spiffe-workload-api
          mountPath: /spiffe-workload-api
          readOnly: true
      command:
        - /opt/spire/bin/spire-agent
      args:
        - api
        - fetch
        - x509
        - -socketPath
        - /spiffe-workload-api/spire-agent.sock
        - -timeout
        - 30s
    - name: no-identity
      image: alpine/k8s:${ALPINE_K8S_VERSION}
      script: |
        #!/usr/bin/env bash
        set -eu
        exit_code=$(cat $(steps.step-fetch-identity.exitCode.path))
        echo "fetch-identity exit code: $exit_code"
        [[ $exit_code != 0 ]]
