apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: unauthorized-pod-denied
  namespace: tekton-pipelines
spec:
  params:
    - name: target
      description: A host:port that must refuse a tekton-pipelines pod its network policy does not allow
      type: string
  stepTemplate:
    image: alpine/k8s:${ALPINE_K8S_VERSION}
    securityContext:
      runAsUser: 65532
    env:
      - name: HOME
        value: /tmp
      - name: TARGET
        value: $(params.target)
      - name: PROBE
        value: $(context.taskRun.name)-probe
  steps:
    - name: probe
      script: |
        #!/usr/bin/env bash
        set -eu
        kubectl run "$PROBE" --namespace tekton-pipelines --restart=Never \
          --image=alpine/k8s:${ALPINE_K8S_VERSION} --labels=core-test/probe=unauthorized-pod-denied \
          --command -- curl --silent --show-error --max-time 5 "telnet://$TARGET"
        kubectl wait "pod/$PROBE" --namespace tekton-pipelines \
          --for=jsonpath='{.status.containerStatuses[0].state.terminated}' --timeout=2m
    - name: connection-timed-out
      script: |
        #!/usr/bin/env bash
        set -eu
        curl_exit_code=$(kubectl get "pod/$PROBE" --namespace tekton-pipelines \
          --output=jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}')
        echo "curl exited with $curl_exit_code; a dropped connection times out with 28"
        [[ $curl_exit_code == 28 ]]
