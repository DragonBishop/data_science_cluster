apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hubble-client-cert
  namespace: tekton-pipelines
spec:
  secretName: hubble-client-cert
  dnsNames:
    - tekton-pipelines.hubble-relay.cilium.io
  usages:
    - client auth
  duration: ${OPENBAO_PKI_CERT_DURATION}
  renewBefore: ${OPENBAO_PKI_CERT_RENEW_BEFORE}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  issuerRef:
    name: openbao-pki-issuer
    kind: ClusterIssuer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffe-helper
  namespace: tekton-pipelines
data:
  helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cert_dir = "/svid"
    svid_file_name = "svid.pem"
    svid_key_file_name = "svid.key"
    svid_bundle_file_name = "bundle.pem"
