apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
spec:
  targetNamespace: tekton-pipelines
  profile: basic
  pruner:
    disabled: false
    schedule: "${TEKTON_PRUNER_SCHEDULE}"
    keep: ${TEKTON_PRUNER_KEEP}
    resources:
      - taskrun
      - pipelinerun
  chain:
    disabled: true
  result:
    disabled: false
    is_external_db: true
    db_host: postgis-cluster-rw.databases.svc.cluster.local
    db_port: 5432
    db_name: ${TEKTON_RESULTS_DB_NAME}
    db_sslmode: verify-full
    # tekton-results-tls is mounted at /etc/tls and its ca.crt is the root that signs Postgres
    db_sslrootcert: /etc/tls/ca.crt
    db_enable_auto_migration: true
    db_secret_name: tekton-results-postgres
    db_secret_user_key: username
    db_secret_password_key: password
    logs_api: false
    options:
      configMaps:
        # Enforced on an interval while the cluster runs, not at a clock time the machine may be off for
        tekton-results-config-results-retention-policy:
          data:
            runAt: "@every ${TEKTON_RESULTS_RETENTION_INTERVAL}"
            defaultRetention: "${TEKTON_RESULTS_RETENTION}"
      deployments:
        tekton-results-api:
          spec:
            template:
              spec:
                initContainers:
                  # ESO re-creates the deleted Secret with a new OpenBao login; the kubelet retries the main container until it exists
                  - name: delete-db-credentials
                    image: registry.k8s.io/kubectl:${KUBECTL_VERSION}
                    args: ["delete", "secret", "tekton-results-postgres", "--ignore-not-found"]
                    resources:
                      requests:
                        cpu: ${TEKTON_RESULTS_INIT_CPU_REQUEST}
                        memory: ${TEKTON_RESULTS_INIT_MEM_REQUEST}
                      limits:
                        memory: ${TEKTON_RESULTS_INIT_MEM_LIMIT}
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 65532
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                      seccompProfile:
                        type: RuntimeDefault
        tekton-results-retention-policy-agent:
          spec:
            template:
              spec:
                initContainers:
                  - name: delete-db-credentials
                    image: registry.k8s.io/kubectl:${KUBECTL_VERSION}
                    args: ["delete", "secret", "tekton-results-postgres", "--ignore-not-found"]
                    resources:
                      requests:
                        cpu: ${TEKTON_RESULTS_INIT_CPU_REQUEST}
                        memory: ${TEKTON_RESULTS_INIT_MEM_REQUEST}
                      limits:
                        memory: ${TEKTON_RESULTS_INIT_MEM_LIMIT}
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 65532
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                      seccompProfile:
                        type: RuntimeDefault
