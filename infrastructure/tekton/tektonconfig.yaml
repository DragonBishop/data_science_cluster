apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
spec:
  targetNamespace: tekton-pipelines
  profile: basic
  pruner:
    disabled: false
    schedule: "${TEKTON_PRUNER_SCHEDULE}"
    keep: ${TEKTON_PRUNER_KEEP}
    resources:
      - taskrun
      - pipelinerun
  chain:
    disabled: true
  result:
    disabled: true
