apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
spec:
  targetNamespace: tekton-pipelines
  profile: basic
  pruner:
    disabled: false
    schedule: "${TEKTON_PRUNER_SCHEDULE}"
    keep: ${TEKTON_PRUNER_KEEP}
    resources:
      - taskrun
      - pipelinerun
  chain:
    artifacts.taskrun.storage: tekton
    artifacts.pipelinerun.storage: tekton
    artifacts.oci.storage: tekton
    artifacts.taskrun.signer: kms
    artifacts.pipelinerun.signer: kms
    artifacts.oci.signer: kms
    signers.kms.kmsref: hashivault://tekton-chains
    signers.kms.auth.address: https://openbao.openbao.svc.cluster.local:8200
    signers.kms.auth.oidc.path: kubernetes
    signers.kms.auth.oidc.role: tekton-chains-role
    options:
      configMaps:
        chains-config:
          data:
            signers.kms.auth.oidc.token-path: /var/run/secrets/openbao/token
      deployments:
        tekton-chains-controller:
          spec:
            template:
              spec:
                volumes:
                  - name: openbao-ca
                    secret:
                      secretName: openbao-ca-bundle
                      items:
                        - key: ca.crt
                          path: ca.crt
                  - name: openbao-token
                    projected:
                      sources:
                        - serviceAccountToken:
                            audience: openbao
                            expirationSeconds: 3600
                            path: token
                containers:
                  - name: tekton-chains-controller
                    env:
                      - name: VAULT_CACERT
                        value: /etc/openbao-ca/ca.crt
                    volumeMounts:
                      - name: openbao-ca
                        mountPath: /etc/openbao-ca
                        readOnly: true
                      - name: openbao-token
                        mountPath: /var/run/secrets/openbao
                        readOnly: true
  result:
    disabled: true
