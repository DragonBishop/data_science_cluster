apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: remote-resolvers
  namespace: tekton-pipelines
spec:
  # Remote resolvers pod, which fetches taskRef and pipelineRef sources
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: resolvers
      app.kubernetes.io/part-of: tekton-pipelines
  egress:
    - toFQDNs:
        # Git resolver: clone and API
        - matchName: "${GIT_FORGE_HOST}"
        - matchPattern: "*.${GIT_FORGE_HOST}"
        # Hub resolver: Artifact Hub catalog
        - matchName: "artifacthub.io"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: results-api
  namespace: tekton-pipelines
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tekton-results-api
  ingress:
    # Watcher sends PipelineRun and TaskRun records
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: tekton-results-watcher
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: taskrun
  namespace: tekton-runs
spec:
  # TaskRun pods
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: tekton-pipelines
  egress:
    - toFQDNs:
        # Git forge: clone, API, codeload
        - matchName: "${GIT_FORGE_HOST}"
        - matchPattern: "*.${GIT_FORGE_HOST}"
        # GitHub: raw files and release downloads
        - matchPattern: "*.githubusercontent.com"
        # PyPI: index and package files
        - matchName: "pypi.org"
        - matchName: "files.pythonhosted.org"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
