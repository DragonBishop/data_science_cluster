apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: remote-resolvers
  namespace: tekton
spec:
  # Remote resolvers pod, which fetches taskRef and pipelineRef sources
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: resolvers
      app.kubernetes.io/part-of: tekton-pipelines
  egress:
    - toFQDNs:
        # Git resolver: clone and API
        - matchName: "github.com"
        - matchPattern: "*.github.com"
        # Hub resolver: Artifact Hub catalog
        - matchName: "artifacthub.io"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: core-interceptors
  namespace: tekton
spec:
  # Triggers core interceptors pod, which serves ClusterInterceptor cel
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: core-interceptors
      app.kubernetes.io/part-of: tekton-triggers
  ingress:
    # EventListener flux-events runs its Triggers' CEL filters here
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tekton-triggers
            eventlistener: flux-events
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
