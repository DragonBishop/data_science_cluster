apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: renovate-config
  namespace: tekton-pipelines
spec:
  workspaces:
    - name: source
  steps:
    - name: validate
      image: renovate/renovate:${RENOVATE_VERSION}
      securityContext:
        runAsUser: 65532
      env:
        - name: HOME
          value: /tmp
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        renovate-config-validator --strict renovate.json
