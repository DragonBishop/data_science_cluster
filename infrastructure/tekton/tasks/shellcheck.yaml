apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: shellcheck
  namespace: tekton-pipelines
spec:
  workspaces:
    - name: source
  steps:
    - name: shellcheck
      image: koalaman/shellcheck-alpine:${SHELLCHECK_VERSION}
      securityContext:
        runAsUser: 65532
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        shellcheck -x src/bash/*.sh
