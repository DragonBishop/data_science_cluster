apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: prek
  namespace: tekton-pipelines
spec:
  workspaces:
    - name: source
  steps:
    - name: hooks
      image: ghcr.io/astral-sh/uv:${UV_IMAGE_TAG}
      securityContext:
        runAsUser: 65532
      env:
        - name: HOME
          value: /tmp
        # GitHub's lint.yml runs ansible-lint, which needs collections from Ansible Galaxy
        - name: SKIP
          value: ansible-lint
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        uvx prek@${PREK_VERSION} run --all-files --show-diff-on-failure
