apiVersion: v1
kind: ServiceAccount
metadata:
  name: el-flux-events
  namespace: tekton-triggers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: el-flux-events-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: el-flux-events
    namespace: tekton-triggers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: el-flux-events-role
  namespace: tekton-pipelines
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: el-flux-events-role
  namespace: tekton-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: el-flux-events-role
subjects:
  - kind: ServiceAccount
    name: el-flux-events
    namespace: tekton-triggers
