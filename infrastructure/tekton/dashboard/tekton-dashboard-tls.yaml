# Dashboard localhost certificate from the desktop CA
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tekton-dashboard-localhost-tls
  namespace: tekton-pipelines
spec:
  secretName: tekton-dashboard-localhost-tls
  dnsNames:
    - localhost
  duration: ${OPENBAO_PKI_CERT_DURATION}
  renewBefore: ${OPENBAO_PKI_CERT_RENEW_BEFORE}
  privateKey:
    algorithm: ${CERT_KEY_ALGORITHM}
    size: ${CERT_KEY_SIZE}
  issuerRef:
    name: openbao-desktop-issuer
    kind: Issuer
