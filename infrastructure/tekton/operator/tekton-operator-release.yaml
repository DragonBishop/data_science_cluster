apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: tekton-operator
  namespace: tekton-operator
spec:
  interval: 24h
  url: oci://ghcr.io/tektoncd/operator/charts/tekton-operator
  ref:
    tag: "${TEKTON_OPERATOR_VERSION}"
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tekton-operator
  namespace: tekton-operator
spec:
  driftDetection:
    mode: enabled
  interval: 1h
  releaseName: tekton-operator
  chartRef:
    kind: OCIRepository
    name: tekton-operator
  values:
    installCRDs: true
    webhook:
      # Without it, knative looks for config-observability, which this namespace lacks
      additionalEnvs:
        - name: CONFIG_OBSERVABILITY_NAME
          value: tekton-operator-observability
        - name: OTEL_EXPORTER_OTLP_CERTIFICATE
          value: /etc/openbao-root-ca/ca.crt
      resources:
        requests:
          cpu: ${TEKTON_OPERATOR_WEBHOOK_CPU_REQUEST}
          memory: ${TEKTON_OPERATOR_WEBHOOK_MEM_REQUEST}
        limits:
          memory: ${TEKTON_OPERATOR_WEBHOOK_MEM_LIMIT}
    operator:
      autoInstallComponents: false
      additionalEnvs:
        - name: OTEL_EXPORTER_OTLP_CERTIFICATE
          value: /etc/openbao-root-ca/ca.crt
      resources:
        requests:
          cpu: ${TEKTON_OPERATOR_CPU_REQUEST}
          memory: ${TEKTON_OPERATOR_MEM_REQUEST}
        limits:
          memory: ${TEKTON_OPERATOR_MEM_LIMIT}
  # Patch OTLP settings and CA mounts into the rendered chart.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ConfigMap
              name: tekton-operator-observability
            patch: |
              - op: add
                path: /data/metrics-protocol
                value: http/protobuf
              - op: add
                path: /data/metrics-endpoint
                value: https://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/otlp/v1/metrics
          - target:
              kind: Deployment
              name: tekton-operator
            patch: |
              - op: add
                path: /spec/template/spec/volumes
                value:
                  - name: openbao-root-ca
                    configMap:
                      name: openbao-root-ca
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts
                value:
                  - name: openbao-root-ca
                    mountPath: /etc/openbao-root-ca
                    readOnly: true
              - op: add
                path: /spec/template/spec/containers/1/volumeMounts
                value:
                  - name: openbao-root-ca
                    mountPath: /etc/openbao-root-ca
                    readOnly: true
          - target:
              kind: Deployment
              name: tekton-operator-webhook
            patch: |
              - op: add
                path: /spec/template/spec/volumes
                value:
                  - name: openbao-root-ca
                    configMap:
                      name: openbao-root-ca
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts
                value:
                  - name: openbao-root-ca
                    mountPath: /etc/openbao-root-ca
                    readOnly: true
