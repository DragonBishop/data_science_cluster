apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-quality
  namespace: tekton-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: code-quality-view
rules:
  # fetch-source reads the GitRepository's URL and stored revision
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get"]
  # manifests turns every CRD's schema into a kubeconform schema
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: code-quality-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: code-quality-view
subjects:
  - kind: ServiceAccount
    name: code-quality
    namespace: tekton-pipelines
