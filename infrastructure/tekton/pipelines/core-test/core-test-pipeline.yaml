apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: core-test
  namespace: tekton-pipelines
spec:
  params:
    - name: revision
      description: The Flux revision to test, <branch>@sha1:<sha>; empty tests the GitRepository's stored artifact
      type: string
      default: ""
  tasks:
    - name: flux-ready
      taskRef:
        name: flux-ready
      params:
        - name: revision
          value: $(params.revision)
    - name: ca-bundles
      runAfter: [flux-ready]
      taskRef:
        name: ca-bundles
    - name: mtls-required
      runAfter: [flux-ready]
      taskRef:
        name: mtls-required
      matrix:
        params:
          - name: url
            value:
              - https://source-controller.flux-system.svc.cluster.local./
              - https://notification-controller.flux-system.svc.cluster.local./
              - https://seaweedfs-master.seaweedfs.svc.cluster.local:19333/
              - https://seaweedfs-filer.seaweedfs.svc.cluster.local:18888/
              - https://seaweedfs-volume.seaweedfs.svc.cluster.local:18080/
    - name: client-login
      runAfter: [flux-ready]
      taskRef:
        name: client-login
    - name: prometheus-targets
      runAfter: [flux-ready]
      taskRef:
        name: prometheus-targets
    - name: prometheus-job-check
      runAfter: [flux-ready]
      taskRef:
        name: prometheus-job-check
      matrix:
        params:
          # Every job a monitor or OTLP push should produce
          - name: job
            value:
              - tekton-pipelines-controller
    - name: gateway-tls
      runAfter: [flux-ready]
      taskRef:
        name: gateway-tls
      matrix:
        params:
          - name: hostname
            value:
              - grafana.${INTERNAL_DOMAIN}
    - name: postgres-database-applied
      runAfter: [flux-ready]
      taskRef:
        name: postgres-database-applied
      params:
        - name: database
          value: data-science
        - name: namespace
          value: databases
    - name: workloads-ready
      runAfter: [flux-ready]
      taskRef:
        name: workloads-ready
      matrix:
        params:
          - name: kind
            value: [deployments, statefulsets, daemonsets]
    - name: unauthorized-pod-denied
      runAfter: [flux-ready]
      taskRef:
        name: unauthorized-pod-denied
      matrix:
        params:
          - name: target
            value:
              - openbao.openbao.svc.cluster.local:8200
              - postgres-cluster-rw.databases.svc.cluster.local:5432
              - seaweedfs-s3.seaweedfs.svc.cluster.local:9000
              - el-flux-events.tekton-triggers.svc.cluster.local:8443
              - tekton-pipelines-webhook.tekton.svc.cluster.local:443
              - tekton-triggers-webhook.tekton.svc.cluster.local:443
              - tekton-triggers-core-interceptors.tekton.svc.cluster.local:8443
              - kube-prometheus-stack-grafana.observability.svc.cluster.local:3000
              - kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
              - kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
  finally:
    - name: delete-probes
      taskRef:
        name: delete-probes
