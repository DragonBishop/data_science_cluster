apiVersion: v1
kind: ServiceAccount
metadata:
  name: core-test
  namespace: tekton-pipelines
---
# core-test reads cluster state through the built-in view ClusterRole, which excludes Secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: core-test-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: core-test
    namespace: tekton-pipelines
---
# core-test creates and deletes its probe pods, and issues its own token for client-login's wrong-account-refused
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: core-test-role
  namespace: tekton-pipelines
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["core-test"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: core-test-role
  namespace: tekton-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: core-test-role
subjects:
  - kind: ServiceAccount
    name: core-test
    namespace: tekton-pipelines
---
# client-login issues a token for the data-science client's ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: core-test-role
  namespace: databases
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["databases-openbao-auth"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: core-test-role
  namespace: databases
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: core-test-role
subjects:
  - kind: ServiceAccount
    name: core-test
    namespace: tekton-pipelines
