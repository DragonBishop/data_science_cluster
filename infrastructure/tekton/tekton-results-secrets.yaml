# Tekton Results' dynamic database login from OpenBao

# ServiceAccount ESO presents to OpenBao's Kubernetes auth for Tekton Results
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-results-openbao-auth
  namespace: tekton
---
# Generates fresh dynamic database credentials from OpenBao on every refresh
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: tekton-results-dynamic
  namespace: tekton
spec:
  method: GET
  path: database/creds/tekton-results-app-role
  provider:
    server: https://openbao.openbao.svc.cluster.local:8200
    caProvider:
      type: ConfigMap
      name: openbao-ca-bundle
      key: ca.crt
    auth:
      kubernetes:
        mountPath: kubernetes
        role: tekton-results-role
        serviceAccountRef:
          name: tekton-results-openbao-auth
          audiences:
            - openbao
---
# A new login every day; Results pods read it at their next start
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tekton-results-postgres
  namespace: tekton
spec:
  refreshPolicy: Periodic
  refreshInterval: ${DB_LOGIN_REFRESH_INTERVAL}
  target:
    name: tekton-results-postgres
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: tekton-results-dynamic
