apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tekton-results-postgres
  namespace: tekton
spec:
  provider: openbao
  parameters:
    baoAddress: https://openbao.openbao.svc:8200
    baoCACertPath: /openbao-ca/ca.crt
    roleName: tekton-results-role
    audience: openbao
    objects: |
      - objectName: username
        secretPath: database/creds/tekton-results-app-role
        secretKey: username
      - objectName: password
        secretPath: database/creds/tekton-results-app-role
        secretKey: password
  secretObjects:
    - secretName: tekton-results-postgres
      type: Opaque
      data:
        - objectName: username
          key: username
        - objectName: password
          key: password
