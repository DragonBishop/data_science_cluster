# Each namespace with its same-namespace rule; see "Network policy" in README.md
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: openbao
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
---
