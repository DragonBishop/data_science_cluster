apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  values:
    resources:
      requests:
        cpu: 10m
        memory: 210Mi
      limits:
        memory: 630Mi
  interval: 1h
  releaseName: plugin-barman-cloud
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.7.1"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: cnpg-system