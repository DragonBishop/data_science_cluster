apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: secrets-store-csi-driver
  namespace: kube-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: secrets-store-csi-driver
  namespace: kube-system
spec:
  driftDetection:
    mode: enabled
  interval: 1h
  releaseName: secrets-store-csi-driver
  chart:
    spec:
      chart: secrets-store-csi-driver
      version: "${SECRETS_STORE_CSI_DRIVER_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: secrets-store-csi-driver
  # Ghostunnel serves metrics to Prometheus; appended last
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: secrets-store-csi-driver
            patch: |
              # Last flag wins; the chart value also sets containerPort
              - op: add
                path: /spec/template/spec/containers/1/args/-
                value: --metrics-addr=127.0.0.1:8095
              - op: add
                path: /spec/template/metadata/labels/data-cluster~1metrics-tls
                value: "true"
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: spiffe-workload-api
                  csi:
                    driver: csi.spiffe.io
                    readOnly: true
              - op: add
                path: /spec/template/spec/containers/-
                value:
                  name: metrics-tls
                  image: ghostunnel/ghostunnel:${GHOSTUNNEL_VERSION}
                  args:
                    - server
                    - --listen=0.0.0.0:${METRICS_TLS_PORT}
                    - --target=127.0.0.1:8095
                    - --use-workload-api-addr=unix:///spiffe-workload-api/spire-agent.sock
                    - --allow-uri=spiffe://cluster.internal/ns/observability/sa/prometheus
                  ports:
                    - name: metrics-tls
                      containerPort: ${METRICS_TLS_PORT}
                      protocol: TCP
                  securityContext:
                    runAsUser: 65532
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: [ALL]
                    seccompProfile:
                      type: RuntimeDefault
                  resources:
                    requests:
                      cpu: ${METRICS_TLS_CPU_REQUEST}
                      memory: ${METRICS_TLS_MEM_REQUEST}
                    limits:
                      memory: ${METRICS_TLS_MEM_LIMIT}
                  volumeMounts:
                    - name: spiffe-workload-api
                      mountPath: /spiffe-workload-api
                      readOnly: true
  values:
    # Mirror mounted logins into Kubernetes Secrets and re-read them on an interval
    syncSecret:
      enabled: true
    enableSecretRotation: true
    rotationPollInterval: ${CREDENTIAL_ROTATION_INTERVAL}
    tokenRequests:
      - audience: openbao
    linux:
      driver:
        resources:
          requests:
            cpu: ${SECRETS_STORE_CSI_DRIVER_CPU_REQUEST}
            memory: ${SECRETS_STORE_CSI_DRIVER_MEM_REQUEST}
          limits:
            cpu: null
            memory: ${SECRETS_STORE_CSI_DRIVER_MEM_LIMIT}
      registrar:
        resources:
          requests:
            cpu: ${SECRETS_STORE_CSI_REGISTRAR_CPU_REQUEST}
            memory: ${SECRETS_STORE_CSI_REGISTRAR_MEM_REQUEST}
          limits:
            cpu: null
            memory: ${SECRETS_STORE_CSI_REGISTRAR_MEM_LIMIT}
      livenessProbe:
        resources:
          requests:
            cpu: ${SECRETS_STORE_CSI_LIVENESS_CPU_REQUEST}
            memory: ${SECRETS_STORE_CSI_LIVENESS_MEM_REQUEST}
          limits:
            cpu: null
            memory: ${SECRETS_STORE_CSI_LIVENESS_MEM_LIMIT}
