apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: secrets-store-csi-driver
  namespace: kube-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: secrets-store-csi-driver
  namespace: kube-system
spec:
  interval: 1h
  releaseName: secrets-store-csi-driver
  chart:
    spec:
      chart: secrets-store-csi-driver
      version: "${SECRETS_STORE_CSI_DRIVER_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: secrets-store-csi-driver
  values:
    # Mirror mounted logins into Kubernetes Secrets and re-read them on an interval
    syncSecret:
      enabled: true
    enableSecretRotation: true
    rotationPollInterval: ${CREDENTIAL_ROTATION_INTERVAL}
    linux:
      driver:
        resources:
          requests:
            cpu: ${SECRETS_STORE_CSI_DRIVER_CPU_REQUEST}
            memory: ${SECRETS_STORE_CSI_DRIVER_MEM_REQUEST}
          limits:
            cpu: null
            memory: ${SECRETS_STORE_CSI_DRIVER_MEM_LIMIT}
      registrar:
        resources:
          requests:
            cpu: ${SECRETS_STORE_CSI_REGISTRAR_CPU_REQUEST}
            memory: ${SECRETS_STORE_CSI_REGISTRAR_MEM_REQUEST}
          limits:
            cpu: null
            memory: ${SECRETS_STORE_CSI_REGISTRAR_MEM_LIMIT}
      livenessProbe:
        resources:
          requests:
            cpu: ${SECRETS_STORE_CSI_LIVENESS_CPU_REQUEST}
            memory: ${SECRETS_STORE_CSI_LIVENESS_MEM_REQUEST}
          limits:
            cpu: null
            memory: ${SECRETS_STORE_CSI_LIVENESS_MEM_LIMIT}
