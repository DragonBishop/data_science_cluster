# The chart ships no monitor
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: secrets-store-csi-driver
  namespace: kube-system
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: secrets-store-csi-driver
  podMetricsEndpoints:
    # Ghostunnel; SVIDs are named <namespace>.metrics.spiffe
    - port: metrics-tls
      scheme: https
      tlsConfig:
        serverName: kube-system.metrics.spiffe
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: secrets-store-csi-driver
  namespace: kube-system
spec:
  groups:
    - name: secrets-store-csi-driver
      rules:
        # Match the counter with or without OTel's _total suffix.
        - alert: CredentialRotationFailed
          expr: sum(increase({__name__=~"total_rotation_reconcile_error(_total)?"}[1h])) > 0
          labels:
            severity: warning
          annotations:
            summary: The Secrets Store CSI driver failed to refresh a mounted credential in the last hour
