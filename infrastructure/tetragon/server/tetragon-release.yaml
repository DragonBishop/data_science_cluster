apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tetragon
  namespace: kube-system
spec:
  interval: 24h
  # Not published to the cilium OCI repository
  url: https://helm.cilium.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tetragon
  namespace: kube-system
spec:
  interval: 1h
  driftDetection:
    mode: enabled
  releaseName: tetragon
  chart:
    spec:
      chart: tetragon
      version: "${TETRAGON_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: tetragon
  valuesFrom:
    - kind: ConfigMap
      name: tetragon-values
      valuesKey: values.yaml
  # Ghostunnel serves metrics to Prometheus; the chart has no extraContainers
  postRenderers:
    - kustomize:
        patches:
          # Chart monitors scrape Ghostunnel, not the loopback port; SVIDs are named <namespace>.metrics.spiffe
          - target:
              kind: ServiceMonitor
              name: (tetragon|tetragon-operator)
            patch: |
              - op: remove
                path: /spec/endpoints/0/port
              - op: add
                path: /spec/endpoints/0/targetPort
                value: metrics-tls
              - op: add
                path: /spec/endpoints/0/scheme
                value: https
              - op: add
                path: /spec/endpoints/0/tlsConfig
                value:
                  serverName: kube-system.metrics.spiffe
          # Host network, so its own host port
          - target:
              kind: DaemonSet
              name: tetragon
            patch: |
              - op: add
                path: /spec/template/metadata/labels/data-cluster~1metrics-tls
                value: "true"
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: spiffe-workload-api
                  csi:
                    driver: csi.spiffe.io
                    readOnly: true
              - op: add
                path: /spec/template/spec/containers/-
                value:
                  name: metrics-tls
                  image: ghostunnel/ghostunnel:${GHOSTUNNEL_VERSION}
                  args:
                    - server
                    - --listen=0.0.0.0:${TETRAGON_METRICS_TLS_PORT}
                    - --target=127.0.0.1:2112
                    - --use-workload-api-addr=unix:///spiffe-workload-api/spire-agent.sock
                    - --allow-uri=spiffe://cluster.internal/ns/observability/sa/prometheus
                  ports:
                    - name: metrics-tls
                      containerPort: ${TETRAGON_METRICS_TLS_PORT}
                      protocol: TCP
                  securityContext:
                    runAsUser: 65532
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: [ALL]
                    seccompProfile:
                      type: RuntimeDefault
                  resources:
                    requests:
                      cpu: ${METRICS_TLS_CPU_REQUEST}
                      memory: ${METRICS_TLS_MEM_REQUEST}
                    limits:
                      memory: ${METRICS_TLS_MEM_LIMIT}
                  volumeMounts:
                    - name: spiffe-workload-api
                      mountPath: /spiffe-workload-api
                      readOnly: true
          - target:
              kind: Deployment
              name: tetragon-operator
            patch: |
              - op: add
                path: /spec/template/metadata/labels/data-cluster~1metrics-tls
                value: "true"
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: spiffe-workload-api
                  csi:
                    driver: csi.spiffe.io
                    readOnly: true
              - op: add
                path: /spec/template/spec/containers/-
                value:
                  name: metrics-tls
                  image: ghostunnel/ghostunnel:${GHOSTUNNEL_VERSION}
                  args:
                    - server
                    - --listen=0.0.0.0:${METRICS_TLS_PORT}
                    - --target=127.0.0.1:2113
                    - --use-workload-api-addr=unix:///spiffe-workload-api/spire-agent.sock
                    - --allow-uri=spiffe://cluster.internal/ns/observability/sa/prometheus
                  ports:
                    - name: metrics-tls
                      containerPort: ${METRICS_TLS_PORT}
                      protocol: TCP
                  securityContext:
                    runAsUser: 65532
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: [ALL]
                    seccompProfile:
                      type: RuntimeDefault
                  resources:
                    requests:
                      cpu: ${METRICS_TLS_CPU_REQUEST}
                      memory: ${METRICS_TLS_MEM_REQUEST}
                    limits:
                      memory: ${METRICS_TLS_MEM_LIMIT}
                  volumeMounts:
                    - name: spiffe-workload-api
                      mountPath: /spiffe-workload-api
                      readOnly: true
