apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sensitive-files
spec:
  # Observe only: no matchActions
  kprobes:
    - call: security_file_permission
      syscall: false
      return: true
      args:
        - index: 0
          type: file
        # 0x04 MAY_READ, 0x02 MAY_WRITE
        - index: 1
          type: int
      returnArg:
        index: 0
        type: int
      selectors:
        # Paths as the reading container sees them
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /etc/shadow
                - /etc/gshadow
                - /etc/sudoers
                - /root/.ssh/
