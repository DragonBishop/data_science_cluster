apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  interval: 24h
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  values:
    resources:
      requests:
        cpu: ${CNPG_CPU_REQUEST}
        memory: ${CNPG_MEM_REQUEST}
      limits:
        memory: ${CNPG_MEM_LIMIT}
  interval: 1h
  releaseName: cnpg
  chart:
    spec:
      chart: cloudnative-pg
      version: "${CNPG_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: cnpg
