## Troubleshooting Checklist

- **Pods not running:** `kubectl describe pod <pod> -n databases` and check events/logs for CrashLoop or mount errors (e.g. PVC issues).  
- **Vault errors:** Check Vault logs (`kubectl logs vault-0 -n databases`). If login issues occur, verify Kubernetes Auth role and ServiceAccount setup (audience, namespace).  
- **CNPG cluster problems:** Use `kubectl cnpg status <cluster> -n databases` and check CNPG operator logs. Ensure the initdb owner matches the Vault username.  
- **MinIO issues:** `kubectl logs deployment/minio -n databases`. Ensure the `minio-storage` PVC is bound and the `minio-credentials` secret has the correct keys (`ACCESS_KEY_ID`, `ACCESS_SECRET_KEY`).  
- **Backup issues:** Check `ScheduledBackup` and `Backup` CRs (`kubectl get scheduledbackups -n databases`). Review CNPG operator logs for errors writing to S3.  
- **Shutdown problems:** If k3s hangs on stop, inspect `/var/log/k3s.log`. Confirm CNPG cluster was hibernated first; if not, manual `kubectl delete pod` may be required to unstick.  

All components should function without external cloud dependencies. For deeper details, refer to the official documentation linked above.

