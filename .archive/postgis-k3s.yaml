# k3s + Vault + CloudNativePG + MinIO Local Cluster

A self-contained Kubernetes stack for PostGIS development. This cluster uses **k3s** (lightweight Kubernetes) with **Cilium** for networking (eBPF-based) and supports the **Gateway API** for ingress routing. Secrets live in an in-cluster **HashiCorp Vault** (auto-unsealed via a host transit Vault) and are synced into Kubernetes by the **Vault Secrets Operator**. The **CloudNativePG** operator manages a PostgreSQL/PostGIS database cluster. A local **MinIO** instance provides S3-compatible storage for continuous WAL archiving and backups. **Falco** enforces runtime security by monitoring container activity. No application credentials are hardcoded – they originate in Vault and flow into Kubernetes as needed.

## Architecture

```mermaid
flowchart LR
    subgraph Host
        ExtVault[External Transit Vault]
    end
    subgraph k3s_Cluster
        direction LR
        Cilium[Cilium (CNI)]
        GatewayAPI[Gateway API Controller]
        Vault[Vault Server (no TLS)]
        VSO[Vault Secrets Operator]
        CNPG[CloudNativePG (Postgres)]
        MinIO[MinIO S3 Object Store]
        Falco[Sysdig Falco Security Agent]
    end
    ExtVault --> Vault
    Vault --> VSO
    VSO --> CNPG
    VSO --> MinIO
    CNPG --> MinIO
    Cilium --> GatewayAPI
    Cilium --> CNPG
    Cilium --> MinIO
    Falco --> CNPG
    Falco --> Vault
```

- **k3s** – a lightweight, fully compliant Kubernetes distribution suited for edge and homelab use.  
- **Cilium** – an open-source CNI providing high-performance networking and eBPF-based security policies.  
- **Gateway API** – Kubernetes-native APIs for advanced Ingress/L7 routing and LoadBalancing.  
- **HashiCorp Vault** – centralized secrets management (no TLS on internal listener, using NetworkPolicy for access control).  
- **Vault Secrets Operator (VSO)** – syncs secrets from Vault into Kubernetes `Secret`s.  
- **CloudNativePG (CNPG)** – Kubernetes operator for PostgreSQL/PostGIS (handles HA, replication, backups).  
- **MinIO** – high-performance S3-compatible object store for backups and WAL archives.  
- **Falco** – runtime security monitor for containers and hosts.  

