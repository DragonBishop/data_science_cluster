## Quick Start

1. **Install k3s:** Deploy a k3s server (single-node cluster). For example:
   ```bash
   curl -sfL https://get.k3s.io | sh -
   ```
2. **Install Cilium:** Apply Cilium CNI.
   ```bash
   kubectl create -f https://raw.githubusercontent.com/cilium/cilium/v1.9/install/kubernetes/quick-install.yaml
   ```
3. **Deploy Services:** Apply the YAML manifests (in order) for Vault, VSO, MinIO, and CloudNativePG. For example:
   ```bash
   kubectl apply -f 01-vso-setup.yaml   # Namespace and Vault auth
   kubectl apply -f vault-values.yaml   # Vault Helm chart values
   kubectl apply -f 02-minio-backups.yaml   # MinIO and secrets
   kubectl apply -f postgis-cluster.yaml    # CNPG/PostGIS cluster
   ```
4. **Verify:** Ensure all pods are Running. For example:
   ```bash
   kubectl get pods -n databases
   kubectl get svc -n databases
   ```
5. **Access Vault UI (if needed):** Vault is listening on port 8200 (HTTP). You can port-forward or use `kubectl port-forward vault-0 8200:8200 -n databases`.

| Command                                  | Purpose                                           |
|------------------------------------------|---------------------------------------------------|
| `k3s server`                             | Start the Kubernetes control plane      |
| `kubectl create -f <manifest>`           | Apply Kubernetes manifests (namespaces, deployments) |
| `kubectl annotate cluster <name> ...`    | CNPG: enable/disable hibernation     |
| `kubectl exec -n databases -it vault-0 -- sh` | Manually run Vault CLI inside the Vault pod       |
| `kubectl cnpg status <cluster>`          | Inspect CloudNativePG cluster status              |

## Daily Usage

- **Kubernetes:** Use `kubectl` to manage resources as usual. Check Pod status, logs, etc.  
- **Vault:** Use Vault CLI/HTTP API or UI for secrets. Secrets for applications should be written to Vault (e.g. `vault kv put secret/postgis username=... password=...`), and VSO will sync them into Kubernetes.  
- **Database:** Access the PostGIS database via the generated Service. For example, port-forward or use an internal service. CNPG exposes a Kubernetes Service (e.g. `postgis-cluster`).  
- **Monitoring:** View Pod logs (e.g. `kubectl logs -n databases <pod>`). Falco rules can be updated in `/etc/falco` or via ConfigMap to tune security alerts.  
- **Metrics & Logging:** By default, Vault, CNPG, and MinIO output logs to stdout in JSON; integrate with your logging or Prometheus stack as needed.

## Backup & Restore (WAL Archiving)

CloudNativePG supports continuous **WAL archiving** and base backups. In this setup, CNPG is configured to use the MinIO object store for backups (via the Barman Cloud plugin). The cluster archives WAL segments to S3, enabling point-in-time recovery (PITR).

```mermaid
sequenceDiagram
    participant CNPG as CNPG Operator
    participant PG as Postgres Primary
    participant MinIO as MinIO (S3)

    CNPG->>MinIO: Perform initial base backup
    PG-->>MinIO: Stream WAL segments (continuous archiving)
    Note over MinIO: Backups (base and WAL) stored for PITR
    MinIO-->>CNPG: (Restore on demand for PITR/recovery)
```

- **Configure Backups:** The `backup.barmanObjectStore` section in `postgis-cluster.yaml` points to MinIO (`s3://cnpg-backups/`) with credentials from Vault. No manual bucket creation is needed (the job `create-minio-bucket` handles it).  
- **Verify:** `kubectl get scheduledbackups -n databases` and `kubectl get backups` can show scheduled and completed backups.  
- **Restoration:** To restore, use `barman-cloud-restore` via CNPG or simply re-bootstrap a new cluster from the S3 backups/PITR using CloudNativePG commands (see CNPG docs).  

## Vault Setup Notes

- **Auto-unseal:** Vault is auto-unsealed on startup by contacting an external Transit Vault running on the host machine. No manual unsealing is required.  
- **TLS Disabled (Client):** Vault’s Kubernetes-facing listener runs without TLS by design; network isolation (NetworkPolicy) is used for security.  
- **Kubernetes Auth:** A `vault-auth` Kubernetes `ServiceAccount` is bound to a Vault role (`postgis-role`). VSO uses this SA’s token to authenticate. We set `audiences: ["vault"]` in the `VaultAuth` spec to satisfy K3s’s JWT validation (this is compatible with our K3s versions).  
- **Secrets Operator:** VSO watches CRDs (e.g. `VaultStaticSecret`) to sync secrets. Applications only see the resulting Kubernetes Secrets; Vault is the sole source of truth.

## Graceful Shutdown

Before stopping k3s (or the host), ensure the database is safely hibernated:

1. **Hibernation:** Annotate the CNPG cluster to hibernate. This cleanly stops Postgres (using its fast shutdown) and retains PVCs. For example:
   ```bash
   kubectl annotate cluster postgis-cluster -n databases cnpg.io/hibernation=on
   ```
   Wait for the status condition `cnpg.io/hibernation=Hibernated`. This ensures Postgres Pods are deleted gracefully without data loss.

2. **Stop k3s:** After hibernation, stop the k3s service:
   ```bash
   sudo kill -TERM $(pidof k3s)
   ```
   Allow up to ~15s for k3s to exit cleanly (draining etcd and the API). Do **not** SIGKILL immediately, as that could corrupt the datastore. If k3s does not stop, review logs (`/var/log/k3s.log`) before forcing it down.

On restart, start k3s first (`k3s server`), then it will recreate the previously hibernated CNPG cluster (Pods come back and resume operation).

## Design Principles

- **Kubernetes-Native:** Use standard K8s APIs and operators (e.g. CloudNativePG CRDs, CSI, NetworkPolicies).  
- **Secrets in Vault:** No hard-coded credentials in Git. All secrets live in Vault and sync into Kubernetes via VSO.  
- **Declarative Infrastructure:** All resources are declared in YAML (or Helm values); avoid imperative scripts where possible.  
- **Graceful Shutdown:** Application-level shutdown (CNPG hibernation) **before** stopping the host or Kubernetes service, to prevent data corruption.  
- **Persistent Storage:** Use PVCs (`ReadWriteOnce`) for data; MinIO uses a local-path PVC to survive pod restarts. This necessitates `strategy: Recreate` for MinIO (to avoid PVC attach conflicts).  
- **Reproducible Builds:** Every component can be rebuilt or redeployed from source/manifests. No opaque state outside these definitions.

