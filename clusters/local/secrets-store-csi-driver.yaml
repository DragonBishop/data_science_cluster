apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets-store-csi-driver
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  dependsOn:
    - name: cluster-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/secrets-store-csi-driver
  prune: true
  wait: true
  timeout: 3m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
