apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: databases-secrets
  namespace: flux-system
spec:
  interval: 1h
  dependsOn:
    - name: openbao
    - name: external-secrets
    - name: cluster-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/databases-secrets
  prune: true
  # Ready only once every ExternalSecret has written its Secret
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
