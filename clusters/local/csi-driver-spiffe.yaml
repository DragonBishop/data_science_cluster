apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-driver-spiffe
  namespace: flux-system
spec:
  interval: 1h
  dependsOn:
    - name: cert-manager
    - name: vault
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/csi-driver-spiffe
  prune: true
  wait: true
  timeout: 3m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: csi-driver-spiffe-approver
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: DaemonSet
      name: csi-driver-spiffe
      namespace: cert-manager