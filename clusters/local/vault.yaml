apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault
  namespace: flux-system
spec:
  interval: 1h
  dependsOn:
    - name: namespaces
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/vault
  prune: true
  wait: true
  timeout: 3m
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-config