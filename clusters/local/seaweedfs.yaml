apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seaweedfs
  namespace: flux-system
  labels:
    data-cluster/core: "true"
spec:
  interval: 1h
  retryInterval: 1m
  dependsOn:
    - name: cluster-config
    - name: namespaces
    - name: openbao
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/seaweedfs
  prune: true
  # Ready only once the HelmRelease's post-install hook has created the backup bucket
  wait: true
  timeout: 5m
  healthCheckExprs:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      current: >-
        status.conditions.exists(cond, cond.type == 'Ready' && cond.status == 'True' &&
        cond.observedGeneration == metadata.generation)
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
