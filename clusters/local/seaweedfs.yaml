apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seaweedfs
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  dependsOn:
    - name: cluster-config
    - name: namespaces
    - name: openbao-server
    - name: kube-prometheus-stack-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/seaweedfs
  prune: true
  # Waits for the post-install hook's backup bucket
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
