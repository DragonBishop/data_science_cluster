apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coredns-custom
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/coredns-custom
  prune: true
  wait: true
  timeout: 3m
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-config
