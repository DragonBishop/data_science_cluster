apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton-pipelines
  namespace: flux-system
spec:
  interval: 1h
  dependsOn:
    - name: tekton
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/tekton-pipelines
  prune: true
  wait: true
  timeout: 3m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
