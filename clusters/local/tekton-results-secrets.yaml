apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton-results-secrets
  namespace: flux-system
spec:
  interval: 1h
  dependsOn:
    - name: openbao
    - name: external-secrets
    # Dynamic logins join tekton_readwrite, which the databases Kustomization creates
    - name: databases
    - name: cluster-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/tekton-results-secrets
  prune: true
  # Ready only once the ExternalSecret has written its Secret
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
