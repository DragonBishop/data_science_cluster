apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: databases-objectstore
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  dependsOn:
    - name: openbao
    - name: databases-plugin
    - name: databases-security
    - name: seaweedfs
    - name: secrets-store-csi-driver
    - name: cluster-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/databases/objectstore
  prune: true
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
