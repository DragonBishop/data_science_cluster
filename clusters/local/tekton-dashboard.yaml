apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton-dashboard
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  dependsOn:
    # Pipelines' CRDs and aggregate view ClusterRoles
    - name: tekton-config
    # openbao-desktop-issuer
    - name: openbao-server
    - name: cluster-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/tekton/dashboard
  prune: true
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
