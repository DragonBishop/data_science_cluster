apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: databases-cluster
  namespace: flux-system
  labels:
    data-cluster/core: "true"
spec:
  interval: 1h
  retryInterval: 1m
  # databases-objectstore waits for postgres-bootstrap, which creates the Cluster this Kustomization then manages
  dependsOn:
    - name: databases-objectstore
    # The TCPRoute attaches to the shared Gateway
    - name: gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/databases/cluster
  prune: true
  wait: true
  # A recovery replays all archived WAL before the Cluster reports Ready
  timeout: 30m
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: status.?applied.orValue(false)
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: >-
        sets.contains(
        status.conditions.map(cond, cond.status == 'True', cond.type),
        ['Ready', 'ContinuousArchiving'])
    - apiVersion: gateway.networking.k8s.io/v1alpha2
      kind: TCPRoute
      current: >-
        status.?parents.orValue([]).exists(parent, sets.contains(
        parent.conditions.map(cond, cond.status == 'True' && cond.observedGeneration == metadata.generation, cond.type),
        ['Accepted', 'ResolvedRefs']))
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
