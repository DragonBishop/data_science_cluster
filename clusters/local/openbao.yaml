apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  dependsOn:
    - name: cert-manager
    - name: cluster-config
    - name: trust-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/openbao
  prune: true
  wait: true
  timeout: 3m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
