apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao
  namespace: flux-system
  labels:
    data-cluster/core: "true"
spec:
  interval: 1h
  retryInterval: 1m
  dependsOn:
    - name: cert-manager
    - name: cluster-config
    - name: trust-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/openbao
  prune: true
  wait: true
  timeout: 3m
  healthCheckExprs:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      current: >-
        status.conditions.exists(cond, cond.type == 'Ready' && cond.status == 'True' &&
        cond.observedGeneration == metadata.generation)
    - apiVersion: trust.cert-manager.io/v1alpha1
      kind: Bundle
      current: >-
        status.conditions.exists(cond, cond.type == 'Synced' && cond.status == 'True' &&
        cond.observedGeneration == metadata.generation)
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
