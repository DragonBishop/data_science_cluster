apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-operator
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  dependsOn:
    - name: openbao-server
    - name: kube-prometheus-stack-crds
    - name: cluster-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/cnpg-operator
  prune: true
  wait: true
  timeout: 3m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
