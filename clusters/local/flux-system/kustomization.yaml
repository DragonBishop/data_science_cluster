apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
- flux-networkpolicy.yaml
patches:
# SPIFFE Workload API socket for inter-controller mTLS
- target:
    kind: Deployment
    name: (source-controller|kustomize-controller|helm-controller|notification-controller)
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: all
    spec:
      template:
        spec:
          containers:
          - name: manager
            env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///spiffe-workload-api/spire-agent.sock
            volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
          volumes:
          - name: spiffe-workload-api
            csi:
              driver: csi.spiffe.io
              readOnly: true
- target:
    kind: Deployment
    name: source-controller
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --authorized-artifact-client-spiffe-id=spiffe://cluster.internal/ns/flux-system/sa/kustomize-controller
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --authorized-artifact-client-spiffe-id=spiffe://cluster.internal/ns/flux-system/sa/helm-controller
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --authorized-event-server-spiffe-id=spiffe://cluster.internal/ns/flux-system/sa/notification-controller
- target:
    kind: Deployment
    name: (kustomize-controller|helm-controller)
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --authorized-artifact-server-spiffe-id=spiffe://cluster.internal/ns/flux-system/sa/source-controller
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --authorized-event-server-spiffe-id=spiffe://cluster.internal/ns/flux-system/sa/notification-controller
- target:
    kind: Deployment
    name: notification-controller
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --authorized-notifier-spiffe-id=spiffe://cluster.internal/ns/flux-system/sa/source-controller
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --authorized-notifier-spiffe-id=spiffe://cluster.internal/ns/flux-system/sa/kustomize-controller
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --authorized-notifier-spiffe-id=spiffe://cluster.internal/ns/flux-system/sa/helm-controller
# Append Ghostunnel after the manager.
- target:
    kind: Deployment
    name: (source-controller|kustomize-controller|helm-controller|notification-controller)
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --metrics-addr=127.0.0.1:8080
    - op: add
      path: /spec/template/metadata/labels/data-cluster~1metrics-tls
      value: "true"
    - op: add
      path: /spec/template/spec/containers/-
      value:
        name: metrics-tls
        # renovate: datasource=docker depName=ghostunnel/ghostunnel
        image: ghostunnel/ghostunnel:v1.11.5
        args:
        - server
        - --listen=0.0.0.0:9445
        - --target=127.0.0.1:8080
        - --use-workload-api-addr=unix:///spiffe-workload-api/spire-agent.sock
        - --allow-uri=spiffe://cluster.internal/ns/observability/sa/prometheus
        ports:
        - name: metrics-tls
          containerPort: 9445
          protocol: TCP
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 32Mi
        volumeMounts:
        - name: spiffe-workload-api
          mountPath: /spiffe-workload-api
          readOnly: true
# openbao-root-ca Secret target for Provider el-flux-events
- target:
    kind: Namespace
    name: flux-system
  patch: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: flux-system
      labels:
        data-cluster/ca-bundles: "true"
# Above observed use, so Flux is evicted last
- target:
    kind: Deployment
    labelSelector: app.kubernetes.io/part-of=flux
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 160Mi
