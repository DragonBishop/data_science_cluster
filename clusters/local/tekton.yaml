apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton
  namespace: flux-system
  labels:
    data-cluster/core: "true"
spec:
  interval: 1h
  retryInterval: 1m
  dependsOn:
    - name: tekton-operator
    - name: cluster-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/tekton
  prune: true
  wait: true
  timeout: 5m
  healthCheckExprs:
    - apiVersion: operator.tekton.dev/v1alpha1
      kind: TektonConfig
      current: status.conditions.exists(cond, cond.type == 'Ready' && cond.status == 'True')
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
