apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: databases
  namespace: flux-system
spec:
  interval: 1h
  dependsOn:
    - name: openbao
    - name: barman-cloud
    - name: seaweedfs
    - name: gateway
    - name: databases-secrets
    - name: cluster-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/databases
  prune: true
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
