apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault-secrets-operator
  namespace: flux-system
spec:
  interval: 1h
  dependsOn:
    - name: vault
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/vault-secrets-operator
  prune: true
  wait: true
  timeout: 3m