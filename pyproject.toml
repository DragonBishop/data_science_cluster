[project]
name = "data_science_cluster"
description = "Python classes intended to orchestrate Extract, Transform, & Load (ETL) Data Pipelines and Machine Learning (ML) tasks."
readme = "README.md"
requires-python = ">=3.14.7"
dependencies = [
  "ansible>=14.3.1",
  "geoalchemy2>=0.20.0",
  "geopandas>=1.1.4",
  "hvac>=2.4.0",
  "ipykernel>=7.3.0",
  "jsonpatch>=1.33",
  "kubernetes>=36.0.3",
  "matplotlib>=3.11.1",
  "pandas>=3.0.5",
  "prefect>=3.8.4",
  "psycopg[binary]>=3.3.4",
  "sqlalchemy>=2.0.52",
  "vault-secrets>=1.0.4",
]
dynamic = ["version"]

[project.optional-dependencies]
etl = [
  "dbt-core>=1.12.3",
  "dbt-postgres>=1.11.0",
  "dlt>=1.30.0",
]
ml = [
  "scikit-learn>=1.3.2",
  "bentoml>=1.2.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "prek>=0.4.14",
  "molecule>=26.8.0",
]
lint = [
  "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  'class .*\bProtocol\):',
  '@(abc\.)?abstractmethod',
]

[tool.hatch.version]
path = "src/clusterpgis/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clusterpgis"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".venv",
  "uv.lock",
]

[tool.rumdl]
disable = ["MD013"]
exclude = ["CHANGELOG.md"]

[tool.rumdl.MD024]
siblings-only = true

[tool.uv]
default-groups = ["dev"]
