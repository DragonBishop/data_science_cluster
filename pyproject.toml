[project]
name = "data_science_cluster"
description = "k3s data science cluster: provisioning, ops tooling, and Python ETL/ML jobs built on the pgiscluster package."
readme = "README.md"
requires-python = ">=3.14.7"
authors = [{ name = "DragonBishop", email = "276789280+DragonBishop@users.noreply.github.com" }]
license = "MIT"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "pgiscluster>=0.2.0",
  "geopandas>=1.1.4",
  "hvac>=2.4.0",
  "kubernetes>=36.0.3",
  "pandas>=3.0.5",
  "psycopg[binary]>=3.3.5",
  "sqlalchemy>=2.0.52",
]
dynamic = ["version"]

[dependency-groups]
dev = [
  "ansible>=14.3.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "prek>=0.5.5",
  "molecule>=26.8.0",
  "jsonpatch>=1.33",
  "ansible-lint>=26.9.0",
]
lint = [
  "ruff>=0.17.0",
]
notebook = [
  "ipykernel>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  'class .*\bProtocol\):',
  '@(abc\.)?abstractmethod',
]

[tool.hatch.version]
path = "src/data_science_cluster/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/data_science_cluster"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".venv",
  "uv.lock",
]

[tool.rumdl]
disable = ["MD013"]
exclude = ["docs/CHANGELOG.md", "ansible/ansible_collections/dragonbishop/cluster/CHANGELOG.md"]

[tool.rumdl.MD024]
siblings-only = true

[tool.uv]
# 7-day supply-chain cooldown, first in tool.uv for Semgrep
exclude-newer = "7 days"
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
