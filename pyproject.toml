[project]
name = "data_science_cluster"
description = "k3s data science cluster: provisioning, ops tooling, and Python ETL/ML jobs built on the pgiscluster package."
readme = "README.md"
requires-python = ">=3.14.7"
authors = [{ name = "DragonBishop", email = "276789280+DragonBishop@users.noreply.github.com" }]
license = "MIT"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
version = "1.2.0"
dependencies = [
  "ansible>=14.3.1",
  "pgiscluster>=0.2.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "prek>=0.5.0",
  "molecule>=26.8.0",
  "jsonpatch>=1.33",
]
lint = [
  "ruff>=0.16.5",
]

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  'class .*\bProtocol\):',
  '@(abc\.)?abstractmethod',
]

[tool.rumdl]
disable = ["MD013"]
exclude = ["CHANGELOG.md"]

[tool.rumdl.MD024]
siblings-only = true

[tool.uv]
default-groups = ["dev"]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
