# seaweedfs-backups.yaml
#
# Deploys a single-process SeaweedFS server (master, volume server, filer, 
# and S3 gateway) to provide S3-compatible object storage for CloudNativePG 
# backups. Credentials are synchronized via Vault Secrets Operator.

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: seaweedfs-vault-secret
  namespace: databases
spec:
  type: kv-v2
  mount: secret
  path: seaweedfs
  destination:
    name: seaweedfs-credentials
    create: true
  refreshAfter: 1h
  vaultAuthRef: vault-auth
---
# Provides persistent storage for SeaweedFS's data directory.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-storage
  namespace: databases
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: databases
spec:
  replicas: 1
  # Uses Recreate strategy to safely unmount the ReadWriteOnce volume 
  # before starting a replacement pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
      - name: seaweedfs
        # Pins SeaweedFS to a specific release version.
        image: chrislusf/seaweedfs:4.40
        args:
          - server
          - -dir=/data
          - -s3
          - -s3.port=9000
          - -s3.config=/etc/seaweedfs/config.json
          - -master.volumeSizeLimitMB=1024
          # Caps the volume server at 100 volumes of 1024MB, matching the 100Gi
          # claim below. The default of 8 stops accepting writes at roughly 8GB
          # regardless of how much space the claim actually holds, which surfaces
          # as failed WAL archiving rather than as a storage error.
          - -volume.max=90
        # The S3 gateway is the only listener consumers use, so readiness gates
        # the Service on that port. Liveness watches the master port, which the
        # process holds for its entire life.
        readinessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 9333
          initialDelaySeconds: 30
          periodSeconds: 20
        ports:
        - name: s3
          containerPort: 9000
        - name: master
          containerPort: 9333
        - name: filer
          containerPort: 8888
        volumeMounts:
        - name: seaweedfs-storage
          mountPath: /data
        - name: s3-config
          mountPath: /etc/seaweedfs
          readOnly: true
      volumes:
      - name: seaweedfs-storage
        persistentVolumeClaim:
          claimName: seaweedfs-storage
      # Mounts the S3 gateway configuration (config.json) synchronized 
      # from Vault via the VaultStaticSecret.
      - name: s3-config
        secret:
          secretName: seaweedfs-credentials
          items:
            - key: config.json
              path: config.json
---
# Publishes the S3 gateway and the master port. The filer's HTTP API on 8888
# authenticates nothing of its own -- the identities in config.json guard the S3
# gateway alone -- so it is given no stable Service endpoint, and backups are
# reachable only through credentialed S3 calls on 9000.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-service
  namespace: databases
spec:
  ports:
  - name: s3
    port: 9000
    targetPort: 9000
  - name: master
    port: 9333
    targetPort: 9333
  selector:
    app: seaweedfs
---
# Idempotently creates the S3 bucket directory (/buckets/cnpg-backups) using
# the SeaweedFS shell.
#
# ttlSecondsAfterFinished removes the Job once it succeeds, so re-applying this
# manifest runs it again. A completed Job left in place is a no-op on re-apply,
# which would leave the bucket missing after SeaweedFS is rebuilt on a fresh
# volume -- a state that only surfaces at the first WAL archive attempt.
apiVersion: batch/v1
kind: Job
metadata:
  name: create-seaweedfs-bucket
  namespace: databases
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 12
  # A backstop across all retries. The wait inside the container is bounded too,
  # so a filer that never answers fails the attempt and lets backoffLimit run;
  # this deadline covers the case where the pod itself cannot make progress.
  activeDeadlineSeconds: 600
  template:
    spec:
      containers:
      - name: weed-shell
        image: chrislusf/seaweedfs:4.40
        command:
        - /bin/sh
        - -c
        - |
          MASTER=seaweedfs-service.databases.svc.cluster.local:9333

          # Polls the filer through the master until it answers, rather than
          # sleeping a fixed interval and hoping the server arrived first. The
          # cap is finite: a filer that never answers fails this attempt and
          # hands control back to restartPolicy rather than waiting forever.
          waited=0
          until weed shell -master="$MASTER" -c "fs.ls /" > /dev/null 2>&1; do
            if [ "$waited" -ge 120 ]; then
              echo "SeaweedFS filer did not answer within 120s."
              exit 1
            fi
            echo "   ...waiting for the SeaweedFS filer to answer... (${waited}s elapsed)"
            sleep 3
            waited=$((waited + 3))
          done

          weed shell -master="$MASTER" -c "fs.mkdir /buckets" > /dev/null 2>&1 || true
          weed shell -master="$MASTER" -c "fs.mkdir /buckets/cnpg-backups" > /dev/null 2>&1 || true

          # The shell exits 0 whether or not the command it ran succeeded, so
          # the directory listing is what determines the Job's exit status and
          # lets restartPolicy retry a creation that silently did nothing.
          weed shell -master="$MASTER" -c "fs.ls /buckets" | grep -q cnpg-backups
      restartPolicy: OnFailure