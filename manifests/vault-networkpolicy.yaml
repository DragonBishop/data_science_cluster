# ============================================================================
# Vault Ingress CiliumNetworkPolicy
# ============================================================================
# This policy restricts ingress traffic to the in-cluster Vault API. 
#
# Egress is deliberately left unrestricted to ensure Vault can successfully reach 
# the host Transit Vault for auto-unseal operations and the Kubernetes API for 
# token reviews. Restricting egress risks breaking the unseal process, which 
# would subsequently take all cluster secrets offline.
#
# A CiliumNetworkPolicy is utilized instead of a standard Kubernetes 
# NetworkPolicy because standard policies cannot express the required 'host' 
# entity matching utilized for port-forwarding operations.

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vault-ingress
  namespace: vault
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  ingress:
    # The Vault Secrets Operator: the only in-cluster client of Vault's API.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: vault-secrets-operator-system
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP

    # The node itself. `kubectl port-forward -n vault vault-0 8200:8200`
    # arrives from kubelet carrying Cilium's reserved:host identity rather
    # than a pod identity, so a pod-label-only policy would break it.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP

# ============================================================================
# FUTURE INTEGRATION: PROMETHEUS SCRAPING
# ============================================================================
# When deploying the kube-prometheus-stack to support ETL pipelines and 
# observability, this policy must be updated to permit Prometheus to scrape 
# Vault's metrics. Vault serves Prometheus metrics on the standard API port 
# (8200) at /v1/sys/metrics?format=prometheus.
#
# Enabling this integration requires the following three steps:
#
# 1. Authorize Metrics Access
#    Provide Prometheus with a read-only bearer token scoped strictly to the 
#    sys/metrics path. Alternatively, set 
#    `telemetry { unauthenticated_metrics_access = true }` in the Vault 
#    server configuration. The token method is strictly preferred to maintain 
#    access control on port 8200.
#
# 2. Configure the Scrape Target
#    Configure the HashiCorp Vault Helm chart to emit a ServiceMonitor rather 
#    than writing manual scrape configurations. Verify the configuration path:
#    `helm show values hashicorp/vault | grep -B2 -A20 serverTelemetry`
#
# 3. Update the CiliumNetworkPolicy
#    Uncomment the block below, append it to `spec.ingress`, and replace 
#    MONITORING_NAMESPACE with the actual installation namespace (commonly 
#    `monitoring`, verifiable via `kubectl get pods -A | grep prometheus`).
#    Note: A selector matching nothing fails silently. Always verify application.
#
#    - fromEndpoints:
#        - matchLabels:
#            k8s:io.kubernetes.pod.namespace: MONITORING_NAMESPACE
#            app.kubernetes.io/name: prometheus
#      toPorts:
#        - ports:
#            - port: "8200"
#              protocol: TCP

# ============================================================================
# ROLLOUT AND AUDITING PROCEDURE
# ============================================================================
# Cilium provides a PolicyAuditMode to log traffic that would be dropped by 
# a policy without actively denying it. Utilize this workflow on initial 
# application and after any subsequent modifications (e.g., adding Prometheus).
#
# 1. Enable Audit Mode:
#    kubectl -n kube-system exec ds/cilium -- cilium-dbg endpoint list | grep vault
#    kubectl -n kube-system exec ds/cilium -- cilium-dbg endpoint config <ENDPOINT_ID> PolicyAuditMode=Enabled
#
# 2. Apply and Monitor:
#    kubectl apply -f manifests/vault-networkpolicy.yaml
#    kubectl -n kube-system exec ds/cilium -- cilium-dbg monitor --type policy-verdict
#
# 3. Validate and Enforce:
#    Exercise the Vault Secrets Operator and establish a port-forward session. 
#    Confirm only expected traffic flows appear in the audit log. Once 
#    validated, enforce the policy:
#    kubectl -n kube-system exec ds/cilium -- cilium-dbg endpoint config <ENDPOINT_ID> PolicyAuditMode=Disabled

# ============================================================================
# ARCHITECTURAL SCOPE: RULES NOT PRESENT
# ============================================================================
# The following ingress rules are intentionally omitted based on the current 
# standalone architecture parameters:
#
# * Port 8201 (Cluster/HA Traffic): This deployment utilizes a single replica 
#   with file storage. If migrating to High Availability (HA) with Integrated 
#   Raft Storage, a `vault -> vault` ingress rule on port 8201 is strictly 
#   required to prevent replication and active-node request forwarding failures.
#
# * Ingress Controller / Gateway API: The Vault UI is currently accessed via 
#   port-forwarding. Exposing the UI externally via a Gateway API requires a 
#   new ingress rule admitting traffic from the Gateway's pods.